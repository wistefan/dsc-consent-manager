# =============================================================================
# Consent Manager — Docker Compose for Local Development
# =============================================================================
# Usage:
#   1. (Optional) Copy .env.sample to .env and adjust values if needed
#   2. docker compose up -d --build
#   3. Health check: curl http://localhost:${MANAGEMENT_PORT:-9090}/health/readiness
#      (management port, at the origin root - see endpoints.all in application.yml)
#   4. API base:     http://localhost:8080/v1
#   5. Contract Service stub (WireMock): http://localhost:${WIREMOCK_PORT:-8081}
#      (contracts in docker/wiremock, see its README.md)
#   6. End-to-end check: docker/smoke-test.sh (see docker/README.md)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  consent-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "${MANAGEMENT_PORT:-9090}:${MANAGEMENT_PORT:-9090}"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        # Contracts are fetched on demand and retried, so started is enough.
        condition: service_started
      keycloak:
        # service_healthy, NOT service_started. Keycloak needs ~30-60s with --import-realm
        # before /realms/consent-manager/.well-known/... answers, while this container is
        # up in a fraction of that. From step 3 on, losing that race is recoverable -
        # discovery is retried with bounded backoff and readiness stays DOWN meanwhile -
        # but waiting here means `docker compose up` reaches a usable stack directly
        # instead of spending the first backoff windows rejecting every token.
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Override DB_URL to point to the 'postgres' service within the Docker network
      DB_URL: jdbc:postgresql://postgres:5432/consent_manager
      # Use dev environment for local development. Security is ENABLED here: dev points
      # the trust list at the local Keycloak below and rejects every token it cannot
      # verify. Only the `test` environment disables security.
      MICRONAUT_ENVIRONMENTS: dev
      # Override the trust-list entry to reach Keycloak inside the Docker network.
      #
      # IDP_ISSUER is the value a token's `iss` claim is matched against, byte for byte,
      # and is also compared against the `issuer` field of the discovery document.
      # KC_HOSTNAME on the keycloak service below pins that claim to this exact URL,
      # so a token obtained from the host (http://localhost:8180/...) still carries
      # `iss: http://keycloak:8180/...` and is accepted here.
      IDP_ISSUER: http://keycloak:${KEYCLOAK_PORT:-8180}/realms/consent-manager
      IDP_DISCOVERY_URL: http://keycloak:${KEYCLOAK_PORT:-8180}/realms/consent-manager/.well-known/openid-configuration
      # The stubbed Contract Service below, never a real one.
      CONTRACT_SERVICE_URL: http://wiremock:8080
      # Receipts are signed with an ephemeral key (the dev profile's default). To exercise
      # the production file form instead, put a private JWK at docker/keys/signing-key.jwk
      # (git-ignored, see .env.sample for how to generate one) and uncomment this line
      # together with the volume below.
      # RECEIPTS_SIGNING_KEY_FILE: /etc/consent-manager/keys/signing-key.jwk
    # volumes:
    #   - ./docker/keys:/etc/consent-manager/keys:ro
    # Same posture as the Helm chart: nothing writable but /tmp, no capabilities, no
    # privilege escalation. The image runs as a numeric non-root user (docker/Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Management endpoints sit at the origin root of their own port, outside
      # ${API_PREFIX}. Pinned by ManagementEndpointSecurityIT.
      #
      # `/health/readiness` rather than the aggregate `/health`, so this reports
      # "can serve traffic" — it covers the datasource and the identity-provider
      # registry, which is DOWN until OIDC discovery against keycloak succeeds.
      # A restart policy must never act on this signal: restarting cannot fix an
      # identity provider's outage. `restart: unless-stopped` below does not
      # restart on unhealthy, so the container goes unhealthy, drains, and
      # recovers on its own once discovery retries succeed.
      test: ["CMD-SHELL", "wget -qO- http://localhost:${MANAGEMENT_PORT:-9090}/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped
    networks:
      - consent-manager-net

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: consent_manager
      POSTGRES_USER: ${DB_USER:-consent_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-consent_manager}
    volumes:
      # Renamed from `postgres-data` when the image moved from Debian (glibc) to Alpine
      # (musl): the two collate text differently, and opening a glibc-initialised cluster
      # under musl risks silently wrong index lookups. A fresh name makes every stack
      # reinitialise; the old volume can be removed - see docker/README.md.
      - postgres16-alpine-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-consent_manager} -d consent_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - consent-manager-net

  # ---------------------------------------------------------------------------
  # Keycloak — local OpenID Connect provider
  # ---------------------------------------------------------------------------
  # Supplies the single trust-list entry configured in application-dev.yml so
  # `docker compose up` has a real issuer to discover. `application-dev.yml` enables
  # security, so this container is genuinely exercised: the app fetches the realm's
  # discovery document, reads its jwks_uri and verifies bearer tokens against it.
  # Development mode only: in-memory storage, plain HTTP, no production hardening.
  #
  # The `consent-manager` realm is imported at startup from
  # docker/keycloak/consent-manager-realm.json: it defines the consent-user,
  # consent-participant and consent-catalog roles, a `participant_id` claim mapper
  # and an audience mapper for `consent-manager`, matching the trust-list entry in
  # application-dev.yml. Test users (test-user / test-participant / test-participant-2 /
  # test-catalog, password `test-password`) are included for manual probing; the two
  # participants are the provider and consumer of the docker/wiremock contracts.
  #
  # KC_HOSTNAME pins the issuer to the in-network URL so the `iss` claim is the same
  # whichever side asks. Without it Keycloak derives the issuer from the request host
  # and a token fetched from the host would carry `iss: http://localhost:8180/...`,
  # which will not match the configured issuer once tokens are validated per provider.
  # A developer fetching tokens from the host therefore uses
  # http://localhost:${KEYCLOAK_PORT:-8180}/realms/consent-manager/protocol/openid-connect/token
  # and receives a token whose `iss` is the keycloak:${KEYCLOAK_PORT:-8180} URL. To make
  # the URLs inside the discovery document resolve from the host as well, add
  # `127.0.0.1 keycloak` to /etc/hosts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --http-port=${KEYCLOAK_PORT:-8180}
      - --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8180}:${KEYCLOAK_PORT:-8180}"
    volumes:
      - ./docker/keycloak/consent-manager-realm.json:/opt/keycloak/data/import/consent-manager-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed issuer/frontend URL - see the note above.
      KC_HOSTNAME: http://keycloak:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      # Exposes /health/ready on the management port for the healthcheck below.
      KC_HEALTH_ENABLED: "true"
      # Pins the management port rather than relying on its default, so the port the
      # healthcheck dials cannot drift from the one Keycloak listens on.
      KC_HTTP_MANAGEMENT_PORT: ${KEYCLOAK_MANAGEMENT_PORT:-9000}
    # consent-manager depends on this being *healthy*, so the check has to mean "serving", not
    # "process started". The image ships neither curl nor wget, so the readiness endpoint
    # is polled over bash's /dev/tcp; `start-dev --import-realm` reaches ready well inside
    # start_period + interval * retries.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/${KEYCLOAK_MANAGEMENT_PORT:-9000}; echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q ''"status": "UP"'' <&3'
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped
    networks:
      - consent-manager-net

  # ---------------------------------------------------------------------------
  # WireMock — stubbed Contract Service (local development only)
  # ---------------------------------------------------------------------------
  # Serves the contracts in docker/wiremock/__files on the two endpoints
  # ContractServiceClient calls; see docker/wiremock/README.md. Published on the
  # host at the port application.yml's CONTRACT_SERVICE_URL default names, so
  # `./mvnw mn:run` reaches it too. Pinned to the WireMock version the tests use.
  wiremock:
    image: wiremock/wiremock:3.10.0
    ports:
      - "${WIREMOCK_PORT:-8081}:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    restart: unless-stopped
    networks:
      - consent-manager-net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres16-alpine-data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  consent-manager-net:
    driver: bridge
