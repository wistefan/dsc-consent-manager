# =============================================================================
# Consent Manager — Docker Compose for Local Development
# =============================================================================
# Usage:
#   1. (Optional) Copy .env.sample to .env and adjust values if needed
#   2. docker compose up -d
#   3. Health check: curl http://localhost:${MANAGEMENT_PORT:-9090}${API_PREFIX:-/v1}/health
#   4. API base:     http://localhost:8080/v1
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "${MANAGEMENT_PORT:-9090}:${MANAGEMENT_PORT:-9090}"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      # Override DB_URL to point to the 'db' service within the Docker network
      DB_URL: jdbc:postgresql://db:5432/consent_manager
      # Use dev environment for local development (relaxed security)
      MICRONAUT_ENVIRONMENTS: dev
      # Override the trust-list entry to reach Keycloak inside the Docker network.
      IDP_ISSUER: http://keycloak:${KEYCLOAK_PORT:-8180}/realms/consent-manager
      IDP_DISCOVERY_URL: http://keycloak:${KEYCLOAK_PORT:-8180}/realms/consent-manager/.well-known/openid-configuration
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${MANAGEMENT_PORT:-9090}${API_PREFIX:-/v1}/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped
    networks:
      - consent-manager-net

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: consent_manager
      POSTGRES_USER: ${DB_USER:-consent_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-consent_manager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-consent_manager} -d consent_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - consent-manager-net

  # ---------------------------------------------------------------------------
  # Keycloak — local OpenID Connect provider
  # ---------------------------------------------------------------------------
  # Supplies the single trust-list entry configured in application-dev.yml so
  # `docker compose up` has a real issuer to discover. Development mode only:
  # in-memory storage, plain HTTP, no production hardening.
  #
  # A bare `start-dev` Keycloak has no `consent-manager` realm yet, so discovery
  # returns 404 until you create one in the admin console at
  # http://localhost:${KEYCLOAK_PORT:-8180} (admin/admin by default). That is
  # deliberately non-fatal: an unresolvable provider leaves the app running and
  # readiness DOWN, and discovery is retried with backoff.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=${KEYCLOAK_PORT:-8180}"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:${KEYCLOAK_PORT:-8180}"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    networks:
      - consent-manager-net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  consent-manager-net:
    driver: bridge
