# Builds and tests the service. `verify` runs the whole suite, so the Spectral lint (SpecLintIT),
# the oasdiff breaking-change check (SpecCompatibilityIT) and both JaCoCo gates fail this job.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The spec ITs must have run every case; a skip would let a lint or breaking-change failure pass.
      REQUIRED_ITS: SpecLintIT SpecCompatibilityIT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers needs Docker for PostgreSQL, Keycloak, Spectral and oasdiff; fail fast without it.
      - name: Check Docker
        run: docker info --format 'Docker {{.ServerVersion}}'

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Require the spec checks to have run
        run: |
          for it in $REQUIRED_ITS; do
            report="target/failsafe-reports/TEST-com.seamware.consentmanager.api.${it}.xml"
            if [ ! -f "$report" ]; then
              echo "::error::$it did not run"; exit 1
            fi
            if ! grep -Eq '<testsuite [^>]*skipped="0"' "$report"; then
              echo "::error::$it skipped cases"; exit 1
            fi
          done

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
