# Publishes the pushed main commit as image and GitHub release X.Y.Z, where X.Y.Z is the latest
# tag bumped by the merged PR's major/minor/patch label. Holds everything that reads or writes
# release tags, so the caller serialises it as a whole. The X.Y.Z tag is the last thing written:
# a run that fails before it can be re-run whole, and one that wrote it is superseded on re-run.
name: Publish

on:
  workflow_call:
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  # Test runs finish in any order, so an older commit can arrive after a newer one was released.
  # Superseded when the latest release tag already contains this commit, a re-run included.
  check-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the latest release tag
        id: check
        shell: bash
        run: |
          latest_tag=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$latest_tag" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$latest_tag"; then
            echo "::notice::$GITHUB_SHA is already released by $latest_tag; nothing to publish"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

  # On a push it resolves the merged PR's label; a commit pushed without a PR fails here.
  generate-version:
    needs: check-superseded
    if: needs.check-superseded.outputs.superseded != 'true'
    uses: FIWARE/github-workflows/.github/workflows/semver-version.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      tag-prefix: ""

  build-and-push:
    needs: [check-superseded, generate-version]
    if: needs.check-superseded.outputs.superseded != 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      version: ${{ needs.generate-version.outputs.version }}
    secrets:
      registry-username: ${{ secrets.QUAY_USERNAME }}
      registry-password: ${{ secrets.QUAY_PASSWORD }}

  git-release:
    needs: [check-superseded, generate-version, build-and-push]
    if: needs.check-superseded.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # An existing release or tag for this version is a bug and is never overwritten.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.generate-version.outputs.version }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::Release $VERSION already exists"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Image: $IMAGE" --generate-notes LICENSE
