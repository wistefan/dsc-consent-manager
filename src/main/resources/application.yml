micronaut:
  application:
    name: consent-manager

  server:
    port: ${PORT:8080}
    context-path: ${API_PREFIX:/v1}

  router:
    # Static resources for Swagger UI and the OpenAPI specification.
    # The openapi.yaml is copied from api/ to target/classes/static/ at build time.
    static-resources:
      swagger-ui:
        paths: classpath:static/swagger-ui
        mapping: /swagger-ui/**
      openapi-spec:
        paths: classpath:static
        mapping: /static/**

  security:
    enabled: true
    # Allow unauthenticated access to the health endpoints.
    #
    # These patterns are matched against the request path with the server context
    # path already stripped, so `/swagger-ui/**` still covers `${API_PREFIX}/swagger-ui/**`.
    # ManagementEndpointSecurityIT pins that, including a control case that tightens
    # the Swagger UI entry and requires the request to be challenged.
    #
    # Note that `endpoints.all.port` moves management endpoints to their own port but
    # does NOT take them out of the context path: the health endpoint is reached at
    # `http://<host>:${MANAGEMENT_PORT}${API_PREFIX}/health`. That is the URL the
    # compose healthcheck and any orchestrator probe must use.
    #
    # Both `/health` and `/health/**` are listed: the bare path is what a liveness
    # probe actually requests, and relying on `/**` to also match the empty remainder
    # is an assumption about the matcher rather than something this file states.
    intercept-url-map:
      - pattern: /health
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /health/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /static/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /metrics/**
        http-method: GET
        access:
          - isAuthenticated()
      - pattern: /prometheus/**
        http-method: GET
        access:
          - isAuthenticated()
    # -------------------------------------------------------------------------
    # Trusted OpenID Connect providers - issuer half of the trust list
    # -------------------------------------------------------------------------
    # Each entry under `oauth2.clients` declares one trusted issuer. From the
    # `openid.issuer` URL alone Micronaut Security fetches the provider's discovery
    # document, reads its `jwks_uri` and registers a JWKS-backed signature
    # configuration, so no discovery or JWKS URL has to be configured separately.
    #
    # No `client-id` or `client-secret` is set. This service is a resource server: it
    # runs no OAuth2 flow, issues no token and stores no credential.
    #
    # Every client here MUST have a matching `consent-manager.identity-providers.<name>`
    # entry below (and vice versa) or startup fails - see IdentityProviderRegistryValidator.
    #
    # EXACTLY ONE PROVIDER IS ACCEPTED FOR NOW, and it must be named `primary`. A
    # second entry is a startup failure, not a warning: it would be able to forge
    # tokens for the first. Multi-provider support arrives in step 5.
    #
    # Environment variables can only OVERRIDE values of a provider already declared
    # here; they cannot ADD one. A name that appears only in an environment variable
    # never becomes a configuration entry and is silently ignored.
    #
    # Why discovery and JWKS are delegated to the framework, what it does NOT do, and
    # which interim guards that forced into this file:
    #   docs/adr/0001-delegate-oidc-discovery-and-jwks-to-micronaut-security.md
    # Keep framework-behaviour details in that ADR, not here - there is one artefact
    # to re-verify on a Micronaut upgrade rather than several copies to drift apart.
    oauth2:
      # micronaut-security-oauth2 enables an anonymous metadata surface by default
      # that publishes the configured issuer URLs, and a 401 challenge provider that
      # points at it. This service discloses nothing about which issuers it trusts,
      # so both are switched off. The two flags are INDEPENDENT: `enabled: false`
      # gates only the controller. Rationale and the verified framework behaviour:
      # docs/adr/0001-delegate-oidc-discovery-and-jwks-to-micronaut-security.md
      # TokenSignatureEnforcementIT pins both flags against the real property sources.
      protected-resource-metadata:
        # Removes GET /.well-known/oauth-protected-resource.
        enabled: false
        # Removes `resource_metadata="..."` from the WWW-Authenticate header.
        www-authenticate: false
      clients:
        primary:
          openid:
            issuer: ${IDP_ISSUER:}

    # Micronaut's own JWT support is left ENABLED: the flag gates the whole
    # `io.micronaut.security.token.jwt` package, including the JWKS-backed signature
    # beans the OpenID clients above feed, so turning it off would remove signature
    # verification altogether rather than merely disabling the built-in validator.
    # UnsignedTokenRejector then keeps the set of signature configurations non-empty;
    # see the ADR referenced above for why that is required.
    token:
      jwt:
        enabled: true
        claims-validators:
          # INTERIM GUARD - remove when ConsentManagerTokenValidator lands (step 5).
          #
          # Without these two keys the built-in validator applies only the expiration
          # and subject-not-null checks, so ANY token signed by a trusted issuer's key
          # authenticates whatever its `aud` - and the intercept-url-map above already
          # grants `isAuthenticated()` access to /metrics and /prometheus.
          #
          # They are not equally strict: `audience` is an exact match, `issuer` is a
          # protocol-stripped SUFFIX match, NOT an equality test. Step 5 must replace
          # it with a byte-for-byte per-provider comparison rather than assume one is
          # already in force. TokenSignatureEnforcementIT pins the gap. Details:
          # docs/adr/0001-delegate-oidc-discovery-and-jwks-to-micronaut-security.md
          #
          # Both hold a single global value, which is one of the two reasons the trust
          # list is capped at one entry. These reference the two properties rather than
          # `${IDP_*}` so they follow the configured value however it was set;
          # IdentityProviderRegistryValidator asserts at startup that both actually
          # resolve to the sole provider's issuer and audience.
          issuer: ${micronaut.security.oauth2.clients.primary.openid.issuer}
          audience: ${consent-manager.identity-providers.primary.audience}

  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    # HikariCP pool settings
    minimum-idle: 2
    maximum-pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Serve management endpoints on a dedicated port so they can be exposed to an
    # orchestrator without exposing the API port. The dedicated port does NOT take
    # them out of `micronaut.server.context-path`: with a context path of /v1 the
    # health endpoint is at http://<host>:${MANAGEMENT_PORT}/v1/health, which is
    # what compose.yaml's healthcheck probes. ManagementEndpointSecurityIT pins it.
    port: ${MANAGEMENT_PORT:9090}
  health:
    enabled: true
    sensitive: false
    details-visible: AUTHENTICATED
    # Health indicators (DiskSpaceHealthIndicator, JdbcHealthIndicator) are
    # auto-discovered from the classpath — no explicit enablement needed.
  metrics:
    enabled: true
    sensitive: true
  prometheus:
    enabled: true
    sensitive: true

# OpenTelemetry tracing configuration.
# The Micronaut OTel module autoconfigures the SDK from standard OTel environment
# variables (OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_TRACES_EXPORTER).
# Trace IDs and span IDs are automatically added to the SLF4J MDC for log correlation.
tracing:
  opentelemetry:
    enabled: ${OTEL_TRACING_ENABLED:true}
  exclusions:
    - /health/**
    - /metrics/**
    - /prometheus/**
    - /swagger-ui/**
    - /static/**

# Custom application configuration bound to environment variables
consent-manager:
  url: ${CONSENT_MANAGER_URL:`http://localhost:8080`}
  contract-service-url: ${CONTRACT_SERVICE_URL:`http://localhost:8081`}

  # ---------------------------------------------------------------------------
  # Identity provider trust list - claim half
  # ---------------------------------------------------------------------------
  # One entry per trusted provider, keyed by the SAME name as the
  # `micronaut.security.oauth2.clients.<name>` entry above. The two halves are
  # joined at startup; a name present in only one of them aborts startup.
  #
  # This block holds only what Micronaut Security cannot express: a per-provider
  # audience, clock skew, claim paths (which may be nested) and role mapping.
  # Issuer, discovery and signing-key caching are Micronaut's job, not ours.
  #
  # The trust list is read ONCE at startup and is immutable for the lifetime of the
  # process: no runtime reload, no admin endpoint, no auto-registration. Adding,
  # removing or re-pointing a provider requires a config change and a restart.
  #
  # Startup FAILS when the list is empty or any entry is malformed. `IDP_ISSUER` and
  # `IDP_AUDIENCE` intentionally have no default, so a deployment that forgets to
  # configure an IdP aborts at startup with a message naming the missing property
  # rather than silently trusting something.
  identity-providers:
    primary:
      audience: ${IDP_AUDIENCE:}
      # Tolerance applied to the exp, iat and nbf claims.
      clock-skew: ${IDP_CLOCK_SKEW:30s}
      # Claim names are per provider. Each may be a dot-separated nested path.
      claims:
        user-identifier: ${IDP_CLAIM_USER_IDENTIFIER:sub}
        participant-identifier: ${IDP_CLAIM_PARTICIPANT_IDENTIFIER:participant_id}
        roles: ${IDP_CLAIM_ROLES:realm_access.roles}
      # Maps this service's roles to the raw role strings the provider emits.
      # Keys are written in lower case so that an override replaces the configured
      # value instead of adding a second entry for the same role.
      role-mapping:
        user: ${IDP_ROLE_USER:consent-user}
        participant: ${IDP_ROLE_PARTICIPANT:consent-participant}
        catalog: ${IDP_ROLE_CATALOG:consent-catalog}
