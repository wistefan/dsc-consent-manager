micronaut:
  application:
    name: consent-manager

  server:
    port: ${PORT:8080}
    # No `context-path`: only API controllers sit under `consent-manager.api-prefix`;
    # management endpoints, Swagger UI and the `@OriginRoot` JWKS stay at the origin root.

  router:
    # Swagger UI and the bundled spec (target/classes/static/openapi.yaml). `/*.yaml`, not
    # the literal path: an exact mapping resolves to `index.html`.
    static-resources:
      swagger-ui:
        paths: classpath:static/swagger-ui
        mapping: /swagger-ui/**
      openapi-spec:
        paths: classpath:static
        mapping: /*.yaml

  serde:
    serialization:
      # Publishes required empty arrays (e.g. `User.participants: []`) while still omitting
      # nulls. Deliberately global: the generator offers no per-schema inclusion hook.
      inclusion: non-absent

  security:
    enabled: true

    # Bearer JWT only; enabled basic auth would add a `Basic` challenge to every 401.
    basic-auth:
      enabled: false

    # A resource server refuses, never redirects to a login (else `text/html` gets a 303).
    redirect:
      enabled: false

    # Unrouted requests are refused like unauthorised ones, so the URL space cannot be
    # mapped; this also refuses a route lacking `@Secured`. Never add a `/**` catch-all.
    reject-not-found: true

    # Only the oauth2 module's discovery components are used (ADR-0003). Its RFC 9728
    # beans default to ENABLED and would publish this service's base URL and issuers;
    # `www-authenticate` is a separate switch. Keep this the only `oauth2` key in the file.
    oauth2:
      protected-resource-metadata:
        enabled: false
        www-authenticate: false

    # Anonymous access to health, Swagger UI and the spec, matched on the full path. API
    # routes are governed by `@Secured`; metrics by `endpoints.<id>.sensitive` below.
    intercept-url-map:
      - pattern: /health
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /health/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /openapi.yaml
        http-method: GET
        access:
          - isAnonymous()
    # Enabled for the `TokenValidator` SPI `ConsentManagerTokenValidator` plugs into. No
    # global issuer/audience validators: each provider in the trust list has its own.
    token:
      jwt:
        enabled: true

        # Security control: the module's own validator would be a laxer path beside
        # `ConsentManagerTokenValidator`. See ADR-0005.
        nimbus:
          validator: false
          reactive-validator: false

  # JWK Set cache. Naming it `jwks` selects `CacheableJwkSetFetcher`. The TTL bounds the
  # outage after a key rotation, so raising it buys rotation downtime. See ADR-0004.
  caches:
    jwks:
      expire-after-write: ${IDP_JWKS_CACHE_TTL:60s}

    # Contracts by URI, written by `ContractGateway` (never a miss). The TTL bounds how
    # stale a freshly generated notice's contract may be; set via contract-service.cache-ttl.
    contracts:
      expire-after-write: ${consent-manager.contract-service.cache-ttl}
      maximum-size: ${CONTRACT_SERVICE_CACHE_MAX_SIZE:1000}

    # Catalog self-descriptions by URL; only a parsed document is stored. May live longer
    # than `contracts`: staleness here costs a label, not a legal statement.
    self-descriptions:
      expire-after-write: ${consent-manager.self-description.cache-ttl}
      maximum-size: ${SELF_DESCRIPTION_CACHE_MAX_SIZE:1000}

  # Declarative client timeouts are read only from here; forwarded from
  # `consent-manager.contract-service`, where a deployment sets them.
  http:
    services:
      contract-service:
        url: ${consent-manager.contract-service.url}
        connect-timeout: ${consent-manager.contract-service.connect-timeout}
        read-timeout: ${consent-manager.contract-service.read-timeout}

  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    # HikariCP pool settings
    minimum-idle: 2
    maximum-pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Management endpoints on a dedicated, cluster-internal port at the origin root.
    # ManagementEndpointSecurityIT pins these paths.
    port: ${MANAGEMENT_PORT:9090}
    # Keeps endpoints out of API_PREFIX even if the URI naming strategy changes.
    context-path: /
  health:
    enabled: true
    sensitive: false
    # Per-indicator detail only for an authenticated caller, so an anonymous probe
    # cannot enumerate the trust list.
    details-visible: AUTHENTICATED
    # Restart on /health/liveness (no external dependencies); route traffic on
    # /health/readiness (datasource and identity providers). Not the aggregate /health.
  # Set METRICS_AUTHENTICATION_ENABLED false only where the management port is otherwise
  # protected. Any valid token opens /metrics and /prometheus.
  metrics:
    enabled: true
    sensitive: ${METRICS_AUTHENTICATION_ENABLED:true}
  prometheus:
    enabled: true
    sensitive: ${METRICS_AUTHENTICATION_ENABLED:true}

# OpenTelemetry, configured from the standard OTEL_* variables; trace IDs reach the MDC.
tracing:
  opentelemetry:
    enabled: ${OTEL_TRACING_ENABLED:true}
  # Matched against the full path; every excluded route sits at the origin root.
  exclusions:
    - /health/**
    - /metrics/**
    - /prometheus/**
    - /swagger-ui/**
    - /openapi.yaml

consent-manager:
  url: ${CONSENT_MANAGER_URL:`http://localhost:8080`}

  # Path prefix of every API controller; management and `@OriginRoot` routes stay at root.
  api-prefix: ${API_PREFIX:/v1}

  contract-service:
    # Base URL of the Contract Service; forwarded to `micronaut.http.services` above.
    url: ${CONTRACT_SERVICE_URL:`http://localhost:8081`}

    # Per attempt, not per fetch: a fetch takes up to about 23.5s at the defaults, twice
    # that when the bilateral endpoint is tried too.
    connect-timeout: ${CONTRACT_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${CONTRACT_SERVICE_READ_TIMEOUT:5s}

    # Retries after the initial attempt (minimum one), with a growing pause. Only a 5xx or
    # a transport failure is retried.
    retry-attempts: ${CONTRACT_SERVICE_RETRY_ATTEMPTS:3}
    retry-delay: ${CONTRACT_SERVICE_RETRY_DELAY:500ms}
    retry-multiplier: ${CONTRACT_SERVICE_RETRY_MULTIPLIER:2.0}

    # Lifetime of `micronaut.caches.contracts`; short on purpose, see that cache.
    cache-ttl: ${CONTRACT_SERVICE_CACHE_TTL:60s}

  # Catalog self-descriptions a contract names. Their URLs come from documents this
  # service does not own, so the guards below keep this from being an open proxy.
  self-description:
    # Empty admits any host whose addresses are all external. An entry restricts fetching
    # to the listed hosts AND waives the private-address check; operator-only.
    allowed-hosts: ${SELF_DESCRIPTION_ALLOWED_HOSTS:}

    # Documents one resolved retrieval reads before reporting the data section UNAVAILABLE.
    max-documents: ${SELF_DESCRIPTION_MAX_DOCUMENTS:50}

    # Deadline for one resolved retrieval's catalog walk; bounds what max-documents cannot.
    max-duration: ${SELF_DESCRIPTION_MAX_DURATION:15s}

    # False on purpose: plaintext would let an on-path party rewrite a published notice.
    allow-plaintext-http: ${SELF_DESCRIPTION_ALLOW_PLAINTEXT_HTTP:false}

    # Lifetime of `micronaut.caches.self-descriptions`.
    cache-ttl: ${SELF_DESCRIPTION_CACHE_TTL:10m}

  users:
    # Cap on POST /users/search results; sorted by identifier, so truncation is deterministic.
    search-max-results: ${USERS_SEARCH_MAX_RESULTS:200}

    # Cap on bulk registration entries; a larger batch is refused whole with 400.
    bulk-max-size: ${USERS_BULK_MAX_SIZE:500}

  participants:
    # GET /participants page size when the caller names none.
    page-default-size: ${PARTICIPANTS_PAGE_DEFAULT_SIZE:20}

    # A larger requested size is clamped to this and answered 200, never refused.
    page-max-size: ${PARTICIPANTS_PAGE_MAX_SIZE:100}

  consents:
    # GET /consents/me page size when the caller names none.
    page-default-size: ${CONSENTS_PAGE_DEFAULT_SIZE:20}

    # A larger requested size is clamped to this and answered 200, never refused.
    page-max-size: ${CONSENTS_PAGE_MAX_SIZE:100}

    # Most superseded records one includeLineage walk reads per consent; cycles also stop it.
    lineage-max-depth: ${CONSENTS_LINEAGE_MAX_DEPTH:20}

  contract-discovery:
    # Concurrent Contract Service reads for one GET /contracts/available listing.
    max-concurrency: ${CONTRACT_DISCOVERY_MAX_CONCURRENCY:8}

    # Longest a listing waits before answering 502 with no partial list.
    max-duration: ${CONTRACT_DISCOVERY_MAX_DURATION:30s}

  receipts:
    # Jurisdiction a Kantara receipt names; required by KI-CR-v1.1.0, stated per deployment.
    jurisdiction: ${RECEIPTS_JURISDICTION:EU}
    # Secret private JWK (one line; EC P-256/384/521 or RSA) receipts are signed with. Its
    # public half is served at /.well-known/jwks.json; .env.sample shows how to make one.
    # Inline form, local/test only; production mounts the key and sets the file form below.
    signing-key: ${RECEIPTS_SIGNING_KEY:}
    # Path of a mounted file holding that JWK; the production form. Setting both forms, or
    # pointing at a missing, unreadable or empty file, fails startup.
    signing-key-file: ${RECEIPTS_SIGNING_KEY_FILE:}
    # Generate a throwaway key when none is set; its receipts stop verifying on restart.
    ephemeral-signing-key: ${RECEIPTS_EPHEMERAL_SIGNING_KEY:false}
    # Public-only JWKS of retired and upcoming keys. Rotation takes two deploys an hour
    # apart (the JWKS max-age); see docs/security.md and ADR-0014.
    # Inline form local/test only; the file form is production. Setting both fails startup.
    retired-verification-keys: ${RECEIPTS_RETIRED_VERIFICATION_KEYS:}
    retired-verification-keys-file: ${RECEIPTS_RETIRED_VERIFICATION_KEYS_FILE:}

  erasure:
    # Key of the salted HMAC an erased record keeps to confirm a named person consented.
    # Unset means no verifier; rotating it abandons existing verifiers. See ADR-0007.
    verification-secret: ${ERASURE_VERIFICATION_SECRET:}

  notifications:
    # Bare client URL linked from the consent-requested email; unset means no link. With
    # SMTP_HOST set, startup fails unless it is an absolute http(s) URL with a host.
    client-url: ${NOTIFICATION_CLIENT_URL:}

  # Signed webhooks to the participants a consent change binds; `notifications` is subject email.
  participant-notifications:
    # Bound on resolving a webhook host (the JDK resolver has none); a lookup past it is retried.
    resolve-timeout: ${PARTICIPANT_NOTIFICATIONS_RESOLVE_TIMEOUT:2s}
    connect-timeout: ${PARTICIPANT_NOTIFICATIONS_CONNECT_TIMEOUT:2s}
    read-timeout: ${PARTICIPANT_NOTIFICATIONS_READ_TIMEOUT:5s}
    # Empty admits any https host whose addresses are all external. An entry restricts delivery
    # to the listed hosts AND waives the private-address check; operator-only.
    allowed-hosts: ${PARTICIPANT_NOTIFICATIONS_ALLOWED_HOSTS:}

  errors:
    # Publish a 5xx exception message as `detail`. Dev-only debugging aid; stack traces
    # are never published.
    expose-exception-detail: ${ERRORS_EXPOSE_EXCEPTION_DETAIL:false}

  logging:
    # Required HMAC key (at least 32 bytes) pseudonymising identifiers in INFO+ log lines.
    # Keep it secret and stable: rotating it unlinks earlier pseudonyms.
    pseudonym-key: ${LOG_PSEUDONYM_KEY:}

  # Identity provider trust list, read once at startup and immutable; changes need a
  # restart. Env vars can override a declared provider's values but never add one.
  # Startup fails on an empty or malformed list or a duplicate issuer. See ADR-0002.
  identity-providers:
    primary:
      issuer: ${IDP_ISSUER:}
      # Fetched at startup for the jwks_uri; its `issuer` must equal the value above.
      discovery-url: ${IDP_DISCOVERY_URL:}
      audience: ${IDP_AUDIENCE:}
      # Permits an http issuer or discovery-url; local development only, warned at startup.
      allow-insecure-transport: ${IDP_ALLOW_INSECURE_TRANSPORT:false}
      # Tolerance applied to the exp, iat and nbf claims.
      clock-skew: ${IDP_CLOCK_SKEW:30s}
      # Claim paths as segment lists: [realm_access, roles] is nested; a comma-separated
      # scalar is its segments.
      claims:
        # Keys the `users` row unscoped by issuer, so must be unique across all providers.
        user-identifier: ${IDP_CLAIM_USER_IDENTIFIER:sub}
        participant-identifier: ${IDP_CLAIM_PARTICIPANT_IDENTIFIER:participant_id}
        roles: ${IDP_CLAIM_ROLES:realm_access,roles}
      # This service's roles to the provider's role strings; lower-case keys so an
      # override replaces rather than adds.
      role-mapping:
        user: ${IDP_ROLE_USER:consent-user}
        participant: ${IDP_ROLE_PARTICIPANT:consent-participant}
        catalog: ${IDP_ROLE_CATALOG:consent-catalog}

# Outgoing mail. SMTP_HOST, SMTP_PORT and SMTP_STARTTLS are read only from the environment;
# an unset or blank SMTP_HOST disables notifications. Defaults live in NotificationConfiguration.
smtp:
  # Optional; without a user the session does not authenticate.
  user: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  # Startup fails when SMTP_HOST is set and this is blank.
  from-address: ${SMTP_FROM_ADDRESS:}
  from-name: ${SMTP_FROM_NAME:}
  # Dev-only: trust every certificate and skip the host-name check; warned at startup.
  insecure-trust-all-certificates: ${SMTP_INSECURE_TRUST_ALL_CERTIFICATES:false}
