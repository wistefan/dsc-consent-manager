micronaut:
  application:
    name: consent-manager

  server:
    port: ${PORT:8080}
    context-path: ${API_PREFIX:/v1}

  router:
    # Static resources for Swagger UI and the OpenAPI specification.
    # The openapi.yaml is copied from api/ to target/classes/static/ at build time.
    static-resources:
      swagger-ui:
        paths: classpath:static/swagger-ui
        mapping: /swagger-ui/**
      openapi-spec:
        paths: classpath:static
        mapping: /static/**

  security:
    enabled: true

    # Keep every route-publishing bean of micronaut-security-oauth2 switched off.
    #
    # That module is a compile dependency for its OpenID discovery components alone
    # (docs/adr/0003-use-micronaut-security-oauth2-for-openid-discovery.md):
    # `IdentityProviderRegistry` drives its `DefaultOpenIdProviderMetadataFetcher`
    # directly. This service is a resource server - it issues no tokens and runs no
    # OAuth2 client.
    #
    # The login, callback and logout routes stay unregistered on their own because no
    # `micronaut.security.oauth2.clients.*` property is set. The RFC 9728
    # protected-resource-metadata beans do NOT: they are gated on the two properties
    # below and default to ENABLED, so both have to be switched off by hand.
    #
    #   enabled:          serves `/.well-known/oauth-protected-resource` anonymously,
    #                     advertising this service's own base URL and, once
    #                     authorization servers are listed, the very issuers the trust
    #                     list deliberately does not disclose (US-ID-008).
    #   www-authenticate: adds a `resource_metadata="<base-url>/.well-known/
    #                     oauth-protected-resource"` parameter to every 401 challenge.
    #                     It is a SEPARATE switch: the challenge provider is gated on
    #                     this property alone and is NOT gated on `enabled`, so turning
    #                     the controller off would otherwise leave every 401 pointing
    #                     at a route that 404s while still leaking the base URL.
    #
    # This block must stay the only `micronaut.security.oauth2` key in this file: YAML
    # takes the last of two duplicate keys, so a second block would silently drop
    # whichever of these two lines it did not repeat.
    #
    # TokenSignatureEnforcementIT pins both: `exposesNoOAuth2Routes` for the routes and
    # `challengeCarriesNoResourceMetadataParameter` for the challenge parameter.
    oauth2:
      protected-resource-metadata:
        enabled: false
        www-authenticate: false

    # Allow unauthenticated access to the health endpoints.
    #
    # These patterns are matched against the request path with the server context
    # path already stripped, so `/swagger-ui/**` still covers `${API_PREFIX}/swagger-ui/**`.
    # ManagementEndpointSecurityIT pins that, including a control case that tightens
    # the Swagger UI entry and requires the request to be challenged.
    #
    # Note that `endpoints.all.port` moves management endpoints to their own port but
    # does NOT take them out of the context path: the health endpoint is reached at
    # `http://<host>:${MANAGEMENT_PORT}${API_PREFIX}/health`. That is the URL the
    # compose healthcheck and any orchestrator probe must use.
    #
    # Both `/health` and `/health/**` are listed: the bare path is what a liveness
    # probe actually requests, and relying on `/**` to also match the empty remainder
    # is an assumption about the matcher rather than something this file states.
    intercept-url-map:
      - pattern: /health
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /health/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /static/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /metrics/**
        http-method: GET
        access:
          - isAuthenticated()
      - pattern: /prometheus/**
        http-method: GET
        access:
          - isAuthenticated()
    # Micronaut's own JWT support stays ENABLED: the flag gates the whole
    # `io.micronaut.security.token.jwt` package - the security filter, the bearer-token
    # reader and the `TokenValidator` SPI that ConsentManagerTokenValidator plugs into
    # in step 5. No signature configuration is registered yet, so until that validator
    # lands EVERY bearer token is rejected and no request authenticates. That is the
    # fail-closed direction, and it is what UnsignedTokenRejector keeps true for
    # `alg: none` tokens, which the framework would otherwise accept precisely because
    # no signature configuration exists.
    #
    # There are deliberately no `claims-validators.issuer` / `.audience` entries: both
    # hold a single global value, and the trust list holds a configurable number of
    # providers each with its own issuer and audience. Those checks are per provider and
    # belong to ConsentManagerTokenValidator (step 5). See
    # docs/adr/0002-own-identity-provider-registry-on-nimbus.md.
    token:
      jwt:
        enabled: true
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    # HikariCP pool settings
    minimum-idle: 2
    maximum-pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Serve management endpoints on a dedicated port so they can be exposed to an
    # orchestrator without exposing the API port. The dedicated port does NOT take
    # them out of `micronaut.server.context-path`: with a context path of /v1 the
    # health endpoints are under http://<host>:${MANAGEMENT_PORT}/v1/health. The
    # healthcheck in compose.yaml probes the readiness branch of that tree,
    # .../v1/health/readiness, not the aggregate .../v1/health - the aggregate also
    # folds in liveness, so an identity provider outage would restart the container
    # instead of draining it. ManagementEndpointSecurityIT pins both paths.
    port: ${MANAGEMENT_PORT:9090}
  health:
    enabled: true
    sensitive: false
    # Per-indicator detail — including which identity providers are configured and
    # how far their discovery has got — is shown only to an authenticated caller.
    # An anonymous probe sees the aggregate UP/DOWN and nothing else, so the
    # readiness endpoint cannot be used to enumerate this deployment's trust list.
    details-visible: AUTHENTICATED
    # Health indicators (DiskSpaceHealthIndicator, JdbcHealthIndicator,
    # IdentityProviderHealthIndicator) are auto-discovered from the classpath — no
    # explicit enablement needed.
    #
    # Micronaut serves three distinct routes off this one endpoint, and an
    # orchestrator must use them for different purposes:
    #
    #   /health            — the aggregate: UP only when liveness AND readiness are UP.
    #   /health/liveness   — "is the process alive?". No indicator here depends on an
    #                        external system, so this stays UP through a database or
    #                        identity-provider outage. This is the one a restart policy
    #                        may act on; probing /health instead would restart the
    #                        service over someone else's downtime.
    #   /health/readiness  — "can this instance serve?". Covers the datasource and
    #                        IdentityProviderHealthIndicator, so an instance whose
    #                        identity providers are not yet discovered is drained
    #                        rather than killed. This is the one a load balancer uses.
    #
    # compose.yaml's healthcheck probes /health/readiness, because a Compose
    # dependency must wait for an instance that can actually serve; its restart
    # policy deliberately does not act on that signal. ManagementEndpointSecurityIT
    # pins where these routes resolve.
  metrics:
    enabled: true
    sensitive: true
  prometheus:
    enabled: true
    sensitive: true

# OpenTelemetry tracing configuration.
# The Micronaut OTel module autoconfigures the SDK from standard OTel environment
# variables (OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_TRACES_EXPORTER).
# Trace IDs and span IDs are automatically added to the SLF4J MDC for log correlation.
tracing:
  opentelemetry:
    enabled: ${OTEL_TRACING_ENABLED:true}
  exclusions:
    - /health/**
    - /metrics/**
    - /prometheus/**
    - /swagger-ui/**
    - /static/**

# Custom application configuration bound to environment variables
consent-manager:
  url: ${CONSENT_MANAGER_URL:`http://localhost:8080`}
  contract-service-url: ${CONTRACT_SERVICE_URL:`http://localhost:8081`}

  # ---------------------------------------------------------------------------
  # Identity provider trust list
  # ---------------------------------------------------------------------------
  # One entry per trusted OpenID Connect provider, keyed by name. Each entry is
  # self-contained: the issuer, the discovery document URL, the audience this service
  # expects, the clock skew, the JWKS cache lifetime, the claim paths and the role
  # mapping. No `client-id` and no `client-secret` appear anywhere - this service is a
  # resource server, runs no OAuth2 flow and stores no credential.
  #
  # The trust list is read ONCE at startup and is immutable for the lifetime of the
  # process: no runtime reload, no admin endpoint, no auto-registration. Adding,
  # removing or re-pointing a provider requires a config change and a restart. Only the
  # per-provider metadata discovered for that fixed set (the jwks_uri and the cached
  # signing keys) changes afterwards, which is what lets a key rotation be picked up
  # without a restart.
  #
  # Startup FAILS when the list is empty, an entry is malformed, two entries declare the
  # same issuer, or an entry declares a key this service does not read. `IDP_ISSUER`,
  # `IDP_DISCOVERY_URL` and `IDP_AUDIENCE` intentionally have no default, so a deployment
  # that forgets to configure an IdP aborts at startup with a message naming the missing
  # property rather than silently trusting something.
  #
  # Environment variables can only OVERRIDE values of a provider already declared here;
  # they cannot ADD one. A name that appears only in an environment variable never
  # becomes a configuration entry and is silently ignored - add the second provider to
  # this file (or to a deployment overlay) and parameterise its values.
  #
  # Why the issuer, discovery and key caching are configured here rather than delegated
  # to `micronaut.security.oauth2.clients.<name>.openid.issuer`:
  #   docs/adr/0002-own-identity-provider-registry-on-nimbus.md
  identity-providers:
    primary:
      issuer: ${IDP_ISSUER:}
      # Fetched at startup to discover the provider's jwks_uri. Kept separate from the
      # issuer because a provider may publish its metadata at a path that is not the
      # issuer plus the well-known suffix; step 3 verifies that the document's `issuer`
      # equals the value above and refuses the provider when they disagree.
      discovery-url: ${IDP_DISCOVERY_URL:}
      audience: ${IDP_AUDIENCE:}
      # The discovery document is this service's trust anchor: it names the issuer that
      # is verified byte-for-byte and the jwks_uri signing keys are fetched from. Over
      # cleartext http anyone on the network path supplies both, so an http issuer or
      # discovery-url aborts startup unless this is switched on. Leave it false outside
      # local development; it is logged at WARN on every startup when it is not.
      allow-insecure-transport: ${IDP_ALLOW_INSECURE_TRANSPORT:false}
      # Tolerance applied to the exp, iat and nbf claims.
      clock-skew: ${IDP_CLOCK_SKEW:30s}
      # How long this provider's fetched JWK set stays usable before it is refreshed.
      # Per provider: one that rotates keys hourly and one that rotates them yearly
      # should not share a refresh cadence.
      jwks-cache-ttl: ${IDP_JWKS_CACHE_TTL:1h}
      # Claim names are per provider. Each may be a dot-separated nested path.
      claims:
        user-identifier: ${IDP_CLAIM_USER_IDENTIFIER:sub}
        participant-identifier: ${IDP_CLAIM_PARTICIPANT_IDENTIFIER:participant_id}
        roles: ${IDP_CLAIM_ROLES:realm_access.roles}
      # Maps this service's roles to the raw role strings the provider emits.
      # Keys are written in lower case so that an override replaces the configured
      # value instead of adding a second entry for the same role.
      role-mapping:
        user: ${IDP_ROLE_USER:consent-user}
        participant: ${IDP_ROLE_PARTICIPANT:consent-participant}
        catalog: ${IDP_ROLE_CATALOG:consent-catalog}
