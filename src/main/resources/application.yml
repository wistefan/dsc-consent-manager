micronaut:
  application:
    name: consent-manager

  server:
    port: ${PORT:8080}
    context-path: ${API_PREFIX:/v1}

  router:
    # Static resources for Swagger UI and the OpenAPI specification.
    # The openapi.yaml is copied from api/ to target/classes/static/ at build time.
    static-resources:
      swagger-ui:
        paths: classpath:static/swagger-ui
        mapping: /swagger-ui/**
      openapi-spec:
        paths: classpath:static
        mapping: /static/**

  security:
    enabled: true
    # Allow unauthenticated access to management endpoints.
    # TODO: With management endpoints on a dedicated port (see endpoints.all.port),
    #   these patterns may need revisiting once the security layer is fully wired.
    intercept-url-map:
      - pattern: /health/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /static/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /metrics/**
        http-method: GET
        access:
          - isAuthenticated()
      - pattern: /prometheus/**
        http-method: GET
        access:
          - isAuthenticated()
    # Token validation is performed by the application's own TokenValidator against
    # the `consent-manager.identity-providers` trust list below. The declarative
    # single-issuer `signatures.jwks` block is deliberately absent: the trust list holds
    # a configurable *number* of providers, so the per-issuer validators are built
    # programmatically from discovered JWKS URIs.
    token:
      jwt:
        enabled: true

  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    # HikariCP pool settings
    minimum-idle: 2
    maximum-pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Serve management endpoints on a dedicated port, outside the API context path.
    # This ensures health/metrics are reachable without the /v1 prefix.
    port: ${MANAGEMENT_PORT:9090}
  health:
    enabled: true
    sensitive: false
    details-visible: AUTHENTICATED
    # Health indicators (DiskSpaceHealthIndicator, JdbcHealthIndicator) are
    # auto-discovered from the classpath — no explicit enablement needed.
  metrics:
    enabled: true
    sensitive: true
  prometheus:
    enabled: true
    sensitive: true

# OpenTelemetry tracing configuration.
# The Micronaut OTel module autoconfigures the SDK from standard OTel environment
# variables (OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_TRACES_EXPORTER).
# Trace IDs and span IDs are automatically added to the SLF4J MDC for log correlation.
tracing:
  opentelemetry:
    enabled: ${OTEL_TRACING_ENABLED:true}
  exclusions:
    - /health/**
    - /metrics/**
    - /prometheus/**
    - /swagger-ui/**
    - /static/**

# Custom application configuration bound to environment variables
consent-manager:
  url: ${CONSENT_MANAGER_URL:`http://localhost:8080`}
  contract-service-url: ${CONTRACT_SERVICE_URL:`http://localhost:8081`}

  # ---------------------------------------------------------------------------
  # Identity provider trust list
  # ---------------------------------------------------------------------------
  # The set of OpenID Connect providers whose access tokens this resource server
  # accepts. It is read ONCE at startup and is immutable for the lifetime of the
  # process: there is no runtime reload, no admin endpoint and no auto-registration.
  # Adding, removing or re-pointing a provider requires a config change and a restart.
  #
  # Startup FAILS when the list is empty or any entry is malformed. The defaults
  # below are intentionally blank for the three values that have no defensible
  # default, so a deployment that forgets to configure an IdP aborts at startup with
  # a message naming the missing property rather than silently accepting nothing.
  #
  # Additional providers are configured either by mounting a YAML file that replaces
  # this list, or via indexed environment variables, for example:
  #   CONSENT_MANAGER_IDENTITY_PROVIDERS_1_ISSUER=https://other.example.com/realms/x
  identity-providers:
    - issuer: ${IDP_ISSUER:}
      discovery-url: ${IDP_DISCOVERY_URL:}
      audience: ${IDP_AUDIENCE:}
      # Lifetime of a cached JWKS document. Key rotation is picked up within this
      # window without a restart.
      jwks-cache-ttl: ${IDP_JWKS_CACHE_TTL:1h}
      # Tolerance applied to the exp, iat and nbf claims.
      clock-skew: ${IDP_CLOCK_SKEW:30s}
      # Claim names are per provider. Each may be a dot-separated nested path.
      claims:
        user-identifier: ${IDP_CLAIM_USER_IDENTIFIER:sub}
        participant-identifier: ${IDP_CLAIM_PARTICIPANT_IDENTIFIER:participant_id}
        roles: ${IDP_CLAIM_ROLES:realm_access.roles}
      # Maps this service's roles to the raw role strings the provider emits.
      role-mapping:
        USER: ${IDP_ROLE_USER:consent-user}
        PARTICIPANT: ${IDP_ROLE_PARTICIPANT:consent-participant}
        CATALOG: ${IDP_ROLE_CATALOG:consent-catalog}
