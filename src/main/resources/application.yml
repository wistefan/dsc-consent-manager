micronaut:
  application:
    name: consent-manager

  server:
    port: ${PORT:8080}
    context-path: ${API_PREFIX:/v1}

  router:
    # Static resources for Swagger UI and the OpenAPI specification.
    # The openapi.yaml is copied from api/ to target/classes/static/ at build time.
    static-resources:
      swagger-ui:
        paths: classpath:static/swagger-ui
        mapping: /swagger-ui/**
      openapi-spec:
        paths: classpath:static
        mapping: /static/**

  security:
    enabled: true
    # Allow unauthenticated access to management endpoints.
    # TODO: With management endpoints on a dedicated port (see endpoints.all.port),
    #   these patterns may need revisiting once the security layer is fully wired.
    intercept-url-map:
      - pattern: /health/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /static/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /metrics/**
        http-method: GET
        access:
          - isAuthenticated()
      - pattern: /prometheus/**
        http-method: GET
        access:
          - isAuthenticated()
    # -------------------------------------------------------------------------
    # Trusted OpenID Connect providers - issuer half of the trust list
    # -------------------------------------------------------------------------
    # Each entry under `oauth2.clients` declares one trusted issuer. From the
    # `openid.issuer` URL alone Micronaut Security fetches the provider's discovery
    # document, reads its `jwks_uri` and registers a JWKS-backed signature
    # configuration, so no discovery or JWKS URL has to be configured separately.
    #
    # No `client-id` or `client-secret` is set. This service is a resource server: it
    # runs no OAuth2 flow, issues no token and stores no credential.
    #
    # Every client here MUST have a matching `consent-manager.identity-providers.<name>`
    # entry below (and vice versa) or startup fails - see IdentityProviderRegistryValidator.
    #
    # WHAT THE FRAMEWORK DOES *NOT* DO (verified against micronaut-security 5.4.0 -
    # these gaps are the remaining scope of this ticket's steps 3 and 4, and must not
    # be assumed away):
    #   * Discovery is attempted once, when the signature configuration bean is first
    #     created. `DefaultOpenIdProviderMetadataFetcher` turns a failed fetch into a
    #     `DisabledBeanException`; there is NO retry and NO backoff.
    #     `JwksUriSignatureFactory` is `@EachBean(DefaultOpenIdProviderMetadata)` and
    #     reads `jwks_uri` eagerly, so if the provider is unreachable at that moment
    #     no JWKS signature configuration is ever created and EVERY token is rejected
    #     for the lifetime of the process. Startup itself still succeeds - which is
    #     why a readiness indicator and a retry-with-backoff path are still required.
    #   * `JwksUriSignatureFactory` sets only the JWKS URL. The cache expiration keeps
    #     its framework default (60s) and is NOT configurable per provider, so the
    #     ticket's per-provider `jwks-cache-ttl` is not expressible through it.
    #   * An unknown `kid` does not trigger a re-fetch: the JWKS verification path
    #     fails against the cached key set. Key rotation therefore is not yet
    #     guaranteed to be picked up without a restart, and there is no rate-limited
    #     refetch to observe.
    #
    # Environment variables can only OVERRIDE values of a provider that is already
    # declared here; they cannot ADD one. A name (or index) that appears only in an
    # environment variable never becomes a configuration entry, so no provider bean is
    # created and the setting is silently ignored - it stays readable as a raw
    # property, which is why the omission is easy to miss. To trust more than one
    # issuer, mount a YAML file adding further named entries to BOTH blocks, or pass
    # system properties (-Dmicronaut.security.oauth2.clients.<name>.openid.issuer=...).
    # The `${IDP_*}` placeholders below configure the single `primary` provider.
    oauth2:
      clients:
        primary:
          openid:
            issuer: ${IDP_ISSUER:}

    # Micronaut's own JWT support is left ENABLED. The flag gates the whole
    # `io.micronaut.security.token.jwt` package, which includes the JWKS-backed
    # signature beans the OpenID clients above feed, so turning it off would remove
    # signature verification altogether rather than merely disabling the built-in
    # token validator.
    #
    # With no signature configuration at all Micronaut accepts an unsigned
    # `alg: none` token, which is why UnsignedTokenRejector is registered as a
    # never-matching fallback: the set of signature configurations is then never
    # empty, even while discovery is still pending or has failed.
    #
    # The built-in validator applies only the expiration and subject-not-null claim
    # validators by default. Issuer and audience are checked solely because they are
    # configured below; roles, per-provider claim paths and per-provider clock skew
    # are not checked at all yet.
    token:
      jwt:
        enabled: true
        claims-validators:
          # INTERIM GUARD - remove when ConsentManagerTokenValidator lands (step 5).
          #
          # Without these two keys the built-in validator authenticates ANY token
          # signed by a trusted issuer's key, whatever its `aud` - and the
          # intercept-url-map above already grants `isAuthenticated()` access to
          # /metrics and /prometheus. Micronaut's validators are single global values,
          # so they are pointed at the `primary` entry; a deployment that adds a
          # second provider through a mounted YAML file will have that provider's
          # tokens rejected here until step 5 replaces this with the per-provider
          # checks. That is deliberate: fail closed rather than fail open.
          #
          # These reference the two properties rather than `${IDP_*}` directly so that
          # they follow the configured value however it was set. A blank value would
          # activate a validator that rejects every token, but cannot occur in a
          # running process: IdentityProviderRegistryValidator aborts startup when
          # either property is blank.
          issuer: ${micronaut.security.oauth2.clients.primary.openid.issuer}
          audience: ${consent-manager.identity-providers.primary.audience}

  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    # HikariCP pool settings
    minimum-idle: 2
    maximum-pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Serve management endpoints on a dedicated port, outside the API context path.
    # This ensures health/metrics are reachable without the /v1 prefix.
    port: ${MANAGEMENT_PORT:9090}
  health:
    enabled: true
    sensitive: false
    details-visible: AUTHENTICATED
    # Health indicators (DiskSpaceHealthIndicator, JdbcHealthIndicator) are
    # auto-discovered from the classpath — no explicit enablement needed.
  metrics:
    enabled: true
    sensitive: true
  prometheus:
    enabled: true
    sensitive: true

# OpenTelemetry tracing configuration.
# The Micronaut OTel module autoconfigures the SDK from standard OTel environment
# variables (OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_TRACES_EXPORTER).
# Trace IDs and span IDs are automatically added to the SLF4J MDC for log correlation.
tracing:
  opentelemetry:
    enabled: ${OTEL_TRACING_ENABLED:true}
  exclusions:
    - /health/**
    - /metrics/**
    - /prometheus/**
    - /swagger-ui/**
    - /static/**

# Custom application configuration bound to environment variables
consent-manager:
  url: ${CONSENT_MANAGER_URL:`http://localhost:8080`}
  contract-service-url: ${CONTRACT_SERVICE_URL:`http://localhost:8081`}

  # ---------------------------------------------------------------------------
  # Identity provider trust list - claim half
  # ---------------------------------------------------------------------------
  # One entry per trusted provider, keyed by the SAME name as the
  # `micronaut.security.oauth2.clients.<name>` entry above. The two halves are
  # joined at startup; a name present in only one of them aborts startup.
  #
  # This block holds only what Micronaut Security cannot express: a per-provider
  # audience, clock skew, claim paths (which may be nested) and role mapping.
  # Issuer, discovery and signing-key caching are Micronaut's job, not ours.
  #
  # The trust list is read ONCE at startup and is immutable for the lifetime of the
  # process: no runtime reload, no admin endpoint, no auto-registration. Adding,
  # removing or re-pointing a provider requires a config change and a restart.
  #
  # Startup FAILS when the list is empty or any entry is malformed. `IDP_ISSUER` and
  # `IDP_AUDIENCE` intentionally have no default, so a deployment that forgets to
  # configure an IdP aborts at startup with a message naming the missing property
  # rather than silently trusting something.
  identity-providers:
    primary:
      audience: ${IDP_AUDIENCE:}
      # Tolerance applied to the exp, iat and nbf claims.
      clock-skew: ${IDP_CLOCK_SKEW:30s}
      # Claim names are per provider. Each may be a dot-separated nested path.
      claims:
        user-identifier: ${IDP_CLAIM_USER_IDENTIFIER:sub}
        participant-identifier: ${IDP_CLAIM_PARTICIPANT_IDENTIFIER:participant_id}
        roles: ${IDP_CLAIM_ROLES:realm_access.roles}
      # Maps this service's roles to the raw role strings the provider emits.
      # Keys are written in lower case so that an override replaces the configured
      # value instead of adding a second entry for the same role.
      role-mapping:
        user: ${IDP_ROLE_USER:consent-user}
        participant: ${IDP_ROLE_PARTICIPANT:consent-participant}
        catalog: ${IDP_ROLE_CATALOG:consent-catalog}
