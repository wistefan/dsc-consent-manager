# Development environment overrides
# Activate with: MICRONAUT_ENVIRONMENTS=dev

micronaut:
  security:
    enabled: false
    # Disable JWT token validation in dev — no IdP is required locally.
    token:
      jwt:
        enabled: false
    # Issuer half of the local trust list; see the note at the bottom of this file.
    oauth2:
      clients:
        primary:
          openid:
            issuer: ${IDP_ISSUER:`http://localhost:8180/realms/consent-manager`}

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}

endpoints:
  all:
    port: ${MANAGEMENT_PORT:9090}
  health:
    details-visible: ANONYMOUS
  metrics:
    sensitive: false
  prometheus:
    sensitive: false

# Disable OpenTelemetry tracing in dev — no collector is required locally.
tracing:
  opentelemetry:
    enabled: false

# Local Keycloak trust list entry, matching the `keycloak` service in compose.yaml.
#
# Only the two values that differ from application.yml are overridden here; the
# audience, clock skew, claim paths and role mapping of the `primary` entry are
# inherited per leaf key from application.yml.
#
# The entry must be present even though security is disabled above: the trust-list
# check is unconditional, because a resource server with no trust list is
# misconfigured whatever the security toggle says. Discovery against an unreachable
# Keycloak is non-fatal - the provider simply never becomes usable.
consent-manager:
  identity-providers:
    primary:
      audience: ${IDP_AUDIENCE:consent-manager}
