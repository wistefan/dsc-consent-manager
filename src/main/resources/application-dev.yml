# Development environment overrides
# Activate with: MICRONAUT_ENVIRONMENTS=dev

micronaut:
  security:
    enabled: false
    # Disable JWT token validation in dev — no IdP is required locally.
    token:
      jwt:
        enabled: false

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}

endpoints:
  all:
    port: ${MANAGEMENT_PORT:9090}
  health:
    details-visible: ANONYMOUS
  metrics:
    sensitive: false
  prometheus:
    sensitive: false

# Disable OpenTelemetry tracing in dev — no collector is required locally.
tracing:
  opentelemetry:
    enabled: false

# Local Keycloak-shaped trust list entry, matching the `keycloak` service in
# compose.yaml. The entry must be present even though security is disabled above:
# the trust-list check is unconditional, because a resource server with no trust
# list is misconfigured whatever the security toggle says. Discovery against an
# unreachable Keycloak is non-fatal — the provider simply stays unresolved.
consent-manager:
  identity-providers:
    - issuer: ${IDP_ISSUER:`http://localhost:8180/realms/consent-manager`}
      discovery-url: ${IDP_DISCOVERY_URL:`http://localhost:8180/realms/consent-manager/.well-known/openid-configuration`}
      audience: ${IDP_AUDIENCE:consent-manager}
