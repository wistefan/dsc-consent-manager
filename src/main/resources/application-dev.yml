# Development environment overrides
# Activate with: MICRONAUT_ENVIRONMENTS=dev

micronaut:
  security:
    # Security is ENABLED in dev so the local stack exercises the same wiring as
    # production: the Keycloak service in compose.yaml is discovered, its JWKS is
    # fetched and bearer tokens are actually verified. Running without that Keycloak
    # (plain `./mvnw mn:run`) still starts the service — discovery simply fails, no
    # signing key is registered and every bearer token is rejected, while the
    # anonymous routes (/health, /swagger-ui, /openapi.yaml) stay reachable.
    enabled: true

datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/consent_manager`}
    username: ${DB_USER:consent_manager}
    password: ${DB_PASSWORD:consent_manager}

# Management endpoints. /metrics and /prometheus keep application.yml's
# `endpoints.<id>.sensitive`, so they need a token from the local Keycloak unless
# METRICS_AUTHENTICATION_ENABLED=false. /health stays anonymous and shows details here.
endpoints:
  all:
    port: ${MANAGEMENT_PORT:9090}
  health:
    details-visible: ANONYMOUS

# Disable OpenTelemetry tracing in dev — no collector is required locally.
tracing:
  opentelemetry:
    enabled: false

# Local Keycloak trust list entry, matching the `keycloak` service in compose.yaml.
#
# Only the values application.yml leaves blank are filled in here; clock skew, the
# JWKS cache TTL, the claim paths and the role mapping of the `primary` entry are
# inherited per leaf key from application.yml.
#
# The entry must be present whatever `micronaut.security.enabled` says: the trust-list
# check is unconditional, because a resource server with no trust list is
# misconfigured either way. An unreachable Keycloak does not abort startup - from
# step 3 on, discovery is retried with backoff and readiness reports DOWN until it
# succeeds, so `./mvnw mn:run` without the compose stack still starts.
consent-manager:
  # Local runs show the message of a 5xx; production publishes a fixed sentence.
  errors:
    expose-exception-detail: ${ERRORS_EXPOSE_EXCEPTION_DETAIL:true}
  # A fixed, non-secret key so local runs start; production configures LOG_PSEUDONYM_KEY.
  logging:
    pseudonym-key: ${LOG_PSEUDONYM_KEY:dev-only-log-pseudonym-key-not-a-secret}
  # Local runs need no key material; production configures RECEIPTS_SIGNING_KEY.
  receipts:
    ephemeral-signing-key: ${RECEIPTS_EPHEMERAL_SIGNING_KEY:true}

  identity-providers:
    primary:
      issuer: ${IDP_ISSUER:`http://localhost:8180/realms/consent-manager`}
      discovery-url: ${IDP_DISCOVERY_URL:`http://localhost:8180/realms/consent-manager/.well-known/openid-configuration`}
      audience: ${IDP_AUDIENCE:consent-manager}
      # The local Keycloak in compose.yaml is served over plain http. Accepting that is
      # a development-only decision, so it is written down here rather than defaulted:
      # application.yml leaves it false, and this override is logged at WARN on startup.
      allow-insecure-transport: ${IDP_ALLOW_INSECURE_TRANSPORT:true}
