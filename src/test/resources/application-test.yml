# Test environment overrides
# Activated automatically when running with @MicronautTest (the "test" environment
# is active by default).

micronaut:
  security:
    # Disable security for integration/smoke tests. Tests that need security
    # (e.g., OAuth2/JWT tests) can override this in their own configuration.
    enabled: false

  server:
    # Remove the API context path in tests so management and API endpoints
    # share the same root, simplifying test HTTP client usage.
    context-path: /

# Datasource properties are injected at runtime by PostgresTestResource
# (Testcontainers), so no static values are needed here.

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Reset to null so management endpoints are served on the main server port
    # (overrides application.yml's endpoints.all.port: 9090).
    port: ~
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

# Disable OpenTelemetry tracing in tests to avoid noise and external dependencies.
tracing:
  opentelemetry:
    enabled: false

# Suppress noisy Testcontainers and framework logs during test runs.
logger:
  levels:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    io.micronaut: WARN

# Dummy identity provider trust list.
#
# Required: the trust-list check runs unconditionally during context startup, so
# without an entry here every @MicronautTest that starts a full context (such as
# ApplicationSmokeIT) would fail regardless of `micronaut.security.enabled` above.
#
# The issuer and discovery URL point at a port nothing listens on. From step 3 on,
# discovery for it fails in the background and the provider simply never becomes
# usable; startup is unaffected. Tests that need a working provider supply their own
# property source pointing at WireMock or Testcontainers Keycloak.
#
# This overrides the `primary` entry declared in application.yml rather than adding a
# second provider: application.yml leaves `IDP_ISSUER`, `IDP_DISCOVERY_URL` and
# `IDP_AUDIENCE` blank on purpose so a misconfigured deployment aborts at startup, so
# every test context must fill those blanks in place. A differently-named entry here
# would leave `primary` blank and fail validation for every full-context test.
consent-manager:
  identity-providers:
    primary:
      issuer: http://localhost:1/realms/test
      discovery-url: http://localhost:1/realms/test/.well-known/openid-configuration
      # Clock skew, JWKS cache TTL, claim paths and role mapping are inherited per
      # leaf key from application.yml.
      audience: consent-manager
      # The dead port, the WireMock stubs in IdentityProviderDiscoveryIT and the
      # Testcontainers Keycloak step 8 adds are all plain http, so every test context
      # opts in here; production configuration leaves this false.
      allow-insecure-transport: true
