# Test environment overrides
# Activated automatically when running with @MicronautTest (the "test" environment
# is active by default).

micronaut:
  security:
    # Disable security for integration/smoke tests. Tests that need security
    # (e.g., OAuth2/JWT tests) can override this in their own configuration.
    enabled: false

    # Dummy trusted issuer. This overrides the `primary` entry declared in
    # application.yml rather than adding a second provider: application.yml leaves
    # `IDP_ISSUER` and `IDP_AUDIENCE` blank on purpose so a misconfigured deployment
    # aborts at startup, so every test context must fill those two blanks in place.
    # Introducing a differently-named entry here would leave `primary` blank and fail
    # the trust-list validation for every test that starts a full context.
    oauth2:
      clients:
        primary:
          openid:
            issuer: http://localhost:1/realms/test

  server:
    # Remove the API context path in tests so management and API endpoints
    # share the same root, simplifying test HTTP client usage.
    context-path: /

# Datasource properties are injected at runtime by PostgresTestResource
# (Testcontainers), so no static values are needed here.

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Reset to null so management endpoints are served on the main server port
    # (overrides application.yml's endpoints.all.port: 9090).
    port: ~
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

# Disable OpenTelemetry tracing in tests to avoid noise and external dependencies.
tracing:
  opentelemetry:
    enabled: false

# Suppress noisy Testcontainers and framework logs during test runs.
logger:
  levels:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    io.micronaut: WARN

# Dummy identity provider trust list.
#
# Required: the trust-list check runs unconditionally during context startup, so
# without an entry here every @MicronautTest that starts a full context (such as
# ApplicationSmokeIT) would fail regardless of `micronaut.security.enabled` above.
#
# The issuer points at a port nothing listens on. Micronaut's OpenID discovery for
# it fails in the background and the provider simply never becomes usable; startup
# is unaffected. Tests that need a working provider supply their own property source
# pointing at WireMock or Testcontainers Keycloak.
consent-manager:
  identity-providers:
    primary:
      # The only value application.yml leaves blank for this half. Claim paths, clock
      # skew and role mapping are inherited per leaf key from application.yml.
      audience: consent-manager
