# Test overrides; the "test" environment is active under @MicronautTest by default.

micronaut:
  security:
    # Off by default; authenticated ITs re-enable it via KeycloakAndPostgresTestResource.
    enabled: false

  server:
    # A random free port, so a held 8080 cannot fail every test; clients use @Client("/").
    port: -1

# Datasource properties are injected at runtime by PostgresTestResource.

flyway:
  datasources:
    default:
      enabled: true

endpoints:
  all:
    # Null serves management endpoints on the main server port.
    port: ~
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

# Every response a test client receives from the service is checked against the bundled
# spec by OpenApiResponseValidationFilter; a test may set this false to opt out.
test:
  response-validation:
    enabled: true

tracing:
  opentelemetry:
    enabled: false

logger:
  levels:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    io.micronaut: WARN
    # The dummy provider below fails discovery on purpose; silenced so a real failure is not
    # buried. IdentityProviderDiscoveryTest turns it back on.
    com.seamware.consentmanager.security.IdentityProviderRegistry: 'OFF'

# Dummy trust list, required because the check runs at every context startup. It fills
# the blanks of application.yml's `primary` entry in place, at a port nothing listens on.
consent-manager:
  # Unprefixed, so management and API endpoints share one root.
  api-prefix: ""

  # WireMock binds on loopback, so the loopback hosts are named here to waive the
  # private-address refusal, exactly as a deployment would.
  self-description:
    allowed-hosts:
      - localhost
      - 127.0.0.1
    allow-plaintext-http: true

  # Set so the erased record's verifier is exercised rather than skipped.
  erasure:
    verification-secret: test-erasure-verification-secret

  # A fixed, non-secret pseudonym key; LogLeakIT asserts no log line quotes it.
  logging:
    pseudonym-key: test-only-log-pseudonym-key-not-a-secret

  # Every test signs with a key generated per context; the JWKS publishes it.
  receipts:
    ephemeral-signing-key: true

  identity-providers:
    primary:
      issuer: http://localhost:1/realms/test
      discovery-url: http://localhost:1/realms/test/.well-known/openid-configuration
      # Other keys are inherited per leaf key from application.yml.
      audience: consent-manager
      # Every test provider (dead port, WireMock, Testcontainers Keycloak) is plain http.
      allow-insecure-transport: true
