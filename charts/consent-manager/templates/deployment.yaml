{{- $additionalIdps := .Values.identityProviders.additional }}
{{- $signingKeysDir := include "consent-manager.signingKeysDir" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "consent-manager.fullname" . }}
  labels:
    {{- include "consent-manager.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "consent-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the env, the trust list or the credentials change.
        checksum/config: {{ printf "%s%s" (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/configmap-identity-providers.yaml") .) | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "consent-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The service never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.containerPorts.management }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "consent-manager.fullname" . }}
          env:
            - name: RECEIPTS_SIGNING_KEY_FILE
              value: {{ printf "%s/%s" $signingKeysDir .Values.signingKeys.signingKeyFile | quote }}
            {{- if .Values.signingKeys.retiredVerificationKeys.enabled }}
            - name: RECEIPTS_RETIRED_VERIFICATION_KEYS_FILE
              value: {{ printf "%s/%s" $signingKeysDir .Values.signingKeys.retiredVerificationKeysFile | quote }}
            {{- end }}
            {{- if $additionalIdps }}
            - name: MICRONAUT_CONFIG_FILES
              value: {{ printf "%s/%s" (include "consent-manager.identityProvidersDir" .) (include "consent-manager.identityProvidersFile" .) | quote }}
            {{- end }}
            {{- range $key := splitList " " (include "consent-manager.mandatorySecretKeys" .) }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "consent-manager.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- /* Optional, so an existingSecret without SMTP keys still starts the pod. */}}
            {{- range $key := splitList " " (include "consent-manager.optionalSecretKeys" .) }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "consent-manager.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/liveness
              port: management
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: management
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: management
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: signing-keys
              mountPath: {{ $signingKeysDir }}
              readOnly: true
            {{- if $additionalIdps }}
            - name: identity-providers
              mountPath: {{ include "consent-manager.identityProvidersDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        - name: signing-keys
          secret:
            secretName: {{ include "consent-manager.signingKeysSecretName" . }}
            # 0400 as written; with fsGroup set the kubelet makes the files root:<fsGroup> and adds
            # group read, so the pod sees 0440. Only the app's group can read them; without fsGroup
            # the non-root UID could not read a root-owned 0400 file at all.
            defaultMode: 0400
        {{- if $additionalIdps }}
        - name: identity-providers
          configMap:
            name: {{ include "consent-manager.identityProvidersConfigMapName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
