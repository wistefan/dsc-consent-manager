{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- $generate := "generate it once with `openssl rand -base64 32` and keep it; prefer secrets.existingSecret in production" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "consent-manager.secretName" . }}
  labels:
    {{- include "consent-manager.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ required "secrets.dbUser is required unless secrets.existingSecret is set" $s.dbUser | b64enc | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required unless secrets.existingSecret is set" $s.dbPassword | b64enc | quote }}
  LOG_PSEUDONYM_KEY: {{ required (printf "secrets.logPseudonymKey is required unless secrets.existingSecret is set: %s" $generate) $s.logPseudonymKey | b64enc | quote }}
  ERASURE_VERIFICATION_SECRET: {{ required (printf "secrets.erasureVerificationSecret is required unless secrets.existingSecret is set: %s" $generate) $s.erasureVerificationSecret | b64enc | quote }}
  {{- with $s.smtpUser }}
  SMTP_USER: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.smtpPassword }}
  SMTP_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
