{{- if .Values.identityProviders.additional }}
{{- $defaults := include "consent-manager.additionalProviderDefaults" . | fromYaml }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "consent-manager.identityProvidersConfigMapName" . }}
  labels:
    {{- include "consent-manager.labels" . | nindent 4 }}
data:
  {{ include "consent-manager.identityProvidersFile" . }}: |
    # Rendered by the consent-manager Helm chart from identityProviders.additional.
    # The `primary` provider is configured through the IDP_* env vars instead.
    consent-manager:
      identity-providers:
    {{- range $name, $entry := .Values.identityProviders.additional }}
    {{- if eq $name "primary" }}
    {{- fail "identityProviders.additional must not declare 'primary'; it would merge silently into the env-configured primary provider. Configure it under identityProviders.primary." }}
    {{- end }}
    {{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $name) }}
    {{- fail (printf "identityProviders.additional key '%s' must be lower-case letters, digits and inner hyphens" $name) }}
    {{- end }}
    {{- $path := printf "identityProviders.additional.%s" $name }}
    {{- include "consent-manager.validateProvider" (dict "name" (printf "additional.%s" $name) "entry" $entry) }}
    {{- $claims := mergeOverwrite (deepCopy $defaults.claims) ($entry.claims | default dict) }}
    {{- $roleMapping := $entry.roleMapping | default $defaults.roleMapping }}
        {{ $name }}:
          issuer: {{ required (printf "%s.issuer is required" $path) $entry.issuer | quote }}
          discovery-url: {{ required (printf "%s.discoveryUrl is required" $path) $entry.discoveryUrl | quote }}
          audience: {{ required (printf "%s.audience is required" $path) $entry.audience | quote }}
          allow-insecure-transport: {{ $entry.allowInsecureTransport | default false }}
          clock-skew: {{ $entry.clockSkew | default "30s" | quote }}
          claims:
            user-identifier: {{ $claims.userIdentifier | toJson }}
            {{- with $claims.participantIdentifier }}
            participant-identifier: {{ . | toJson }}
            {{- end }}
            roles: {{ $claims.roles | toJson }}
          role-mapping:
            {{- range $role := list "user" "participant" "catalog" }}
            {{- with (get $roleMapping $role) }}
            {{ $role }}: {{ . | quote }}
            {{- end }}
            {{- end }}
    {{- end }}
{{- end }}
