# Every optional feature on, plus the ci/minimal-values.yaml inputs and one additional
# identity provider. Used by `helm lint --strict` and `helm template`; values are placeholders.
identityProviders:
  primary:
    issuer: https://idp.example.org/realms/consent-manager
    discoveryUrl: https://idp.example.org/realms/consent-manager/.well-known/openid-configuration
    audience: consent-manager
  additional:
    partner:
      issuer: https://partner-idp.example.org/realms/dataspace
      discoveryUrl: https://partner-idp.example.org/realms/dataspace/.well-known/openid-configuration
      audience: consent-manager
      clockSkew: 10s
      claims:
        participantIdentifier: [participant]
        roles: [groups]
      roleMapping:
        user: partner-user
        participant: partner-participant

config:
  consentManagerUrl: https://consent.example.org
  contractServiceUrl: http://contract-service:8080
  database:
    url: jdbc:postgresql://postgres:5432/consent_manager
  smtp:
    host: smtp.example.org
    fromAddress: noreply@example.org
    fromName: Consent Manager
  notificationClientUrl: https://wallet.example.org
  participantNotifications:
    allowedHosts: [webhooks.example.org]
  extraEnv:
    SELF_DESCRIPTION_ALLOWED_HOSTS: catalog.example.org

secrets:
  dbUser: consent_manager
  dbPassword: change-me
  smtpUser: mailer
  smtpPassword: change-me-too
  logPseudonymKey: ci-placeholder-log-pseudonym-key
  erasureVerificationSecret: ci-placeholder-erasure-verification-secret

signingKeys:
  retiredVerificationKeys:
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
  hosts:
    - host: consent.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: consent-example-org-tls
      hosts:
        - consent.example.org

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack
