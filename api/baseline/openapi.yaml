openapi: 3.0.3
info:
  title: Consent Manager API
  description: |
    Consent lifecycle management API. Provides endpoints for creating,
    revoking, and querying consent records.

    ## Authentication and authorization

    The Consent Manager is a stateless OAuth2 **resource server**. Every operation
    except the public `/api-status` reachability probe requires a bearer JWT issued
    by one of the identity providers on the service's trust list, which is read
    from configuration once at startup and is fixed for the life of the process.
    The complete token contract — every claim, its optionality, the configurable
    claim names and the accepted signature algorithms — is documented on the
    `bearerAuth` security scheme.

    Three roles are recognised:

    - `USER` — a natural person, who may manage and read their own consent records.
    - `PARTICIPANT` — a dataspace participant, which may manage and read consent
      records relating to itself.
    - `CATALOG` — the dataspace catalog service, which may read consent state
      across the dataspace. A "catalog token" is simply a participant access token
      carrying this role.

    Failures are reported as RFC 7807 problem details and distinguish the two
    cases: a request that fails **authentication** receives `401 Unauthorized`
    (missing, malformed, expired, incorrectly signed or untrusted token, with the
    body revealing nothing about which), while a request that authenticates but
    lacks the role required by the operation receives `403 Forbidden`.

    ## Participant onboarding

    **The identity provider is the gatekeeper.** A participant becomes able to
    call this API the moment one of the trusted providers will issue it a token
    carrying the `PARTICIPANT` role and a participant-identifier claim — which is
    a matter between the organisation and that provider's operator, and happens
    entirely outside this service. There is no login endpoint, no credential is
    accepted and none is stored; the worked `client_credentials` example is on the
    `bearerAuth` security scheme.

    **Onboarding is one call.** Holding such a token, the organisation
    `POST`s `/participants` with its self-description and is registered. There is
    no approval workflow, no pending state and no administrator in the loop: the
    response is the registration. Until that call succeeds the token still
    authenticates, but every operation acting on the participant's own record
    answers `403`; `POST /participants` is the only operation acting on the
    caller's own record that accepts an identifier this service does not yet
    know. The participant directory is readable either way.

    The identifier is always taken from the token claim, never from the body, the
    path or a query parameter, so a participant can only ever register, read,
    update or deregister itself. `DELETE /participants/me` reverses onboarding.
  version: 0.1.0
  contact:
    name: Seamware
servers:
  - url: /v1
    description: Default server (behind API context path)
security:
  - bearerAuth: []
tags:
  - name: Status
    description: Service status.
  - name: Users
    description: Data subjects registered with the service.
  - name: Participants
    description: Dataspace participants and the participant directory.
  - name: Participant Users
    description: A participant's affiliations with its users.
  - name: Privacy Notices
    description: Privacy notices generated from contracts.
  - name: Consents
    description: The data subject's grant of consent.
  - name: Consent Requests
    description: Consent requests a participant raises for a user.
  - name: Consent Lifecycle
    description: Moves of an existing consent through its lifecycle.
  - name: ConsentQuery
    description: Consent reads, validity checks and receipts.
  - name: ContractDiscovery
    description: Contracts available for consent.
  - name: ReceiptSigning
    description: Public keys that verify signed consent receipts.
paths:
  /api-status:
    get:
      operationId: getApiStatus
      summary: API status check
      description: |
        Returns a simple status indicator confirming the API is reachable. This is a public reachability probe: it requires no authentication and exposes no consent data.
      tags:
        - Status
      security: []
      responses:
        '200':
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiStatus'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/register:
    post:
      operationId: registerUser
      summary: Register the calling user
      description: |
        Registers the natural person the bearer token names and returns their record. The identity is taken entirely from the token — there is no request body, and a caller cannot register anybody but themselves.

        The record is keyed on the global user identifier the token asserts, so the operation is idempotent: `201 Created` the first time this service sees the identifier, `200 OK` on every later call, with the same body. Registration is the same code path as the just-in-time provisioning every other authenticated route performs, so a user first seen through another endpoint is already registered and receives `200` here.
      tags:
        - Users
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      responses:
        '200':
          description: The user was already registered; the existing record is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '201':
          description: The user was registered by this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Read the calling user's own record
      description: |
        Returns the record of the natural person the bearer token names, including the identifiers of the participants they are linked to. The record is created on first sight, so this operation does not report `404` for an otherwise valid user token.
      tags:
        - Users
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      responses:
        '200':
          description: The caller's own user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: eraseCurrentUser
      summary: Erase the calling user's record
      description: |
        Erases the natural person the bearer token names and reports what that cost. Every participant link is removed, every `GRANTED` consent is revoked and every unanswered one - `PENDING` or `DRAFT` - is `TERMINATED`, each with the matching event appended to its trail.

        The consent records and their events are retained as the evidence of what was authorised while it was authorised; what is destroyed is the tie between them and the person. The `users` row is deleted outright when no consent refers to it, and otherwise kept with its attributes cleared under the opaque `pseudonym` this response carries once and never again.

        The whole erasure is one transaction. The caller is registered by this route's own authentication, so this operation never reports `404`, and a later token for the same subject provisions a new record rather than resurrecting this one. For why the pseudonym is opaque rather than derived, what a consent naming nobody is still worth, and the keyed verifier a retained record keeps for the operator, see `docs/adr/0007-erasure-pseudonymises-the-user-and-retains-the-audit-trail.md`.
      tags:
        - Users
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      responses:
        '200':
          description: The record was erased. The body reports what that entailed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/search:
    post:
      operationId: searchUsers
      summary: Search registered users
      description: |
        Returns the registered users matching every criterion in the body, as far as the caller is entitled to see them. A `PARTICIPANT` caller sees only users linked to itself — a `participantIdentifier` naming another participant narrows that result rather than widening it — while a `CATALOG` caller reads across the dataspace. A body naming no criterion at all is rejected with `400 Bad Request` rather than listing everybody.

        Matching on `email` is exact but case-insensitive, and email is neither unique nor authoritative in this service, so the result may name several users. Matching on `identifier` is exact and case-sensitive, and is the documented way to reach a user that `GET /users/{identifier}` cannot address: one whose identifier contains `/`, or whose identifier is the literal `me`.

        The `participants` array of each returned user is scoped the same way the result is: a `PARTICIPANT` caller sees only its own link, a `CATALOG` caller sees every one. A participant does not learn which other participants the user is affiliated with.

        The result is capped at `consent-manager.users.search-max-results` users (200 by default) and this operation is not paginated, so a result of exactly that size may have been truncated and the caller should narrow its criteria rather than treat it as the complete answer.
      tags:
        - Users
      security:
        - bearerAuth:
            - PARTICIPANT
            - CATALOG
      x-roles:
        - PARTICIPANT
        - CATALOG
      x-principal: ConsentManagerPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSearch'
      responses:
        '200':
          description: |
            The matching users, sorted by identifier so the order is stable between requests and truncation is deterministic. Empty when nothing matches — a search that finds nobody is not a `404`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /users/{identifier}:
    get:
      operationId: getUser
      summary: Look a user up by their global identifier
      description: |
        Returns the user the identifier names, provided the caller is entitled to see them: a `PARTICIPANT` caller may read only users linked to itself, a `CATALOG` caller reads across the dataspace.

        A caller not entitled to the user receives `404 Not Found` with the same body as for an identifier naming nobody at all, deliberately — a `403` would confirm that the identifier names a registered user, which is precisely what the caller is not entitled to learn.

        `{identifier}` is the URL-encoded global user identifier. A path variable never spans a `/`, so an identifier containing one reaches this route only percent-encoded, and whether an encoded slash survives is a property of the deployment rather than of this service: an intermediary that refuses or decodes `%2F` ahead of routing leaves such an identifier unaddressable here. `POST /users/search` with the `identifier` criterion matches the value whole and is dependable for that case. The literal identifier `me` is unreachable here in every deployment, because `GET /users/me` claims that path for the caller's own record.

        The `participants` array of the returned user is scoped to the caller: a `PARTICIPANT` sees only its own link, a `CATALOG` caller sees every one. A participant does not learn which other participants the user is affiliated with.
      tags:
        - Users
      security:
        - bearerAuth:
            - PARTICIPANT
            - CATALOG
      x-roles:
        - PARTICIPANT
        - CATALOG
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: The URL-encoded global user identifier.
          schema:
            type: string
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
      responses:
        '200':
          description: The user the identifier names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /participants:
    get:
      operationId: listParticipants
      summary: List the participant directory
      description: |
        Returns a page of the dataspace's registered participants, so a caller can discover who it may transact with.

        Deregistered participants are left out, because the directory answers who can be transacted with now. Such a record stays readable through `GET /participants/{identifier}` and through the `identifier` filter here, both of which carry `deregisteredAt`, so the state is never merely implied by an absence.

        Records are ordered by `identifier`, which is unique, so a record never moves between pages while the directory itself does not change. The count and the page are two separate statements over a directory anyone may register in, so a registration or deregistration committed between them - or between two page requests - can still shift a record across a boundary or leave `totalElements` disagreeing with what `content` carries. Nothing here is served from a snapshot.

        Each entry is the participant record in full, the same representation `GET /participants/{identifier}` returns. Nothing a participant records about itself is a credential, so a listing has nothing to leave out that a lookup would hand to the same caller anyway.

        Neither the default page size nor the largest one accepted is written in this document, because a literal here could not track a value each deployment configures. Omitting `size` applies the configured default, and a `size` above the configured ceiling is clamped to it and answered `200` rather than rejected; the `size` of the response always reports the value actually applied. The bounds that are fixed - a `page` from zero and a `size` of at least one - are declared below and are enforced as `400`.
      tags:
        - Participants
      security:
        - bearerAuth:
            - USER
            - PARTICIPANT
            - CATALOG
      x-roles:
        - USER
        - PARTICIPANT
        - CATALOG
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based index of the page to return.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: |
            How many records the page may carry. Omitted, this deployment's configured default applies; above its configured ceiling, the ceiling applies.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: identifier
          in: query
          required: false
          description: |
            Return only the participant whose identifier is exactly this, deregistered or not. Matched whole and case-sensitively, and the dependable way to reach a participant whose identifier contains a `/`, which a path segment carries only percent-encoded.
          schema:
            type: string
          example: urn:example:participant:clinic
      responses:
        '200':
          description: The requested page of the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: registerParticipant
      summary: Register the calling participant
      description: |
        Registers the organization the bearer token names and returns its record.

        The participant identifier is taken entirely from the token's `claims.participant-identifier` claim: it is not a property of the request body, and an `identifier` sent anyway is ignored rather than rejected. A caller therefore cannot register anybody but itself, and cannot rename an existing registration by re-registering under a different identifier.

        Unlike `POST /users/register` this is **not** idempotent: an identifier this service already knows is answered with `409 Conflict`, because a second registration carries a full self-description that would otherwise silently either overwrite the stored one or be discarded. Updating a registration is `PUT /participants/me`.

        No credential is accepted and none is stored. Registration records what the organization says about itself; authentication stays entirely with the identity provider that issued the token.
      tags:
        - Participants
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantRegistration'
      responses:
        '201':
          description: The participant was registered by this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /participants/me:
    get:
      operationId: getCurrentParticipant
      summary: Read the calling participant's own registration
      description: |
        Returns the registration of the participant the bearer token names.

        Which record is returned is decided entirely by the token's `claims.participant-identifier` claim, so there is no way to ask for anybody else's record here; reading another participant is `GET /participants/{identifier}`.

        A token whose participant has never registered is answered with `403 Forbidden` rather than `404 Not Found`: the caller is a valid participant that has not yet created its record, and `POST /participants` is what creates it.
      tags:
        - Participants
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      responses:
        '200':
          description: The calling participant's registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      operationId: updateCurrentParticipant
      summary: Replace the calling participant's own registration
      description: |
        Replaces the self-description of the participant the bearer token names and returns the stored result.

        The body is the self-description in full, not a patch: an optional property left out is cleared. The identifier is not part of the body and is never changed by an update - an `identifier` sent anyway is ignored rather than rejected - so every consent and privacy notice already keyed on it keeps naming the same organization.

        A token whose participant has never registered is answered with `403 Forbidden` rather than `404 Not Found`, exactly as the `get` is: an update does not double as a registration, which is `POST /participants`.

        Concurrent updates are last-writer-wins: each replaces the whole self-description, and the later one wins outright. An update that finds the registration deregistered, or no longer there at all, applies nothing and is answered `409 Conflict`.
      tags:
        - Participants
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUpdate'
      responses:
        '200':
          description: The registration as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: deregisterCurrentParticipant
      summary: Deregister the calling participant
      description: |
        Removes the organization the bearer token names from the dataspace and reports what that entailed.

        The cascade runs in this order, as one transaction. Any consent naming the participant as provider or consumer that is still `GRANTED` refuses the whole operation with `409 Conflict`, and the problem detail names the blocking consents: a granted consent is a permission the *user* gave, and only that user can withdraw it. Otherwise every `PENDING` and `DRAFT` consent naming the participant moves to `TERMINATED` with a `CONSENT_TERMINATED` event, because an unanswered offer must not stay advanceable once one side has left. Every link to a user is then removed, and every privacy notice naming the participant as provider or consumer that is not already archived is archived.

        The `participants` row is finally deleted outright when nothing refers to it, and otherwise retained, marked with `deregisteredAt`, with its contact `email` cleared and its `endpoints` emptied. A retained record keeps its `identifier`, `legalName`, `selfDescriptionUri` and `legalPerson` intact and deliberately unscrubbed, so that the consents and notices that still name it stay legible; it is excluded from `GET /participants` but still resolves through `GET /participants/{identifier}`. Registering the same identifier again reactivates that record rather than conflicting with it.

        A repeated call on an already-deregistered record is a `409 Conflict` rather than a second cascade, so the recorded departure time cannot be moved. After a deregistration the same token still reads its own record, but no longer writes: the `/participants/me/users` operations answer `403 Forbidden` until the participant registers again.

        For why a granted consent blocks the exit while a draft does not, why an organization is not pseudonymised the way an erased user is, and what `deregisteredAt` does and does not mean, see `docs/adr/0008-deregistration-retains-the-participant-and-closes-its-open-business.md`.
      tags:
        - Participants
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      responses:
        '200':
          description: |
            The participant was deregistered. The body reports what that entailed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeregistrationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /participants/me/users/bulk:
    post:
      operationId: registerParticipantUsersBulk
      summary: Register a batch of users for the calling participant
      description: |
        Applies `POST /participants/me/users` to every entry of a batch and reports what each one did. The response is always `207 Multi-Status` when the batch itself was acceptable, never a single status standing for all of them: a batch routinely mixes users this participant has just acquired with users it has registered before, and that is a success, not a partial failure.

        **Entries are independent.** They share no transaction, so an entry that cannot be applied neither rolls back the entries before it nor stops the entries after it; it is reported as `REJECTED`, with a `reason`, and the batch continues. The rule each entry follows, and which of `CREATED`, `LINKED` and `ALREADY_LINKED` it reaches, is the one `POST /participants/me/users` documents in full — including that adopting an existing user never rewrites its attributes, and that the participant comes from the token and from nowhere else.

        `results` holds exactly one entry per entry sent, in the order sent, and `summary` counts them by outcome. **Unusable data in one entry costs only that entry:** an entry naming no identifier, or only whitespace, and an entry whose `email` is not a valid address are both answered `REJECTED` with a `reason` while the batch's remaining entries land. The same identifier sent twice in one batch is not an error either — the second occurrence simply sees the user the first one created, so it reports `ALREADY_LINKED`.

        **Two failures are request-level and answered `400`,** because they are facts about the request rather than about one entry. The first is a batch carrying more entries than the deployment permits; the limit is configured, and a batch above it is refused before anything is written. The second is a batch in which any string exceeds the `maxLength` its property publishes — those bounds guard the stored columns, so they are checked before the batch is applied and **a single over-long value discards the whole batch** without naming the entry at fault. Keep values within the documented lengths; everything else about an entry's content is reported per entry. A batch carrying no entries at all is not an error: it is answered `207` with an empty `results` and a summary of zeroes.
      tags:
        - Participant Users
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUserRegistration'
      responses:
        '207':
          description: |
            The batch was applied. Every entry carries its own outcome, and an entry may have been rejected while the rest succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRegistrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /participants/me/users:
    post:
      operationId: registerParticipantUser
      summary: Register a user for the calling participant
      description: |
        Registers the user the body names and links them to the participant the bearer token names, returning the stored record and which of the three outcomes the call reached.

        The rule is deterministic and keyed on the global user identifier alone. No user carries it yet: the user is created from the supplied attributes, linked, and the response is `201 Created` with outcome `CREATED`. A user already carries it: that record is adopted and linked as it stands — its `email`, `firstName` and `lastName` are **not** overwritten, because attributes belong to whoever created the record and to the user's own identity provider, never to a later registrant — and the response is `200 OK` with outcome `LINKED`. The link already exists: nothing changes beyond `localIdentifier`, and the response is `200 OK` with outcome `ALREADY_LINKED`. Two records are never merged, and `email` is never matched on: it is neither unique nor authoritative here.

        The participant is read from the token and from nowhere else, so a participant can only ever register a user for itself. A `participantIdentifier` property in the body — whether it names the caller, another participant or nobody at all — is ignored rather than rejected, and changes nothing about which participant the user is linked to.

        Addressing is by the data space's global identifier alone. `localIdentifier` is a convenience column on the calling participant's own link: invisible to every other participant, never a lookup key, and never part of matching. An identifier containing `/`, and the literal value `me`, cannot be addressed as a path segment on `GET /users/{identifier}` and are reached through `POST /users/search` instead. The rationale in full is `docs/user-identifiers.md` in this service's repository — deliberately named rather than linked, since the published specification serves no path under which that file resolves.
      tags:
        - Participant Users
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '200':
          description: |
            The user already existed. Outcome `LINKED` when this call linked them to the caller, `ALREADY_LINKED` when the link was already there.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResult'
        '201':
          description: The user was created by this request and linked to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /participants/me/users/{identifier}:
    patch:
      operationId: updateParticipantUserLink
      summary: Update the calling participant's link to a user
      description: |
        Applies the body to the link the calling participant holds for the user the path names, and returns the link as it now stands.

        Merge-patch semantics on a single property: sending a `localIdentifier` sets it, sending it as `null` clears it, and omitting it altogether leaves the stored value alone. A blank string is stored as no local identifier, so `null` and `""` settle on one representation.

        Only the link is touched. The user record itself — `email`, `firstName`, `lastName` and every other participant's link — is out of reach here, by design: attributes belong to whoever created the record and to the user's own identity provider, never to a participant that merely holds a link.

        A caller holding no link to the identifier receives `404 Not Found`, with the same body as for an identifier naming nobody at all. A `403` would confirm that the identifier names a registered user, which is precisely what a participant without a link is not entitled to learn.

        `{identifier}` is the URL-encoded global user identifier, with the same limit as on `GET /users/{identifier}`: a path variable never spans a `/`, so an identifier containing one reaches this route only percent-encoded, and whether an encoded slash survives is a property of the deployment rather than of this service.
      tags:
        - Participant Users
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: The URL-encoded global user identifier.
          schema:
            type: string
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUserLinkUpdate'
      responses:
        '200':
          description: The link as stored after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantUserLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: unlinkParticipantUser
      summary: Unlink a user from the calling participant
      description: |
        Removes the calling participant's link to the user the path names. The user record itself survives, as do every consent it is party to and every other participant's link: this operation ends an affiliation, it does not erase a person. Erasure is the data subject's own `DELETE /users/me`.

        Refused with `409 Conflict` while any consent naming the caller as provider or consumer is still `GRANTED` for that user — unlinking would strand a consent whose participant no longer knows the user. Revoke those consents first. A consent in any other status, and a granted consent between two other participants, do not block the unlink.

        `PENDING` and `DRAFT` deliberately do not block it either: neither authorises a data flow, so neither is worth refusing an unlink over. A consent in one of those statuses that is granted after the unlink is left stranded in the same way a consent granted concurrently with the unlink is — the check is advisory on this side, and the complementary guard belongs on the consent-granting path, which must refuse to grant for a participant holding no link. See `docs/user-identifiers.md`.

        A caller holding no link to the identifier receives `404 Not Found`, on the same reasoning as the `PATCH` above. The operation is not idempotent in the sense of answering `204` twice: a second call finds no link and answers `404`.
      tags:
        - Participant Users
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: The URL-encoded global user identifier.
          schema:
            type: string
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
      responses:
        '204':
          description: The link was removed. The user and its consents are untouched.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /participants/{identifier}:
    get:
      operationId: getParticipantByIdentifier
      summary: Look a participant up by its global identifier
      description: |
        Returns the participant the identifier names, so a counterparty named by a consent or a contract can be resolved to its self-description.

        A deregistered participant resolves here and carries `deregisteredAt`, because a consent retained after deregistration still names it and would otherwise name nobody a reader could identify. It is only the directory listing that leaves such a record out.

        `{identifier}` is the URL-encoded global participant identifier. A path variable never spans a `/`, so an identifier containing one - a URI-shaped identifier, as opposed to a DID - reaches this route only percent-encoded, and whether an encoded slash survives is a property of the deployment rather than of this service: an intermediary that refuses or decodes `%2F` ahead of routing leaves such an identifier unaddressable here. `GET /participants?identifier=...` matches the identifier whole and is dependable for that case. The literal identifier `me` is unreachable here in every deployment, because `GET /participants/me` claims that path for the calling participant's own record.
      tags:
        - Participants
      security:
        - bearerAuth:
            - USER
            - PARTICIPANT
            - CATALOG
      x-roles:
        - USER
        - PARTICIPANT
        - CATALOG
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: URL-encoded global participant identifier.
          schema:
            type: string
          example: urn:example:participant:clinic
      responses:
        '200':
          description: The participant the identifier names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /privacy-notices:
    post:
      operationId: generatePrivacyNotice
      summary: Generate a privacy notice from a contract
      description: |
        Generates the privacy notice for a contract and the two participants it binds, and returns it.

        The flow is fixed, and a refusal names the step it failed at. The two identifiers are resolved against this service's participant directory, a `404` naming whichever is unknown — and a deregistered participant is unknown here, because a new notice must not republish the record its deregistration retained only to keep the existing notices legible. The caller must be one of the two parties, or the request is `403`; a deregistered caller is `403` too, because generating a notice acts in the dataspace in the participant's name. The contract is then fetched from the Contract Service — an unknown contract is `404`, an unreachable Contract Service is `502`, and this is the one place in the whole API where that outage is fatal rather than degraded. The two declared parties must both be named by the fetched contract, or the request is `400`: without that check a body could name any consumer at all and the published notice would misname a party. Finally the contract's content is extracted and compared against the active notice for this contract and provider, if there is one.

        That comparison is what the two success codes report. `200` means an active notice already existed whose content is exactly what this contract yields now — nothing was written, and the notice returned is the one that was already there, with its original `id`. `201` means a notice was created: either there was none, or the contract has changed in a way that changes the notice, in which case the previous notice is archived in the same transaction and the response carries the new one. An upstream edit that does not change the notice — a signature added, a timestamp bumped — is a `200` and archives nothing, so consents already pointing at a notice are not invalidated by a change that did not reach them.

        One active notice is held per contract and provider, and the database enforces it. Two callers generating at once therefore both succeed: the one that lost the race re-reads the winner and answers exactly as it would have done had the two run in sequence — `200` with the winner's notice when that notice says what this request yields, `201` superseding it when it does not. Only a slot contended faster than one retry can claim it is refused, with `409`.

        Nothing here resolves external documents, so the `resolution` block of the response reports `NOT_REQUESTED` throughout. The contract's freshness is bounded by this deployment's contract cache lifetime: a contract edited upstream within that window is not yet visible here, and a regeneration will report `200` until it is.
      tags:
        - Privacy Notices
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePrivacyNotice'
      responses:
        '200':
          description: |
            An active notice with exactly this content already existed and was returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
        '201':
          description: |
            The notice was generated by this request; any previous active notice for the same contract and provider was archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NoticeGenerationContended'
        '502':
          description: |
            The Contract Service could not be reached, so the contract behind the notice could not be read.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /privacy-notices/by-contract:
    post:
      operationId: generatePrivacyNoticeByContract
      summary: Generate a privacy notice from a contract alone
      description: |
        Generates the privacy notice for a contract whose two parties the contract itself names, and returns it.

        Everything after the two parties are known is `POST /privacy-notices`, step for step and code for code: the same participant lookups, the same `403` for a caller that is not a party, the same comparison against the active notice, the same `200`/`201` split and the same one-active-notice rule per contract and provider. Only how the parties are arrived at differs, so a notice generated here and one generated there from the same contract are the same notice.

        A bilateral contract states the two parties outright, as its `dataProvider` and its `dataConsumer`. An ecosystem contract names N members and no two of them inherently, so the sides are read off the evidence it carries: the role it records for a still-bound member, and where it records none, who offers a service under it — a member offering a service is on the providing side. Members it has revoked are left out of both sides. The derivation must land on exactly one party per side.

        An ecosystem contract that admits more than one party on a side, or none, is `400` saying how many were found on each side. That is a refusal rather than a guess because the notice is a published legal document and naming a party the contract never put there is worse than declining: declare the two parties with `POST /privacy-notices` instead, which is the same operation with the ambiguity resolved by the caller. A contract this service cannot reach is still `502`, and a party the contract names but this service has no active registration for is still `404`.
      tags:
        - Privacy Notices
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateByContract'
      responses:
        '200':
          description: |
            An active notice with exactly this content already existed and was returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
        '201':
          description: |
            The notice was generated by this request; any previous active notice for the same contract and provider was archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NoticeGenerationContended'
        '502':
          description: |
            The Contract Service could not be reached, so the contract behind the notice could not be read.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /privacy-notices/{id}:
    get:
      operationId: getPrivacyNotice
      summary: Retrieve a privacy notice
      description: |
        Returns a stored privacy notice, optionally with the documents it only names filled in.

        The notice is served as it was stored. `resolve=true`, the default, additionally dereferences what a contract names without describing — the contract itself for its current title and terms, the catalog self-descriptions behind `data`, the purposes the contract states, and this service's own registration for each recipient — and `resolution` reports per section how far that got.

        **Resolution never fails the request.** An unreachable Contract Service, an unreadable catalog document or a recipient this deployment has no registration for degrades the affected section to `UNAVAILABLE` and the notice is served anyway, with whatever did resolve in place and the stored values everywhere else. That is why no `502` is declared here, unlike on the two generating operations: a notice that cannot be displayed at all is worse than one displayed with a section marked unavailable.

        Two sections move together by construction. `purposes` is resolved from the contract, so a contract that could not be read degrades `purposes` with it; no other input degrades `purposes` alone. `dataResources` is two hops — each entry of `data` names a service offering, whose own document names the data resources behind it — and a failure at either hop marks the section `UNAVAILABLE` even though the entries that did resolve are still returned, because a partially filled list claiming `RESOLVED` would misreport itself.

        `resolve=false` makes no external request at all and reports `NOT_REQUESTED` for all four sections.

        An archived notice stays retrievable by id and carries `archivedAt`, because a consent given against it is still read against the notice that was published. Its catalog documents and recipients resolve as an active notice's do, but the contract is deliberately left unread and `contract` and `purposes` report `NOT_REQUESTED`: the notice was archived precisely because the contract changed, so reading the live one would print the superseding contract's title, purposes and terms under the superseded notice's id. Retrieval is deliberately not scoped to the notice's two parties: a user has to be able to read the notice they are being asked to consent to before any link to it exists.

        An `id` that is not a UUID is a `400`, not a `404`.
      tags:
        - Privacy Notices
      security:
        - bearerAuth:
            - USER
            - PARTICIPANT
            - CATALOG
      x-roles:
        - USER
        - PARTICIPANT
        - CATALOG
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the notice to return.
          schema:
            type: string
            format: uuid
        - name: resolve
          in: query
          required: false
          description: |
            Whether to dereference the documents the notice only names. False serves the stored notice and makes no external request.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: |
            The notice, with `resolution` reporting how far each section was filled in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyNotice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents:
    post:
      operationId: grantConsent
      summary: Decide about a privacy notice
      description: |
        Records the calling data subject's decision about one privacy notice — consent granted, or consent refused — and returns the consent that decision created.

        **The subject is the token.** The body names a notice and a decision and nothing else; there is no property by which a caller could record a decision for another person, and a user identifier, email or key sent alongside is ignored rather than honoured. Only a `USER` token reaches this operation: a participant asks for consent with `POST /consents/requests`, which creates a `PENDING` record conferring nothing, and no operation anywhere lets a participant grant on a subject's behalf.

        The notice must exist — `404` otherwise — and must still be the active notice for its contract: an archived notice states terms no longer in force, and deciding against it is `400`. `purposes` and `data` elect part of the notice's terms, and an election naming anything the notice does not declare, or electing nothing at all, is `400`. Whatever is elected is frozen onto the consent together with the notice's title and the contract it was given under, so the record stays evidence of what was agreed even after the notice is regenerated.

        A decision supersedes whatever the subject had already recorded for the same notice: a record still in force is revoked in the same transaction, and the new record names the most recent previous record — whatever its status — as its `parentConsentId`, which is what makes the chain readable backwards. A predecessor that had already ended, as a refusal, an expiry or a termination, is linked but not written to: its status does not change. One record per subject and notice is in force at a time and the database enforces it, so two decisions submitted at once cannot both stand — the one that loses the race is answered `409` and is safe to resubmit against the record it can then read.

        **Answering an open request returns that record, not a new one.** Where a participant has already asked for this consent with `POST /consents/requests` and the request is still `PENDING`, the decision is written onto that record: the response carries the `id` the request was created with and the `parentConsentId` the request already had — re-pointed only where the same decision also closed a grant that was still in force — so a client that answers a request must not expect a fresh identifier or a new parent link. `createdAt` then dates the request — when consent was asked for — and `updatedAt` dates the last change to the record, which is the decision until a revocation, a termination or an expiry re-dates it. The status code says which of the two happened: `201` for a record this decision created, `200` for a request it answered in place. Only where no request is open does a decision create a record of its own.
      tags:
        - Consents
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsent'
      responses:
        '200':
          description: |
            The decision answered a request that was already open; the body is that record, carrying the identifier it was created with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '201':
          description: |
            The decision was recorded; the body is the consent it created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      operationId: listConsents
      summary: List the consents the calling participant is a party to
      description: |
        Returns a page of the consents under which the calling participant is either the data provider or the data consumer, so a participant can see the decisions that bear on the data it exchanges and decide whether it may act on them.

        **The page is scoped to the caller in the query, not after it.** A consent naming neither the caller as provider nor as consumer is never read here, so a participant can only ever see consents it is a party to; there is no parameter by which it could widen that scope.

        `userIdentifier` narrows the page to the consents of one data subject, and `privacyNoticeId` to the decisions taken against one notice. An identifier the caller is not party to any consent for - including one no user holds at all - yields an empty page and never a refusal, so the response discloses nothing about which subjects exist or which a participant may read.

        `status` narrows the page to the lifecycle states it names - repeat it to admit several. Omitted, only `GRANTED` consents are returned, since a participant asking what it may act on wants the decisions in force; pass `status` explicitly to see the others.

        Neither the default page size nor the largest one accepted is written in this document, because a literal here could not track a value each deployment configures. Omitting `size` applies the configured default, and a `size` above the configured ceiling is clamped to it and answered `200` rather than rejected; the `size` of the response always reports the value actually applied.
      tags:
        - ConsentQuery
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: userIdentifier
          in: query
          required: false
          description: |
            Return only consents naming this data subject. An identifier the caller is a party to no consent for yields an empty page, not a refusal.
          schema:
            type: string
        - name: privacyNoticeId
          in: query
          required: false
          description: Return only consents decided against this privacy notice.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: |
            Return only consents in these lifecycle states. Repeat the parameter to admit several; omitted, only `GRANTED` consents are returned.
          schema:
            type: array
            items:
              type: string
              enum:
                - PENDING
                - DRAFT
                - GRANTED
                - REVOKED
                - EXPIRED
                - TERMINATED
                - REFUSED
        - name: page
          in: query
          required: false
          description: Zero-based index of the page to return.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: |
            How many records the page may carry. Omitted, this deployment's configured default applies; above its configured ceiling, the ceiling applies.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The requested page of the caller's consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/requests:
    post:
      operationId: requestConsent
      summary: Ask a user to decide about a privacy notice
      description: |
        Opens a request that one of the calling participant's users decide on a privacy notice, and returns the `PENDING` consent the request created.

        **A request confers nothing.** The record it opens is `PENDING` and `consented` is `false`; it states that the question was put, not that it was answered, and no data may flow on the strength of it. Only the subject can answer, with `POST /consents`, which writes the decision onto this very record rather than creating a second one - so the identifier returned here is the identifier the answered consent will carry.

        The request elects no scope. It is opened over the notice's full terms, and narrowing them is the subject's to do when deciding: a scope proposed by the party that wants the data would read back afterwards as something the subject had agreed to.

        **The asking participant is the token.** The body names a notice and a subject, and there is no property by which one participant could put the question in another's name. The notice must exist and still be the active notice for its contract - `404` and `400` respectively - and must name the caller as its provider or its consumer, since either has business asking and nobody else does: `403` otherwise. The subject must already be linked to the caller; an identifier naming no user and one naming a user affiliated with somebody else are answered alike, with `404`, so this route cannot be used to find out which users the service holds. Where the pair already holds a record still in force - an open request or a consent granted - the answer is `409`, and the existing record is the one to read.
      tags:
        - Consent Requests
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: |
            The request was opened; the body is the `PENDING` consent it created, which confers nothing until the subject decides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/check:
    get:
      operationId: checkConsentValidity
      summary: Ask whether a subject's consent is in force right now
      description: |
        Answers a single yes/no a participant asks before it processes a subject's data: is there a consent in force, under this notice, that the calling participant is a party to, covering the named purpose? It is the service's sole runtime control point, so the answer carries only what the decision turns on and is never cached - a stale "yes" is the worst possible answer.

        **The lookup is scoped to the caller in the query, not after it.** A consent naming neither the caller as provider nor as consumer is never read here, so one participant can never learn whether another's grant exists.

        `valid` is true only when a `GRANTED` consent exists for this subject and notice that the caller is a party to and, where a `purpose` is named, the consent's frozen scope covers it. Every other case is `valid: false` with a `reason`.

        **A case where no grant is found discloses nothing about whether the subject exists.** An identifier no user holds and a known user with no consent in force return the same shape and the same `200`, so the check cannot be used to probe which subjects exist.

        **A deregistered caller is `403`.** A `yes` licenses processing, which is acting in the dataspace, so a participant that has left is refused even though the consents naming it are retained.
      tags:
        - ConsentQuery
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: userIdentifier
          in: query
          required: true
          description: The data subject whose consent is being checked.
          schema:
            type: string
        - name: privacyNoticeId
          in: query
          required: true
          description: The privacy notice the consent must have been decided against.
          schema:
            type: string
            format: uuid
        - name: purpose
          in: query
          required: false
          description: |
            A processing purpose the consent's frozen scope must cover for the answer to be `valid: true`. Matched verbatim: the value must equal one of the consent's frozen `purposes` exactly, character for character and case-sensitively - it is not a keyword or fuzzy match, and a difference in whitespace or punctuation answers `valid: false`. Omitted, the existence of a grant for the subject and notice is enough.
          schema:
            type: string
      responses:
        '200':
          description: |
            Whether the consent is in force. Carried on both the true and the false answer, since "no" is as much the answer as "yes" is.
          headers:
            Cache-Control:
              description: |
                Always `no-store`, so no client or intermediary replays an answer that the next revocation has already made wrong.
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentValidity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/{id}:
    get:
      operationId: getConsent
      summary: Read one consent the calling participant is a party to
      description: |
        Returns one consent, identified by its id, so a participant can read the decision that bears on a given exchange of data and act on what it finds.

        **The read is scoped to the caller in the query, not after it.** A consent naming neither the caller as provider nor as consumer is answered `404` exactly as an unknown id is, so the response never lets a participant learn that a consent it is no party to exists while refusing to show it.

        `format` selects the representation: the full consent, or a consent receipt rendered from the terms frozen when the decision was taken. `includeLineage=true` adds the chain of records this one supersedes, newest first; each link is read under the same party predicate, so the chain stops at the first record the caller is no party to. A receipt carries no lineage, so asking for one with a receipt `format` is refused with `400`.
      tags:
        - ConsentQuery
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to read.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: |
            The representation the consent is returned in. `full` is the consent as a query renders it. `receipt` is an ISO/IEC 29184 consent record and `receipt-kantara` a Kantara Initiative KI-CR-v1.1.0 receipt, both rendered from the terms frozen when the decision was taken, so a receipt reads the same after its notice is archived or regenerated. A Kantara receipt attests that consent was given and is therefore refused with `400` for a consent that is not `GRANTED`; an ISO/IEC 29184 record carries the status and is rendered for every one. A receipt is answered as `{receipt, jws}`: the receipt itself and, beside it, the detached JWS over it. Any other value is refused with `400`.
          schema:
            type: string
            enum:
              - full
              - receipt
              - receipt-kantara
            default: full
        - name: includeLineage
          in: query
          required: false
          description: |
            Whether to include the chain of consents this record supersedes, newest first and bounded by the depth this deployment configures. Refused with `400` alongside a receipt `format`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            The requested consent, in the representation `format` names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRepresentation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/{id}/revoke:
    post:
      operationId: revokeConsent
      summary: Revoke a consent in force
      description: |
        Withdraws a consent the calling data subject has given, with effect from the moment this call returns.

        Only the subject named by the consent reaches it. A consent belonging to anyone else is a `404` rather than a `403`, so the route cannot be used to learn which consent identifiers exist.

        Revocation is permitted from `GRANTED` and from nothing else: a consent already revoked, refused, terminated or expired is `400` naming both the status it holds and the one attempted, and an unanswered request is declined with `POST /consents/{id}/refuse` rather than revoked. The move and the audit event recording it are written in one transaction, so a status without its event cannot occur, and two revocations sent at once cannot both append one — the second reads the record as the first left it and is answered `400`.

        **`DELETE` is deliberately not the verb.** Nothing is deleted: the record stays readable in status `REVOKED`, carrying the terms that were agreed and the trail of who ended it, because that is what the consent is evidence of.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to revoke.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The consent was revoked; the body is the record in its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/{id}/refuse:
    post:
      operationId: refuseConsent
      summary: Decline an unanswered consent request
      description: |
        Records that the calling data subject declines a request a participant opened with `POST /consents/requests`.

        Only the subject named by the consent reaches it. A consent belonging to anyone else is a `404` rather than a `403`, for the same reason revocation is.

        Refusal is permitted from `PENDING` and `DRAFT` — the two statuses in which nothing has been answered yet — and from nothing else. A consent in any other status, `GRANTED` included, is `400` naming both the status it holds and the one attempted: consent already given is withdrawn with `POST /consents/{id}/revoke`, which is the mirror image of this operation and is permitted from `GRANTED` only. The move and its audit event are written in one transaction, and a second refusal sent concurrently reads the record as the first left it and is answered `400`.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to refuse.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The request was declined; the body is the record in its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/{id}/terminate:
    post:
      operationId: terminateConsent
      summary: Terminate a consent as a participant party to it
      description: |
        Ends an arrangement from the organisational side: the calling participant, named by the consent as provider or as consumer, records that it no longer rests on this consent.

        This is not the data subject withdrawing — that is `POST /consents/{id}/revoke`, and only the subject reaches it. Termination says the party has ended the arrangement, and the record stays readable in status `TERMINATED` carrying the terms that applied and the trail of who ended it.

        A participant the consent names on neither side is `403`, not the `404` a foreign *user* gets on the subject's routes: a participant that is party to nothing may still legitimately know the consent exists through its own records, so there is nothing to conceal from it, and the honest answer is that it has no standing here. A participant whose registration has been withdrawn is `403` for the same reason it reaches no other route that acts in the dataspace in its name.

        Termination is permitted from `GRANTED`, and equally from `PENDING` and `DRAFT` — a party may end an arrangement whether or not the subject has answered yet, and an unanswered request it ends is terminated rather than refused, so a client must not expect a `400` there. The statuses refused are exactly the terminal ones — `REVOKED`, `REFUSED`, `TERMINATED` and `EXPIRED` — each `400` naming both the status held and the one attempted. The move and its audit event are written in one transaction, and a second termination sent concurrently reads the record as the first left it and is answered `400`.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to terminate.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The consent was terminated; the body is the record in its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/{id}/re-confirm:
    post:
      operationId: reConfirmConsent
      summary: Re-confirm a consent in force
      description: |
        Records that the calling data subject still stands by a consent that is already in force.

        **Nothing about the consent changes.** The status stays `GRANTED`, the terms stay as they were agreed, and `updatedAt` is left alone because it dates state changes and this is not one. What the call produces is a single `CONSENT_RE_CONFIRMED` entry in the audit trail, dated in its own right, so a deployment that asks its subjects to reaffirm periodically can show when each of them last did. The body read back is the record, unchanged, so a client need not fetch it again.

        Only the subject named by the consent reaches it; a consent belonging to anyone else is a `404`, as on every other subject route here. Re-confirmation is permitted from `GRANTED` and from nothing else — a consent that was never given, or that has since been revoked, refused, terminated or expired, is `400` naming the status it holds. A consent revoked between the caller reading it and this call is refused for the same reason, so an affirmation is never appended to a consent no longer in force.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to re-confirm.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            The affirmation was recorded; the body is the consent, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/{id}/resume:
    post:
      operationId: resumeConsent
      summary: Resume an unanswered consent as granted
      description: |
        Grants a consent that was requested but never answered, addressed by its own identifier.

        The move is `PENDING` or `DRAFT` to `GRANTED`; a consent already decided — granted, revoked, refused, terminated or expired — is `400` naming the status it holds. The record is answered in place, so the response carries the identifier the request was created with and `createdAt` still dates the ask.

        **Two kinds of caller reach it.** A `USER` token resumes its own consent and states nothing: the body may be omitted entirely, and a `userIdentifier` sent anyway is ignored. A `CATALOG` token relays a decision the subject took in the catalog's own flow — the flow this operation resumes — and must name that subject with `userIdentifier`, which is `400` when absent. The identifier is checked against the consent this path addresses rather than used to find one: naming anybody but that consent's subject is `404`, so a catalog cannot choose whose consent it grants. Nor can it choose the notice or create a record: it can only advance one that already exists and is still open. See ADR-0010.

        **The audit trail says which happened.** A relayed grant records the relaying catalog as `catalog:<issuer>:<sub>`, a subject's own records the subject's identifier, so a reader can always tell one from the other.

        The notice must still be the active notice for its contract. A request can sit unanswered long enough for its notice to be regenerated, and resuming against an archived one would record a grant under terms no longer in force, so that is `400` — the same refusal `POST /consents` gives — as is a notice naming no data consumer. The terms the record was opened with are kept exactly as stored: a resume records a decision taken elsewhere rather than electing scope here, and where the notice has moved on the subject answers the new one through `POST /consents`.

        Recording the grant supersedes whatever consent is in force for the same subject and notice: that record is revoked in the same transaction, and the resumed record's `parentConsentId` is re-pointed at it. Where nothing was in force the link is left exactly as the request had it. One record per subject and notice is in force at a time and the database enforces it, so a grant recorded concurrently is answered `409` and is safe to retry against the record it can then read.

        Any other request for the same subject and notice that is still unanswered is closed as redundant in that same transaction. A question left standing once this one is answered would refuse every later request for the pair as a duplicate, with no way back for a caller that cannot reach `POST /consents`.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth:
            - USER
            - CATALOG
      x-roles:
        - USER
        - CATALOG
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to resume.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        description: |
          Required of a `CATALOG` caller, which must name the subject whose decision it relays. A `USER` caller may omit it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeConsent'
      responses:
        '200':
          description: |
            The consent was granted; the body is the record, carrying the identifier it was requested with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/me:
    get:
      operationId: listMyConsents
      summary: List the calling subject's consents
      description: |
        Returns a page of the consents that name the calling data subject, so a person can see every decision recorded about them and where each one stands.

        **The subject is the token.** The page carries only consents whose `user_id` is the one the token resolved; there is no parameter by which a caller could read another person's decisions, and one sent alongside is ignored rather than honoured.

        `status` narrows the page to the lifecycle states it names - repeat it to admit several - and `privacyNoticeId` to the decisions taken against one notice. Both are counted under the same filter as the content, so `totalElements` is the number of the caller's consents the filter matches and never the size of their whole history.

        Neither the default page size nor the largest one accepted is written in this document, because a literal here could not track a value each deployment configures. Omitting `size` applies the configured default, and a `size` above the configured ceiling is clamped to it and answered `200` rather than rejected; the `size` of the response always reports the value actually applied.

        A listing renders the full representation alone; a consent receipt is read one consent at a time from `/consents/me/{id}`. `includeLineage=true` adds to each record the chain of records it supersedes, newest first.
      tags:
        - ConsentQuery
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based index of the page to return.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: |
            How many records the page may carry. Omitted, this deployment's configured default applies; above its configured ceiling, the ceiling applies.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: status
          in: query
          required: false
          description: |
            Return only consents in these lifecycle states. Repeat the parameter to admit several; omitted, every state is included.
          schema:
            type: array
            items:
              type: string
              enum:
                - PENDING
                - DRAFT
                - GRANTED
                - REVOKED
                - EXPIRED
                - TERMINATED
                - REFUSED
        - name: privacyNoticeId
          in: query
          required: false
          description: Return only consents decided against this privacy notice.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: |
            The representation each consent is returned in. A listing renders `full` alone: a receipt is evidence of one decision and is read one consent at a time from `/consents/me/{id}`, so any other value is refused with `400` rather than silently rendered in full.
          schema:
            type: string
            enum:
              - full
            default: full
        - name: includeLineage
          in: query
          required: false
          description: |
            Whether to include, on each record, the chain of consents it supersedes, newest first. The walk is bounded by a depth this deployment configures, so a long history is cut short rather than read whole; omitted or `false`, no `lineage` is rendered.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The requested page of the caller's consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /consents/me/{id}:
    get:
      operationId: getMyConsent
      summary: Read one of the calling subject's consents
      description: |
        Returns one consent the calling data subject owns, identified by its id.

        **The subject is the token.** A consent the caller does not own is answered `404` exactly as an unknown id is, so the response never lets a caller learn that a consent exists while refusing to show it.

        `format` selects the representation: the full consent, or a consent receipt rendered from the terms frozen when the decision was taken. `includeLineage=true` adds the chain of records this one supersedes, newest first, as on the listing. A receipt is evidence of one decision and carries no lineage, so asking for one with a receipt `format` is refused with `400`.
      tags:
        - ConsentQuery
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to read.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: |
            The representation the consent is returned in. `full` is the consent as a query renders it. `receipt` is an ISO/IEC 29184 consent record and `receipt-kantara` a Kantara Initiative KI-CR-v1.1.0 receipt, both rendered from the terms frozen when the decision was taken, so a receipt reads the same after its notice is archived or regenerated. A Kantara receipt attests that consent was given and is therefore refused with `400` for a consent that is not `GRANTED`; an ISO/IEC 29184 record carries the status and is rendered for every one. A receipt is answered as `{receipt, jws}`: the receipt itself and, beside it, the detached JWS over it. Any other value is refused with `400`.
          schema:
            type: string
            enum:
              - full
              - receipt
              - receipt-kantara
            default: full
        - name: includeLineage
          in: query
          required: false
          description: |
            Whether to include the chain of consents this record supersedes, newest first and bounded by the configured depth, as on the listing. Refused with `400` alongside a receipt `format`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            The requested consent, in the representation `format` names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRepresentation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /contracts/available:
    get:
      operationId: listMyAvailableContracts
      summary: List the contracts the calling subject's participants take part in
      description: |
        Returns every contract a participant the calling data subject is linked to takes part in, so a person can see under which agreements their data may be asked for. A contract several of the subject's participants share is listed once, with `roles` naming every side they take in it.

        **The candidate set is this service's own.** The Contract Service offers no listing, so the contracts considered are those a participant has an active privacy notice for here; each is then read from the Contract Service. One the Contract Service no longer knows is left out, and a side a notice claims is kept only while the fetched document still puts the participant on it - a revoked member or signature, or a document naming someone else, drops that side, and a contract left with none is omitted.

        **Never a partial list.** If the Contract Service fails for any contract the answer is `502` and no list at all, because a truncated list would read as a complete one. Contracts are read concurrently, up to `CONTRACT_DISCOVERY_MAX_CONCURRENCY` at once, and a listing still unanswered after `CONTRACT_DISCOVERY_MAX_DURATION` (default 30s) is likewise `502`.
      tags:
        - ContractDiscovery
      security:
        - bearerAuth:
            - USER
      x-roles:
        - USER
      x-principal: UserPrincipal
      responses:
        '200':
          description: |
            The contracts, ordered by `contractUri`. Empty when the subject is linked to no participant, or to none that takes part in a contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableContract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /contracts/available/{role}:
    get:
      operationId: listAvailableContracts
      summary: List the contracts the calling participant takes part in on one side
      description: |
        Returns every contract the calling participant takes part in on the side `role` names - `provider` for those it publishes privacy notices under, `consumer` for those naming it as the recipient. Any other `role` is `400`.

        The candidate set and the no-partial-list rule are those of `GET /contracts/available`: contracts the participant has an active privacy notice for here, each read from the Contract Service and kept only while its document still puts the participant on that side, and a Contract Service failure or overrun deadline answered `502` with no list.
      tags:
        - ContractDiscovery
      security:
        - bearerAuth:
            - PARTICIPANT
      x-roles:
        - PARTICIPANT
      x-principal: ParticipantPrincipal
      parameters:
        - name: role
          in: path
          required: true
          description: The side of the contracts to list.
          schema:
            type: string
            enum:
              - provider
              - consumer
      responses:
        '200':
          description: |
            The contracts, ordered by `contractUri`, each with `roles` holding the requested side in upper case (`PROVIDER` or `CONSUMER`), as every enum in a response is spelt. Empty when the participant takes that side in no contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableContract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /.well-known/jwks.json:
    servers:
      - url: /
        description: Origin root (RFC 8615), outside the API context path
    get:
      operationId: getReceiptSigningKeys
      summary: Publish the keys consent receipts are signed with
      description: |
        Returns the JSON Web Key Set (RFC 7517) holding the public half of the key every consent receipt's `jws` is made with, so anyone holding a receipt - the data subject, a participant, an auditor - can verify it without a credential. Each key names its `kid`, which a receipt's JWS header repeats. The active key comes first, followed by any retired keys earlier receipts were signed with, so a receipt saved before a key rotation still verifies. Served at the origin root (`https://<host>/.well-known/jwks.json`, RFC 8615), not under the API context path. Public: it exposes no consent data and no secret.
      tags:
        - ReceiptSigning
      security: []
      responses:
        '200':
          description: The published signing keys.
          headers:
            Cache-Control:
              description: |
                Always `public, max-age=3600`, so verifiers and intermediaries may hold the set for an hour. A rotation signs with the new key at once, so a verifier meeting a `kid` its cached set lacks should refetch.
              schema:
                type: string
                enum:
                  - public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Bearer token contract**

        The Consent Manager is a stateless OAuth2 **resource server**. It issues no
        tokens, stores no credentials and keeps no sessions. Every secured request
        must carry `Authorization: Bearer <JWT>`, where the JWT was issued by one of
        the identity providers on the service's trust list. The trust list is read
        once from configuration at process startup and is fixed for the lifetime of
        the process; tokens from any other issuer are rejected.

        **Signature requirements.** Tokens must be signed with an asymmetric
        algorithm (`RS256`, `RS384`, `RS512`, `PS256`, `PS384`, `PS512`, `ES256`,
        `ES384`, `ES512`) using a key published at the issuer's JWKS endpoint, which
        is located through OpenID Connect discovery. `alg: none` is rejected.
        Symmetric algorithms (`HS256`, `HS384`, `HS512`) are rejected, because a
        shared secret would make the resource server capable of minting tokens.

        **Claim names are configurable per identity provider.** The tables below name
        the *default* claims. The claim carrying the user identifier, the claim
        carrying the participant identifier and the claim carrying roles are each
        configured per provider, so a deployment can consume tokens from providers
        that use different claim vocabularies without changing code.

        **Identifiers are opaque.** The user and participant identifiers are treated
        as opaque strings and are never parsed, split or interpreted. An identifier
        may be an email address, a DID, an arbitrary URI or a hash of an EUDI Wallet
        PID. The service compares them for equality and stores them verbatim.

        **Identifiers must be unique across the whole trust list, not just within
        one provider.** A user identifier is the key of the `users` row the identity
        is provisioned to, and is not scoped by issuer: two providers emitting the
        same identifier name the same user and share one set of consents. The
        default claim, `sub`, is only guaranteed unique per issuer, so a deployment
        trusting more than one provider must configure a claim that is unique across
        all of them.

        **What "Required" means below.** The column states what a conforming
        identity provider must emit, which is what its operator configures against.
        It is not a statement of what the service refuses a token for. The one place
        the two differ is `iat`: RFC 7519 makes it optional, so a token without it is
        not rejected on that ground alone, while this contract still requires
        providers to emit it. Every other claim marked required is enforced.

        ---

        ### User Access Token

        Issued to a natural person who acts on their own consent records.

        | Claim | Required | Description |
        | --- | --- | --- |
        | `iss` | yes | Token issuer. Must exactly match a configured trusted issuer. |
        | `aud` | yes | Audience. Must contain the audience configured for that issuer. |
        | `exp` | yes | Expiry time. Expired tokens are rejected, subject to the configured clock skew. |
        | `iat` | yes | Issued-at time. A token issued in the future beyond the clock skew is rejected. |
        | `sub` | yes | Subject identifier as issued by the provider. |
        | *user identifier* | yes | Opaque identifier of the acting user. Claim name is configured per provider; defaults to `sub`. |
        | *roles* | yes | Roles granted to the token. Claim name is configured per provider as a list of segments, so a nested claim is named explicitly (for example `[realm_access, roles]`). Raw role strings are translated to the service's roles through a per-provider role mapping. |
        | `nbf` | no | Not-before time. Honoured when present, subject to the configured clock skew. |
        | `jti` | no | Unique token identifier. |
        | `email` | no | Email address of the user. |
        | `email_verified` | no | Whether the provider verified the email address. |
        | `name` | no | Full display name of the user. |
        | `given_name` | no | Given name of the user. |
        | `family_name` | no | Family name of the user. |

        ### Participant Access Token

        Issued to a dataspace participant (a machine client acting for an
        organisation), typically through the OAuth2 client-credentials grant.

        | Claim | Required | Description |
        | --- | --- | --- |
        | `iss` | yes | Token issuer. Must exactly match a configured trusted issuer. |
        | `aud` | yes | Audience. Must contain the audience configured for that issuer. |
        | `exp` | yes | Expiry time. Expired tokens are rejected, subject to the configured clock skew. |
        | `iat` | yes | Issued-at time. A token issued in the future beyond the clock skew is rejected. |
        | `sub` | yes | Subject identifier as issued by the provider. |
        | *participant identifier* | yes | Opaque identifier of the participant. Claim name is configured per provider. |
        | *roles* | yes | Roles granted to the token, resolved exactly as for a user access token. |
        | `nbf` | no | Not-before time. Honoured when present, subject to the configured clock skew. |
        | `jti` | no | Unique token identifier. |
        | `azp` | no | Authorized party — the client the token was issued to. |
        | `client_id` | no | Client identifier, where the provider emits it instead of `azp`. |

        #### Obtaining one

        The Consent Manager has no login endpoint and issues nothing. A participant
        obtains its token from the identity provider directly, with the OAuth2
        client-credentials grant, using the client the provider's operator issued to
        it:

        ```http
        POST /realms/consent-manager/protocol/openid-connect/token HTTP/1.1
        Host: idp.example
        Content-Type: application/x-www-form-urlencoded

        grant_type=client_credentials&client_id=acme-logistics&client_secret=<client secret>
        ```

        The form body is one line — in an `application/x-www-form-urlencoded`
        request a newline is a body byte, not a separator. The provider answers:

        ```json
        {
          "access_token": "eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...",
          "token_type": "Bearer",
          "expires_in": 300
        }
        ```

        How the audience is requested is the provider's business — some read a
        `scope` or `resource` parameter, some attach it to the client — but the
        issued token must carry the audience this service is configured to expect,
        or it is rejected with `401`.

        The provider must also be configured to put two things in that token: the
        participant-identifier claim (default `participant_id`, configured per
        provider) carrying the opaque identifier that names the organisation, and a
        role that the provider's role mapping translates to `PARTICIPANT` (default
        `consent-participant`). A token carrying the role but no identifier claim is
        refused — with `401` when `PARTICIPANT` is the only role it grants, since it
        then carries the identifier of no granted role at all, and otherwise with
        `403` on the participant-scoped operations; see *Tokens granting more than
        one role* below. A token carrying the identifier but no mappable role
        authenticates with zero roles and is refused with `403` throughout.

        The resulting `access_token` is presented verbatim on each request:

        ```http
        GET /v1/participants/me HTTP/1.1
        Host: consent-manager.example
        Authorization: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
        ```

        A `client_credentials` token is short-lived and is not refreshed; the client
        requests a new one when it expires. No part of it is stored by this service.

        #### Key material

        **No key material is published here yet.** Tokens are verified against each
        issuer's JWKS, and this service holds no signing key of its own today.
        `GET /.well-known/jwks.json` (US-PM-008), which lets a participant verify the
        signature on a consent receipt, is owned end-to-end by TICKET-011 — the route
        and the key material both — and is not served by this module.

        ### Catalog Token

        A Catalog Token is issued to the dataspace catalog service so it can read
        consent state on behalf of the dataspace. It is a machine token obtained
        the same way as a participant access token, and it carries the `CATALOG`
        role. It differs from a participant access token in one respect: the
        catalog acts for the dataspace rather than for a single organisation, so
        it is **not** required to carry a participant identifier, and none is
        demanded of it.

        | Claim | Required | Description |
        | --- | --- | --- |
        | `iss` | yes | Token issuer. Must exactly match a configured trusted issuer. |
        | `aud` | yes | Audience. Must contain the audience configured for that issuer. |
        | `exp` | yes | Expiry time. Expired tokens are rejected, subject to the configured clock skew. |
        | `iat` | yes | Issued-at time. A token issued in the future beyond the clock skew is rejected. |
        | `sub` | yes | Subject identifier as issued by the provider. The catalog is identified by its issuer and subject alone. |
        | *roles* | yes | Must resolve to the `CATALOG` role through the provider's role mapping. |
        | *participant identifier* | no | Not required and not used. A catalog token that carries one is accepted; the claim is ignored. |
        | `nbf` | no | Not-before time. Honoured when present, subject to the configured clock skew. |
        | `jti` | no | Unique token identifier. |
        | `azp` | no | Authorized party — the client the token was issued to. |
        | `client_id` | no | Client identifier, where the provider emits it instead of `azp`. |

        An identity provider operator configuring the catalog service therefore
        does not need a participant-identifier claim mapper for it.

        ---

        ### Roles

        | Role | Granted to | Scope |
        | --- | --- | --- |
        | `USER` | A natural person | May manage and read their own consent records. |
        | `PARTICIPANT` | A dataspace participant | May manage and read consent records relating to itself as a participant. |
        | `CATALOG` | The dataspace catalog service | May read consent state across the dataspace. |

        ### Tokens granting more than one role

        A token may grant several of these roles at once, and a catalog token
        commonly does: the natural way to issue one is a service account that
        holds both the participant role and the catalog role.

        Authorization reads the **whole** set — an operation is permitted if any
        granted role permits it. Which single identity the caller then acts as is
        settled per operation: of the roles that operation accepts, the caller
        acts as the one highest in the fixed precedence

        `CATALOG` > `PARTICIPANT` > `USER`

        and that precedence decides alone where the operation accepts any
        authenticated caller. So a `USER` + `PARTICIPANT` token acts as the user
        on a user-scoped operation and as the participant on a participant-scoped
        one, and a `PARTICIPANT` + `CATALOG` token acts as the catalog wherever
        both are accepted.

        A token must carry the identifier claim of **at least one** role it
        grants — a user identifier, a participant identifier, or, for `CATALOG`,
        neither, since the catalog is identified by issuer and subject alone — and
        is rejected with `401` if it carries none. The identifier the *acting*
        role needs is required where the caller acts: a `USER` + `PARTICIPANT`
        token with no participant identifier authenticates and may act as the
        user, but receives `403` on a participant-scoped operation.

        ### Authentication versus authorization failures

        A request that fails **authentication** receives `401 Unauthorized`: the
        `Authorization` header is missing or malformed, the token is expired, not yet
        valid, has an invalid signature, uses a rejected algorithm, or was issued by
        an issuer that is not on the trust list. The `401` body deliberately does not
        distinguish between these cases, so it leaks nothing about the trust list.

        A request that authenticates successfully but lacks the role required by the
        operation receives `403 Forbidden`. A token whose roles claim is absent, or
        whose roles are all unmappable, authenticates with zero roles and therefore
        also receives `403` on any secured operation. So does a participant token
        whose identifier is not registered with this service, on every operation
        that acts on the participant's own record or on the users it has linked;
        an unregistered identifier still authenticates and still resolves a
        caller, so that it can reach the operation that registers it.

        The `403` body names the unregistered-participant case, whose remedy is
        the caller's own. The other causes are not told apart from one another.
  schemas:
    ApiStatus:
      type: object
      description: Simple API status response.
      properties:
        status:
          type: string
          description: Current status of the API.
          example: ok
      required:
        - status
    ProblemDetail:
      type: object
      description: |
        RFC 7807 Problem Details for HTTP APIs. Used as the standard error response format across all endpoints.
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI reference that identifies the problem type. When dereferenced, it should provide human-readable documentation.
          example: https://consent-manager.example/problems/not-found
        title:
          type: string
          description: |
            A short, human-readable summary of the problem type. It should not change from occurrence to occurrence.
          example: Not Found
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 404
        detail:
          type: string
          description: |
            A human-readable explanation specific to this occurrence of the problem.
          example: Consent record with ID 'abc-123' was not found.
        instance:
          type: string
          format: uri-reference
          description: |
            A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          example: /v1/consents/abc-123
        correlationId:
          type: string
          description: |
            Identifier of the request this problem occurred on, equal to the `X-Request-ID` response header. Quote it when reporting a failure; it is the key the service's logs are searched by.
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        errors:
          type: array
          description: |
            Every rejected field of a request that failed validation, ordered by field and then message. Present only on a validation failure; `detail` then lists the same rejections as one sentence.
          items:
            $ref: '#/components/schemas/ProblemFieldError'
      required:
        - type
        - title
        - status
    ProblemFieldError:
      type: object
      description: |
        One rejected field of a request that failed validation.
      properties:
        field:
          type: string
          description: |
            The rejected field, named as the request spelled it. Only the leaf of the property path is given; the path inside this service is not published.
          example: identifier
        message:
          type: string
          description: Why the field was rejected.
          example: must not be blank
      required:
        - field
        - message
    User:
      type: object
      description: |
        A registered natural person, identified across the dataspace by `identifier`. Carries only profile attributes and the participants the user is linked to — never a credential, token or secret of any kind.
      properties:
        identifier:
          type: string
          description: |
            The globally unique user identifier, read from the `claims.user-identifier` claim of the issuing identity provider. Stable for the life of the record and the value every user-owned record keys on.
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
        email:
          type: string
          format: email
          description: |
            Contact address, absent when none is known. Written when the record is created and refreshed only from the user's own identity provider — never by a participant registering an already-known user.
          example: ada@example.org
        firstName:
          type: string
          description: Given name, absent when unknown. Same provenance rule as `email`.
          example: Ada
        lastName:
          type: string
          description: Family name, absent when unknown. Same provenance rule as `email`.
          example: Lovelace
        participants:
          type: array
          description: |
            Identifiers of the participants this user is linked to, sorted so the representation is stable between requests. Empty when the user has registered with the service but not yet with any participant.

            Scoped to the reader, never dataspace-wide for everybody: the user's own record (`GET /users/me`) and a `CATALOG` caller see every link, while a `PARTICIPANT` caller sees only its own. Which participants a user is affiliated with is a more sensitive disclosure than whether the identifier exists at all, and the lookup route already answers `404` rather than `403` to withhold the latter — publishing the full list to one participant would tell it that the data subject is also registered with its competitors.
          items:
            type: string
          example:
            - urn:example:participant:clinic
        createdAt:
          type: string
          format: date-time
          description: When the record was first created.
        updatedAt:
          type: string
          format: date-time
          description: When the record was last modified.
      required:
        - identifier
        - participants
    UserSearch:
      type: object
      description: |
        Criteria for a user search. Criteria combine conjunctively — a body naming both `email` and `participantIdentifier` matches only users satisfying both — and a body naming none at all is rejected with `400 Bad Request`.
      properties:
        identifier:
          type: string
          description: |
            Exact, case-sensitive global user identifier. This is the escape hatch for identifiers that `GET /users/{identifier}` cannot address: one containing `/`, and the literal `me`, which the self route claims.
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
        email:
          type: string
          description: |
            Exact contact address, matched case-insensitively. Email is neither unique nor authoritative here — several users may share an address, and the match is on whatever was last written to the record rather than on a verified one — so this criterion may return more than one user and must not be used as an identity check.

            Deliberately declared without `format: email`, and not to be given one: the generator turns that format into `@Email` on the request model, which would refuse the whole search with `400` for a criterion that is not RFC-valid. A stored address need not be RFC-valid — it is whatever claim the user's identity provider asserted — so validating the criterion would make exactly those users unsearchable rather than merely unmatched. The criterion is an opaque string compared against what is stored.
          example: ada@example.org
        participantIdentifier:
          type: string
          description: |
            Restrict the result to users linked to this participant. A `PARTICIPANT` caller is confined to its own links regardless of what it names here, so naming another participant narrows its result rather than widening it.
          example: urn:example:participant:clinic
    ErasureSummary:
      type: object
      description: |
        The outcome of an erasure: how much was closed and unlinked, and under which opaque identifier the record was kept, if it was kept at all.
      properties:
        pseudonym:
          type: string
          description: |
            The opaque identifier that replaced the caller's global identifier, and the only handle left on the retained consent records. It is published here, once; this service never resolves a token back to it. Absent when the record was deleted outright, which is what happens when no consent referred to it.
          example: urn:consent-manager:erased:0192f0a3-6b1e-7c4d-8f2a-9b7c1d3e5f60
        consentsRevoked:
          type: integer
          format: int32
          minimum: 0
          description: |
            Consents that were `GRANTED` and are now `REVOKED`, each with a new `CONSENT_REVOKED` event. The consent records themselves are retained.
          example: 2
        consentsTerminated:
          type: integer
          format: int32
          minimum: 0
          description: |
            Consents that were still unanswered - `PENDING` or `DRAFT` - and are now `TERMINATED`, each with a new `CONSENT_TERMINATED` event, since an offer cannot be answered once the person it was put to is gone.
          example: 1
        linksRemoved:
          type: integer
          format: int32
          minimum: 0
          description: Participant links that were removed, ending every affiliation.
          example: 2
      required:
        - consentsRevoked
        - consentsTerminated
        - linksRemoved
    UserRegistration:
      type: object
      description: |
        A user a participant asks to have registered and linked to itself.

        `identifier` is the data space's **global** user identifier and the only property matching ever looks at: a registration never matches on `email`, and never merges two records. The attributes are written solely on the insert that creates the user, so registering an already-known user leaves their stored attributes untouched.

        The participant the user is linked to is the one the bearer token names. The body cannot name it, and a `participantIdentifier` property sent anyway is ignored rather than rejected.
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?!\s*$).+$
          description: |
            The globally unique user identifier, the same value the user's own token asserts in its `claims.user-identifier` claim. Required, and rejected with `400 Bad Request` when empty or blank.
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
        localIdentifier:
          type: string
          maxLength: 2048
          description: |
            The calling participant's own identifier for this user, stored on that participant's link and visible to nobody else. A convenience column for reconciling against the participant's internal records — never a lookup key, never part of matching, and not readable through any user representation. Unlike the attributes below it is refreshed whenever a later registration supplies one.
          example: patient-10427
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Contact address, written only when this call creates the user.

            Validated as an address here, unlike the `email` criterion of `POST /users/search`: refusing a malformed address on the way in is correct, whereas refusing one on the way out would make users whose identity provider asserted a non-RFC-valid address unsearchable.
          example: ada@example.org
        firstName:
          type: string
          maxLength: 255
          description: Given name. Same write-on-create rule as `email`.
          example: Ada
        lastName:
          type: string
          maxLength: 255
          description: Family name. Same write-on-create rule as `email`.
          example: Lovelace
      required:
        - identifier
    UserRegistrationResult:
      type: object
      description: |
        The user a registration resolved to, and what the call had to do to reach it.

        `outcome` is carried in the body as well as in the status code because the status distinguishes only creation from everything else, while a participant reconciling its own records needs to tell "I have just adopted a user somebody else registered" from "this user was already mine".
      properties:
        user:
          description: |
            The user the registration resolved to. Its `participants` array is scoped to the caller as everywhere else, so a participant is told about its own link only.
          $ref: '#/components/schemas/User'
        outcome:
          type: string
          description: |
            What the call did.
            * `CREATED` — no user carried the identifier, so one was created from the
              supplied attributes and linked. The only outcome answered `201`.
            * `LINKED` — the user already existed and this call linked it to the
              calling participant. Its attributes were left as they were.
            * `ALREADY_LINKED` — the user was already linked to the calling
              participant; only `localIdentifier` may have changed.
          enum:
            - CREATED
            - LINKED
            - ALREADY_LINKED
          example: CREATED
      required:
        - user
        - outcome
    Participant:
      type: object
      description: |
        A dataspace participant: an organization acting as a data provider, a data consumer, or both. Identified across the dataspace by `identifier`, which is read from the participant's own access token and never from a request body.

        Carries only the organization's self-description — never a credential, key, token or secret. The Consent Manager stores no participant credentials at all.
      properties:
        identifier:
          type: string
          description: |
            The globally unique participant identifier, taken from the `claims.participant-identifier` claim of the issuing identity provider when the participant registered. Stable for the life of the record and the value every participant-scoped record keys on.
          example: urn:example:participant:clinic
        legalName:
          type: string
          description: Official legal name of the organization.
          example: Example Clinic Ltd
        selfDescriptionUri:
          type: string
          description: |
            Absolute `https` URL of the participant's self-description document, absent when it publishes none.
          example: https://clinic.example.org/.well-known/self-description.json
        email:
          type: string
          format: email
          description: |
            Contact address for the organization, absent when none is known. The one plausibly personal field on this representation, since in practice it names a contact person rather than the organization, which is why deregistration clears it even on a record it has to retain.
          example: data-protection@clinic.example.org
        legalPerson:
          description: |
            Legal-entity metadata the participant declared, absent when none is known.
          $ref: '#/components/schemas/ParticipantLegalPerson'
        endpoints:
          description: Service endpoints the participant declared, absent when none is known.
          $ref: '#/components/schemas/ParticipantEndpoints'
        createdAt:
          type: string
          format: date-time
          description: When the record was first created.
        updatedAt:
          type: string
          format: date-time
          description: When the record was last modified.
        deregisteredAt:
          type: string
          format: date-time
          description: |
            When the participant deregistered. **Absent for every active participant**, which is what a reader should test on rather than comparing the value to anything.

            Only ever present on a record deregistration had to retain because a consent or a privacy notice still references it; a record nothing references is deleted outright and cannot be read back at all. Such a record is kept intact rather than pseudonymised, so that a retained consent still names a counterparty a reader can identify.
      required:
        - identifier
        - legalName
    ParticipantLegalPerson:
      type: object
      description: |
        Registered legal-entity metadata about the participant organization, as it describes itself. The Consent Manager stores and republishes these attributes and never verifies them against a register.
      properties:
        registrationNumber:
          type: string
          maxLength: 255
          description: |
            The organization's registration number in whatever register it is incorporated in — a VAT, EORI, LEI or local company number.
          example: DE123456789
        headquartersAddress:
          type: string
          maxLength: 1024
          description: Address of the organization's headquarters, as a single line.
          example: Hauptstrasse 1, 10115 Berlin, DE
        legalAddress:
          type: string
          maxLength: 1024
          description: |
            Registered address of the legal entity, which may differ from the headquarters address.
          example: Hauptstrasse 1, 10115 Berlin, DE
        parentOrganization:
          type: string
          maxLength: 2048
          description: |
            Identifier of the organization this one is a subsidiary of, absent when it has no parent. Free-form rather than a participant identifier: the parent need not be a participant of this dataspace.
          example: urn:example:participant:holding
        subOrganization:
          type: string
          maxLength: 2048
          description: |
            Identifier of an organization subordinate to this one, absent when it has none. Same free-form rule as `parentOrganization`.
          example: urn:example:participant:clinic-north
    ParticipantEndpoints:
      type: object
      description: |
        Service endpoints a participant exposes to the Consent Manager.

        Every endpoint is an absolute `https` URL the service calls out to, so each one is a place this deployment may be made to send a request. That is why they are pattern-bound rather than free-form strings.
      properties:
        consentNotification:
          type: string
          maxLength: 2048
          pattern: ^https://[^\s]+$
          description: |
            Absolute `https` URL the Consent Manager notifies when a consent naming this participant changes state. Absent when the participant does not want to be notified, which is the default; notification itself is out of scope for this revision and the value is only stored and published.
          example: https://clinic.example.org/consent-notifications
    ParticipantRegistration:
      type: object
      description: |
        What an organization tells the Consent Manager about itself when it registers.

        The participant identifier is taken from the access token's `claims.participant-identifier` claim and from nowhere else; an `identifier` property sent in the body is ignored rather than rejected. No credential is accepted here and none is stored: registration records a self-description, it does not establish a login.
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?!\s*$).+$
          description: |
            Official legal name of the organization. Required, and rejected with `400 Bad Request` when empty or blank.
          example: Example Clinic Ltd
        selfDescriptionUri:
          type: string
          maxLength: 2048
          pattern: ^https://[^\s]+$
          description: |
            Absolute `https` URL of the participant's self-description document. Optional, and rejected with `400 Bad Request` when it is not an absolute `https` URL.
          example: https://clinic.example.org/.well-known/self-description.json
        email:
          type: string
          format: email
          maxLength: 254
          description: Contact address for the organization. Optional.
          example: data-protection@clinic.example.org
        legalPerson:
          description: Legal-entity metadata about the organization. Optional.
          $ref: '#/components/schemas/ParticipantLegalPerson'
        endpoints:
          description: Service endpoints the participant exposes. Optional.
          $ref: '#/components/schemas/ParticipantEndpoints'
      required:
        - legalName
    ParticipantUpdate:
      type: object
      description: |
        A replacement self-description for the calling participant.

        This is a `PUT`, so the body is the participant's self-description in full and not a patch: an optional property left out is cleared rather than kept. The identifier, the creation timestamp and the registration's other service-managed fields are not part of the body and are untouched by an update.
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?!\s*$).+$
          description: |
            Official legal name of the organization. Required, and rejected with `400 Bad Request` when empty or blank.
          example: Example Clinic Ltd
        selfDescriptionUri:
          type: string
          maxLength: 2048
          pattern: ^https://[^\s]+$
          description: |
            Absolute `https` URL of the participant's self-description document. Optional, and cleared when left out.
          example: https://clinic.example.org/.well-known/self-description.json
        email:
          type: string
          format: email
          maxLength: 254
          description: Contact address for the organization. Optional, and cleared when left out.
          example: data-protection@clinic.example.org
        legalPerson:
          description: |
            Legal-entity metadata about the organization. Optional, and cleared when left out.
          $ref: '#/components/schemas/ParticipantLegalPerson'
        endpoints:
          description: |
            Service endpoints the participant exposes. Optional, and cleared when left out.
          $ref: '#/components/schemas/ParticipantEndpoints'
      required:
        - legalName
    DeregistrationSummary:
      type: object
      description: |
        The outcome of a deregistration: how much was closed, unlinked and archived, and whether the participant record was kept or deleted.
      properties:
        deregisteredAt:
          type: string
          format: date-time
          description: |
            When the record was marked deregistered. Present only when the record was retained, which is what happens whenever a consent or a privacy notice still names the participant - the usual case. Absent when nothing referred to the record and it was deleted outright.
          example: '2026-10-07T09:14:22.481193Z'
        consentsTerminated:
          type: integer
          format: int32
          minimum: 0
          description: |
            Consents naming the participant that were still unanswered - `PENDING` or `DRAFT` - and are now `TERMINATED`, each with a new `CONSENT_TERMINATED` event, since an offer cannot be answered once one side has left.
          example: 1
        consentsRetained:
          type: integer
          format: int32
          minimum: 0
          description: |
            Consents naming the participant that remain in the record afterwards, terminated ones included. They are the evidence of what was permitted while it was permitted and are never deleted.
          example: 4
        noticesArchived:
          type: integer
          format: int32
          minimum: 0
          description: |
            Privacy notices naming the participant as provider or consumer that were still live and are now archived. Already-archived notices are left alone and are not counted here.
          example: 2
        linksRemoved:
          type: integer
          format: int32
          minimum: 0
          description: Affiliations with users that were removed, ending every link.
          example: 7
      required:
        - consentsTerminated
        - consentsRetained
        - noticesArchived
        - linksRemoved
    ParticipantUserLink:
      type: object
      description: |
        The link between the calling participant and one user. Scoped to the caller — a participant never reads another participant's link, nor learns that one exists.
      properties:
        identifier:
          type: string
          description: |
            The data space's global user identifier, echoing the one addressed in the path. The link is keyed on this and it never changes.
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
        localIdentifier:
          type: string
          description: |
            The calling participant's own identifier for this user, absent when the participant holds none — which a blank value submitted on registration or update also means. A convenience column for reconciling against the participant's internal records — never a lookup key and never part of matching.
          example: patient-10427
        linkedAt:
          type: string
          format: date-time
          description: |
            When this participant was first linked to the user, at UTC. Unaffected by later changes to `localIdentifier`.
          example: '2026-01-15T09:30:00Z'
      required:
        - identifier
        - linkedAt
    ParticipantUserLinkUpdate:
      type: object
      description: |
        The new state of the calling participant's link to a user. Merge-patch semantics: a property the body mentions is applied, a property it omits is left as it stands.

        `localIdentifier` is therefore tri-state. A string sets it, an explicit `null` clears it — the only way to remove one once written — and omitting the property entirely leaves the stored value alone. A blank or whitespace-only string is treated as `null`, so "this participant holds no local identifier" has exactly one stored representation.
      properties:
        localIdentifier:
          type: string
          nullable: true
          x-is-jackson-optional-nullable: true
          maxLength: 2048
          description: |
            The calling participant's own identifier for this user, stored on that participant's link and visible to nobody else. Send `null` to clear the one currently stored; omit the property to leave it untouched. A blank string is stored as no local identifier at all.
          example: patient-10427
    BulkUserRegistrationEntry:
      type: object
      description: |
        One user of a bulk registration, applied independently of every other entry.

        Carries the same properties as `UserRegistration` and follows the same rule: matching looks at `identifier` alone, records are never merged, and the attributes are written solely on the insert that creates the user. An entry that names no identifier, or only whitespace, and an entry whose `email` is not a valid address, are reported as `REJECTED` rather than refusing the batch.
      properties:
        identifier:
          type: string
          maxLength: 255
          description: |
            The globally unique user identifier. Required in substance though not by this schema: an entry whose identifier is absent or blank is answered with outcome `REJECTED` instead of failing the request.
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
        localIdentifier:
          type: string
          maxLength: 2048
          description: |
            The calling participant's own identifier for this user, stored on that participant's link and visible to nobody else. Refreshed whenever a later registration supplies one.
          example: patient-10427
        email:
          type: string
          maxLength: 254
          description: |
            Contact address, written only when this entry creates the user. Must be a valid address, though not by this schema: unlike `UserRegistration.email` the shape is checked per entry, so a malformed address rejects its own entry instead of the batch.
          example: ada@example.org
        firstName:
          type: string
          maxLength: 255
          description: Given name. Same write-on-create rule as `email`.
          example: Ada
        lastName:
          type: string
          maxLength: 255
          description: Family name. Same write-on-create rule as `email`.
          example: Lovelace
    BulkRegistrationEntryResult:
      type: object
      description: What a bulk registration did with one entry of the batch.
      properties:
        identifier:
          type: string
          description: |
            The identifier the entry carried, echoed back. Results are returned in request order, so this is a cross-check rather than the way to correlate them; it is absent when the entry named no identifier at all.
          example: 0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a
        outcome:
          type: string
          description: |
            What the entry did.
            * `CREATED` — no user carried the identifier, so one was created from the
              entry's attributes and linked.
            * `LINKED` — the user already existed and this entry linked it to the
              calling participant. Its attributes were left as they were.
            * `ALREADY_LINKED` — the user was already linked to the calling
              participant; only `localIdentifier` may have changed.
            * `REJECTED` — this entry was not applied. Every other entry still was:
              entries do not share a transaction, so one failure neither rolls back
              what came before it nor stops what comes after.
          enum:
            - CREATED
            - LINKED
            - ALREADY_LINKED
            - REJECTED
          example: CREATED
        reason:
          type: string
          description: |
            Why a `REJECTED` entry was not applied, in the same voice as a problem detail. Absent for every other outcome.
          example: A registration must name a non-blank identifier.
      required:
        - outcome
    BulkRegistrationSummary:
      type: object
      description: |
        How the batch came out, counted by outcome. `total` equals the number of entries sent, and the four counts below always sum to it.
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          description: Entries the request carried, and results it was answered with.
          example: 4
        created:
          type: integer
          format: int32
          minimum: 0
          description: Entries whose outcome was `CREATED`.
          example: 2
        linked:
          type: integer
          format: int32
          minimum: 0
          description: Entries whose outcome was `LINKED`.
          example: 1
        alreadyLinked:
          type: integer
          format: int32
          minimum: 0
          description: Entries whose outcome was `ALREADY_LINKED`.
          example: 0
        rejected:
          type: integer
          format: int32
          minimum: 0
          description: Entries whose outcome was `REJECTED`.
          example: 1
      required:
        - total
        - created
        - linked
        - alreadyLinked
        - rejected
    PrivacyNotice:
      type: object
      description: |
        A privacy notice: what a contract says about the processing of personal data, stated under the headings a notice is published with.

        Generated from a contract held by the Contract Service and stored as it was extracted, so the notice a consent points at stays the notice that was published. The contract names the service offerings it covers only by catalog URI; `GET /privacy-notices/{id}?resolve=true` is the one place those documents are read, and `resolution` says how far that got.

        A heading the contract carries no source for is **absent**, never an empty string or an empty array. `withdrawalOfConsent` is absent on every notice this revision generates: withdrawing consent is a procedure of this service rather than a term of a contract between two participants, so no contract carries a source for it.
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this notice, assigned here and stable for its lifetime.
          example: 018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b
        contractUri:
          type: string
          description: |
            URI of the contract the notice states, verbatim as it was supplied. It is the key one active notice per provider is held against.
          example: https://contract.example.org/contracts/65d1f0a2b3c4d5e6f7a8b9c0
        title:
          type: string
          description: |
            Title of the notice, derived from the contract's subject — the ecosystem it governs, or the service offering a bilateral contract is about — falling back to the contract's own identifier. Absent when the contract names neither.
          example: Clinical research data sharing
        dataProvider:
          type: string
          description: Global identifier of the participant providing the data.
          example: urn:example:participant:clinic
        dataConsumer:
          type: string
          description: Global identifier of the participant consuming the data.
          example: urn:example:participant:research-lab
        purposes:
          type: array
          description: |
            Why the data is processed. Taken from the contract's own purposes where it declares them, and from its policy descriptions where it does not.
          items:
            type: string
          example:
            - Clinical outcome research
        categoriesOfData:
          type: array
          description: Categories of personal data the processing covers.
          items:
            type: string
          example:
            - Health data
            - Demographics
        data:
          type: array
          description: |
            The catalog documents the notice covers, by URI. `title` and `description` are filled in only by a resolved retrieval, because a contract names an offering without describing it. A resolved retrieval also appends the data resources behind each offering as entries of their own, which `partOf` tells apart from the offerings themselves.
          items:
            type: object
            properties:
              uri:
                type: string
                description: Absolute URI of the catalog document.
                example: https://catalog.example.org/v1/catalog/serviceofferings/65d1
              title:
                type: string
                description: Title taken from the resolved document.
              description:
                type: string
                description: Description taken from the resolved document.
              partOf:
                type: string
                description: |
                  URI of the service offering this entry was discovered behind. Absent on a service offering, which the contract names directly, and present on a data resource, which only that offering's document names.
                example: https://catalog.example.org/v1/catalog/serviceofferings/65d1
        recipients:
          type: array
          description: |
            Every participant the contract names as party to it, as the contract names it: for a bilateral contract its data provider and its data consumer, for an ecosystem contract its members less the revoked ones — a member that has not signed is kept. This notice's own two parties are therefore listed here as well.

            `name`, `contact` and `selfDescriptionUri` are filled in only by a resolved retrieval reading this service's participant registry; a recipient it has no registration for keeps its bare identifier.
          items:
            type: object
            properties:
              identifier:
                type: string
                description: Global participant identifier, as the contract names it.
                example: urn:example:participant:analytics
              name:
                type: string
                description: Legal name taken from the resolved registration.
              contact:
                type: string
                description: Contact address taken from the resolved registration.
              selfDescriptionUri:
                type: string
                description: Absolute URL of the recipient's self-description document.
        controllerDetails:
          type: object
          description: |
            The data controller, taken from the provider's own registration here rather than from the contract, so the notice names the controller as this service knows it.
          properties:
            name:
              type: string
              description: Legal name of the controller.
              example: Example Clinic Ltd
            contact:
              type: string
              description: Contact address for the controller.
              example: data-protection@clinic.example.org
            identifier:
              type: string
              description: Global participant identifier of the controller.
              example: urn:example:participant:clinic
            selfDescriptionUri:
              type: string
              description: Absolute URL of the controller's self-description document.
        retentionPeriod:
          type: string
          description: How long the data is kept, as the contract states it.
          example: 24 months from the effective date
        piiPrincipalRights:
          type: string
          description: |
            What the contract states about the rights of the person the data is about. One block of free text, because its only source is the contract's terms and conditions; splitting a paragraph into a list would dress it up as an enumeration no caller could rely on.
        internationalTransfers:
          type: array
          description: |
            The third parties the contract declares a disclosure to. Neither contract shape carries a jurisdiction for a third party, so an entry here is a declared disclosure and not necessarily a transfer abroad — a named party may well be domestic, and a client that renders this under an international-transfer heading alone mislabels it.

            A disclosure declared without naming the party is reported as the reserved identifier `urn:consent-manager:third-party:unnamed` rather than dropped, so a notice never understates the disclosure. A client has to match that value to render it in its own words.
          items:
            type: string
        withdrawalOfConsent:
          type: string
          description: |
            How consent may be withdrawn. Absent on every notice this revision generates — see the note above.
        createdAt:
          type: string
          format: date-time
          description: When this notice was generated.
        updatedAt:
          type: string
          format: date-time
          description: When this notice was last written.
        archivedAt:
          type: string
          format: date-time
          description: |
            When this notice was superseded by a regeneration. Absent while the notice is the active one for its contract and provider.
        resolution:
          description: |
            How far each section of this notice could be filled in from external documents.
          $ref: '#/components/schemas/PrivacyNoticeResolution'
      required:
        - id
        - contractUri
        - dataProvider
        - resolution
    GeneratePrivacyNotice:
      type: object
      description: |
        What a participant names when it asks for a privacy notice: the contract the notice is to be generated from, and the two parties the contract binds.

        `dataProvider` and `dataConsumer` are **global participant identifiers**, the same values `GET /participants` lists — not self-description URLs, and not identifiers of any kind this service hands out. **Nothing here is base64-encoded**, neither on this operation nor on the calls it makes to the Contract Service; an encoded identifier is simply an identifier nobody is registered under and is answered `404`.

        The contract decides the **direction** as far as it records it. A bilateral contract states both sides outright. An ecosystem contract names N members, so the direction is read off the role it records for a member and, where it records none, off who offers a service under it: a participant the contract puts on one side may not be declared on the other, and an ecosystem contract that evidences neither — members without roles and no service offerings — constrains membership only and lets this request's own declaration stand. A contradiction is answered `400` naming the side the contract records.
      properties:
        contractUri:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^(?!\s*$).+$
          description: |
            URI of the contract the notice states. Stored verbatim: it is the key one active notice per provider is held against, so this service never normalises it. The contract itself is fetched from the Contract Service this deployment is configured against, under the identifier the URI's last path segment carries.
          example: https://contract.example.org/contracts/65d1f0a2b3c4d5e6f7a8b9c0
        dataProvider:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^(?!\s*$).+$
          description: |
            Global identifier of the participant providing the data. Must be registered here and active, must be named as a party by the fetched contract, and must not be the party that contract records as consuming the data.
          example: urn:example:participant:clinic
        dataConsumer:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^(?!\s*$).+$
          description: |
            Global identifier of the participant consuming the data. Must be registered here and active, must be named as a party by the fetched contract, and must differ from `dataProvider`. An ecosystem contract that records no role for it but names it as offering a service under the contract puts it on the providing side, which is also refused.
          example: urn:example:participant:research-lab
      required:
        - contractUri
        - dataProvider
        - dataConsumer
    GenerateByContract:
      type: object
      description: |
        The contract a participant asks for a privacy notice from, with no parties declared.

        Use this when the contract itself says who the two parties are. A bilateral contract always does. An ecosystem contract does whenever exactly one of its still-bound members is on each side — the side being read off the role the contract records for a member and, where it records none, off who offers a service under it. An ecosystem contract that admits more than one party on either side, or none, is answered `400`: it names N members and no two of them inherently, and guessing would publish a legal document naming a party the contract never put there. Declare the two parties with `POST /privacy-notices` instead.
      properties:
        contractUri:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^(?!\s*$).+$
          description: |
            URI of the contract the notice states. Stored verbatim: it is the key one active notice per provider is held against, so this service never normalises it. The contract itself is fetched from the Contract Service this deployment is configured against, under the identifier the URI's last path segment carries.
          example: https://contract.example.org/contracts/65d1f0a2b3c4d5e6f7a8b9c0
      required:
        - contractUri
    PrivacyNoticeResolution:
      type: object
      description: |
        How far each part of the notice could be filled in from documents this service does not own.

        Generation never resolves, so a freshly generated notice reports `NOT_REQUESTED` for all four. `GET /privacy-notices/{id}?resolve=true` is the one place the other two values appear: a section whose external document could not be read degrades to `UNAVAILABLE` and the notice is served anyway, because a notice that cannot be displayed at all is worse than one displayed with a section marked unavailable.
      properties:
        contract:
          description: The contract document the notice was generated from.
          $ref: '#/components/schemas/ResolutionState'
        dataResources:
          description: |
            The catalog self-descriptions behind `data`, which a contract names only by URI and which a resolved retrieval dereferences.
          $ref: '#/components/schemas/ResolutionState'
        purposes:
          description: The purposes the notice states.
          $ref: '#/components/schemas/ResolutionState'
        recipients:
          description: The recipients the notice names.
          $ref: '#/components/schemas/ResolutionState'
      required:
        - contract
        - dataResources
        - purposes
        - recipients
    ResolutionState:
      type: string
      description: |
        How far one section of a privacy notice could be filled in from documents this service does not own.

        `RESOLVED` — every external document the section needs was read in full. `UNAVAILABLE` — resolution was asked for and at least one document could not be read; the section carries what the contract itself said and nothing more. `NOT_REQUESTED` — resolution was not asked for, which is what a freshly generated notice reports.
      enum:
        - RESOLVED
        - UNAVAILABLE
        - NOT_REQUESTED
      example: NOT_REQUESTED
    Consent:
      type: object
      description: |
        A consent record: where one data subject stands on one privacy notice — a decision taken, or a request still waiting for one — and the terms it is decided against, frozen as the notice stated them.

        `status` is the record's own state and `consented` is derived from it, never from the request, so the two can never disagree. `purposes` and `data` are the scope the record was decided against, copied off the notice at the moment it was created: they stay as they were even if the notice is later regenerated, which is what makes a stored consent evidence of the terms in play rather than a view of what the current notice says. They describe the scope whatever the status — on a `REFUSED` or `PENDING` record they are what was put to the subject, not what was agreed to; `consented` alone says whether anything may be processed.
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this consent, assigned here and stable for its lifetime.
          example: 018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b
        privacyNoticeId:
          type: string
          format: uuid
          description: The notice this consent was decided against.
          example: 018f3a2b-9d5e-7a1b-8c2d-3e4f5a6b7c8d
        parentConsentId:
          type: string
          format: uuid
          description: |
            The consent this one supersedes, when the decision replaced an earlier record for the same subject and notice. Absent when there was nothing to supersede, which is how a chain reports its first link.
          example: 018f3a2b-0e6f-7b2c-9d3e-4f5a6b7c8d9e
        status:
          type: string
          description: |
            State of the record. `GRANTED` and `REFUSED` are decisions the subject took; `PENDING` is a request awaiting one; `DRAFT` is a record not yet put to the subject; `REVOKED`, `EXPIRED` and `TERMINATED` are the ways a record stops being in force — withdrawn by the subject, run out of time, or ended by a change elsewhere such as the deregistration of a party.
          enum:
            - PENDING
            - DRAFT
            - GRANTED
            - REVOKED
            - EXPIRED
            - TERMINATED
            - REFUSED
          example: GRANTED
        consented:
          type: boolean
          description: |
            Whether the data may be processed under this record right now. True for `GRANTED` alone, and derived from `status` rather than stated separately, so no record can read as a grant the status does not support.
          example: true
        provider:
          type: string
          description: Global identifier of the participant providing the data.
          example: urn:example:participant:clinic
        consumer:
          type: string
          description: Global identifier of the participant consuming the data.
          example: urn:example:participant:research-lab
        purposes:
          type: array
          description: |
            The purposes this record was decided against, as the notice stated them when it was created — the elected subset where the decision narrowed the notice, the notice's own list where it did not. Read with `consented`: these are the purposes in play, not by themselves purposes agreed to. Absent when the notice declared none.
          items:
            type: string
          example:
            - Produce aggregated mobility insights for the city of Example.
        data:
          type: array
          description: |
            The categories of personal data this record was decided against, under the same rule as `purposes` and read the same way. The documents the notice names are not repeated here; `GET /privacy-notices/{id}` serves those.
          items:
            type: string
          example:
            - Trip records
        contractUri:
          type: string
          description: |
            URI of the contract this record was decided under, recorded on the consent itself rather than read back off the notice, so the record keeps naming its contract whatever later happens to the notice.
          example: https://contract.example.org/contracts/65d1f0a2b3c4d5e6f7a8b9c0
        createdAt:
          type: string
          format: date-time
          description: |
            When this record was created. Where the record began as a participant's request, this dates the request rather than the subject's answer to it.
        updatedAt:
          type: string
          format: date-time
          description: |
            When this record last changed state. On a record that answered an open request that is the moment the subject decided, until a later move — a revocation, a termination, an expiry — re-dates it.
      required:
        - id
        - privacyNoticeId
        - status
        - consented
        - provider
        - consumer
        - createdAt
        - updatedAt
    ConsentResponse:
      type: object
      description: |
        A consent as a query returns it: where one data subject stands on one privacy notice, and the terms it was decided against, frozen as the notice stated them when the decision was taken.

        `status` is the record's own state and `consented` is derived from it, never from a request, so the two can never disagree. `purposes` and `data` are the scope the record was decided against, copied off the notice when it was created and unchanged by any later regeneration of that notice; they describe the scope whatever the status, so on a `REFUSED` or `PENDING` record they are what was put to the subject rather than what was agreed to. `consented` alone says whether anything may be processed under this record right now.
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this consent, stable for its lifetime.
          example: 018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b
        privacyNoticeId:
          type: string
          format: uuid
          description: The notice this consent was decided against.
          example: 018f3a2b-9d5e-7a1b-8c2d-3e4f5a6b7c8d
        parentConsentId:
          type: string
          format: uuid
          description: |
            The consent this one supersedes, when the decision replaced an earlier record for the same subject and notice. Absent on a chain's first link.
          example: 018f3a2b-0e6f-7b2c-9d3e-4f5a6b7c8d9e
        status:
          type: string
          description: |
            State of the record. `GRANTED` and `REFUSED` are decisions the subject took; `PENDING` is a request awaiting one; `DRAFT` is a record not yet put to the subject; `REVOKED`, `EXPIRED` and `TERMINATED` are the ways a record stops being in force.
          enum:
            - PENDING
            - DRAFT
            - GRANTED
            - REVOKED
            - EXPIRED
            - TERMINATED
            - REFUSED
          example: GRANTED
        consented:
          type: boolean
          description: |
            Whether data may be processed under this record right now. True for `GRANTED` alone, and derived from `status` rather than stated separately.
          example: true
        provider:
          type: string
          description: Global identifier of the participant providing the data.
          example: urn:example:participant:clinic
        consumer:
          type: string
          description: Global identifier of the participant consuming the data.
          example: urn:example:participant:research-lab
        purposes:
          type: array
          description: |
            The purposes this record was decided against, as the notice stated them when it was created. Read with `consented`: these are the purposes in play, not by themselves purposes agreed to. Absent when the notice declared none.
          items:
            type: string
          example:
            - Produce aggregated mobility insights for the city of Example.
        data:
          type: array
          description: |
            The categories of personal data this record was decided against, under the same rule as `purposes` and read the same way. Absent when the notice declared none.
          items:
            type: string
          example:
            - Trip records
        contractUri:
          type: string
          description: |
            URI of the contract this record was decided under, recorded on the consent itself rather than read back off the notice.
          example: https://contract.example.org/contracts/65d1f0a2b3c4d5e6f7a8b9c0
        createdAt:
          type: string
          format: date-time
          description: |
            When this record was created. Where it began as a participant's request, this dates the request rather than the subject's answer to it.
        updatedAt:
          type: string
          format: date-time
          description: When this record last changed state.
        lineage:
          type: array
          description: |
            The records this one supersedes, newest first: its parent, then that record's parent, and so on. Present only when `includeLineage=true` was asked for, and then empty for a chain's first record. The walk stops at the deployment's configured depth, at a record the caller may not read, and at a record it has already visited, so a chain is never longer than the configured depth and never repeats a link. A record the caller may not read is not rendered, but its id still appears as the `parentConsentId` of the last link, just as this record's own `parentConsentId` names its predecessor.
          items:
            title: ConsentLineageLink
            type: object
            description: |
              One earlier record in the chain a consent supersedes: the decision it replaced, that decision's own predecessor, and so on.
            properties:
              id:
                type: string
                format: uuid
                description: Identifier of the superseded consent.
                example: 018f3a2b-0e6f-7b2c-9d3e-4f5a6b7c8d9e
              parentConsentId:
                type: string
                format: uuid
                description: |
                  The consent this link in turn supersedes. Absent on the chain's first record.
                example: 018f3a2b-0d5e-7a1b-8c2d-3e4f5a6b7c8d
              status:
                type: string
                description: State the superseded record holds now.
                enum:
                  - PENDING
                  - DRAFT
                  - GRANTED
                  - REVOKED
                  - EXPIRED
                  - TERMINATED
                  - REFUSED
                example: REVOKED
              consented:
                type: boolean
                description: |
                  Whether data may be processed under this record, derived from `status` as on the consent itself.
                example: false
              createdAt:
                type: string
                format: date-time
                description: When the superseded record was created.
              updatedAt:
                type: string
                format: date-time
                description: When the superseded record last changed state.
            required:
              - id
              - status
              - consented
              - createdAt
              - updatedAt
      required:
        - id
        - privacyNoticeId
        - status
        - consented
        - provider
        - consumer
        - createdAt
        - updatedAt
    ConsentValidity:
      type: object
      description: |
        Whether a subject's consent is in force for one privacy notice at the moment it was checked. `valid` is true only when a `GRANTED` consent exists that the calling participant is a party to and, where a `purpose` was named, that the consent's frozen scope covers it. Every other case is `valid: false` with a `reason`, and a case where no grant was found carries nothing further — disclosing nothing about whether the subject exists.
      properties:
        valid:
          type: boolean
          description: |
            Whether data may be processed for this subject under this notice right now.
          example: true
        consentId:
          type: string
          format: uuid
          description: |
            The granted consent the answer rests on. Absent when no grant was found.
          example: 018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b
        status:
          type: string
          description: |
            The found consent's lifecycle state. Always `GRANTED` when present, since only a grant is consulted; absent when no grant was found. The full set is published so the field stays stable if the check ever reports a non-grant.
          enum:
            - PENDING
            - DRAFT
            - GRANTED
            - REVOKED
            - EXPIRED
            - TERMINATED
            - REFUSED
          example: GRANTED
        grantedAt:
          type: string
          format: date-time
          description: |
            When the found consent last became the decision it now records. Absent when no grant was found.
        purposes:
          type: array
          description: |
            The purposes the found consent was decided against, as the notice stated them when it was created. Absent when no grant was found or the consent named none.
          items:
            type: string
          example:
            - Produce aggregated mobility insights for the city of Example.
        checkedAt:
          type: string
          format: date-time
          description: When the check was made, so a cached answer carries its own age.
        reason:
          type: string
          description: |
            Why the answer is `valid: false`, in human-readable form. Absent when `valid` is true.
          example: No consent is in force for this subject and notice.
      required:
        - valid
        - checkedAt
    ConsentReceipt:
      type: object
      description: |
        An ISO/IEC 29184 record of one consent decision: who decided, on what notice, in what state the record stands, and the terms presented, as they stood when the decision was taken.
      properties:
        receiptId:
          type: string
          format: uuid
          description: |
            Identifier of this receipt. The consent's own id, so every rendering of one consent is the same receipt.
          example: 018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b
        standard:
          type: string
          description: The standard this receipt follows.
          enum:
            - ISO/IEC 29184:2020
        consentId:
          type: string
          format: uuid
          description: The consent this receipt records.
        privacyNoticeId:
          type: string
          format: uuid
          description: The notice the decision was taken on.
        piiPrincipalId:
          type: string
          description: Identifier of the data subject who decided.
          example: did:example:alice
        status:
          type: string
          description: The state the consent stands in, as on `ConsentResponse`.
          enum:
            - PENDING
            - DRAFT
            - GRANTED
            - REVOKED
            - EXPIRED
            - TERMINATED
            - REFUSED
        consented:
          type: boolean
          description: Whether data may be processed under this consent right now.
        provider:
          type: string
          description: Global identifier of the participant providing the data.
        consumer:
          type: string
          description: Global identifier of the participant consuming the data.
        contractUri:
          type: string
          description: The contract the decision was taken under, as frozen on the consent.
        createdAt:
          type: string
          format: date-time
          description: When the consent was recorded.
        updatedAt:
          type: string
          format: date-time
          description: When the consent record was last written; not necessarily a change of state.
        title:
          type: string
          description: Title of the notice as presented.
        controllerDetails:
          type: object
          description: The PII controller the notice named.
          properties:
            name:
              type: string
              description: Legal name of the controller.
            contact:
              type: string
              description: Contact address for the controller.
            identifier:
              type: string
              description: Global participant identifier of the controller.
            selfDescriptionUri:
              type: string
              description: Absolute URL of the controller's self-description document.
        purposes:
          type: array
          description: The purposes elected in the decision.
          items:
            type: string
        dataCategories:
          type: array
          description: The categories of personal data elected in the decision.
          items:
            type: string
        dataReferences:
          type: array
          description: The catalog documents the notice covered.
          items:
            type: object
            properties:
              uri:
                type: string
                description: Absolute URI of the catalog document.
              title:
                type: string
                description: Title of the catalog document.
              description:
                type: string
                description: Description of the catalog document.
              partOf:
                type: string
                description: URI of the service offering this document was discovered behind.
        recipients:
          type: array
          description: The participants the notice named as recipients.
          items:
            type: object
            properties:
              identifier:
                type: string
                description: Global participant identifier of the recipient.
              name:
                type: string
                description: Legal name of the recipient.
              contact:
                type: string
                description: Contact address for the recipient.
              selfDescriptionUri:
                type: string
                description: Absolute URL of the recipient's self-description document.
        retentionPeriod:
          type: string
          description: How long the data is kept, as the notice stated it.
        piiPrincipalRights:
          type: string
          description: The data subject's rights, as the notice stated them.
        internationalTransfers:
          type: array
          description: The third-party disclosures the notice declared.
          items:
            type: string
        withdrawalOfConsent:
          type: string
          description: How consent may be withdrawn, as the notice stated it.
      required:
        - receiptId
        - standard
        - consentId
        - privacyNoticeId
        - piiPrincipalId
        - status
        - consented
        - provider
        - consumer
        - createdAt
        - updatedAt
    ConsentReceiptKantara:
      type: object
      description: |
        A KI-CR-v1.1.0 consent receipt for one granted consent, rendered from the terms frozen when consent was given.
      properties:
        version:
          type: string
          description: The receipt specification version.
          enum:
            - KI-CR-v1.1.0
        jurisdiction:
          type: string
          description: Jurisdiction governing the processing, configured per deployment.
          example: EU
        consentTimestamp:
          type: integer
          format: int64
          description: When consent was given, in seconds since the Unix epoch.
        collectionMethod:
          type: string
          description: How consent was collected.
        consentReceiptID:
          type: string
          description: Identifier of this receipt; the consent's own id.
        policyUrl:
          type: string
          description: |
            The contract the notice was generated from, as frozen on the consent; `urn:uuid:` and the notice's id when the consent carries none.
        piiPrincipalId:
          type: string
          description: Identifier of the data subject who gave consent.
        piiControllers:
          type: array
          description: The controller the notice named.
          items:
            type: object
            properties:
              piiController:
                type: string
                description: Name of the controller, or its identifier when unnamed.
              contact:
                type: string
                description: |
                  The controller's contact as the notice stated it, else the controller's name.
              address:
                type: object
                description: |
                  The controller's postal address. Always empty: a registration carries no postal address.
                properties:
                  streetAddress:
                    type: string
                    description: Street address; always empty.
                  addressLocality:
                    type: string
                    description: Locality; always empty.
                  addressRegion:
                    type: string
                    description: Region; always empty.
                  postalCode:
                    type: string
                    description: Postal code; always empty.
                  addressCountry:
                    type: string
                    description: Country; always empty.
              email:
                type: string
                description: Always `""`; a registration carries one `contact` and no email.
              phone:
                type: string
                description: Always `""`; a registration carries one `contact` and no phone.
              piiControllerUrl:
                type: string
                description: The controller's self-description document.
            required:
              - piiController
              - contact
              - address
              - email
              - phone
        services:
          type: array
          description: The one service consented to, and its elected purposes.
          items:
            type: object
            properties:
              service:
                type: string
                description: Title of the notice, or the contract when untitled.
              purposes:
                type: array
                description: The purposes elected in the decision, one entry each.
                items:
                  type: object
                  properties:
                    purpose:
                      type: string
                      description: The purpose as the notice stated it.
                    purposeCategory:
                      type: array
                      description: Always empty; a notice states purposes without a category.
                      items:
                        type: string
                    consentType:
                      type: string
                      description: Always `EXPLICIT`; only the data subject grants.
                    piiCategory:
                      type: array
                      description: The data categories the notice named; empty when it named none.
                      items:
                        type: string
                    termination:
                      type: string
                      description: |
                        How consent may be withdrawn, as the notice stated it, else this service's own revocation route.
                    thirdPartyDisclosure:
                      type: boolean
                      description: Whether the notice declared any recipients.
                    thirdPartyName:
                      type: string
                      description: |
                        The recipients the notice declared, each by name else identifier, comma-separated. Absent when it declared none. `thirdPartyDisclosure` is true exactly when present.
                  required:
                    - purpose
                    - purposeCategory
                    - consentType
                    - piiCategory
                    - termination
                    - thirdPartyDisclosure
            required:
              - service
              - purposes
        sensitive:
          type: boolean
          description: |
            Whether the notice declared sensitive PII. Always false: a notice declares no sensitive category.
        spiCat:
          type: array
          description: The sensitive PII categories the notice declared; always empty.
          items:
            type: string
      required:
        - version
        - jurisdiction
        - consentTimestamp
        - collectionMethod
        - consentReceiptID
        - policyUrl
        - piiPrincipalId
        - piiControllers
        - services
        - sensitive
        - spiCat
    AvailableContract:
      type: object
      description: |
        A contract the caller takes part in. The contract itself is read from the Contract Service; `roles` is read from the privacy notices this service holds for it, because those name the side each participant was published on.
      properties:
        contractUri:
          type: string
          description: |
            The contract URI as this service stores it, verbatim. The key by which a privacy notice is generated or resolved for this contract.
          example: https://contract.example.org/contracts/c-1
        contractId:
          type: string
          description: The Contract Service's own identifier for the contract.
          example: c-1
        shape:
          type: string
          description: |
            Which document the Contract Service holds: a `BILATERAL` contract between one data provider and one data consumer, or an `ECOSYSTEM` contract among the members of an ecosystem.
          enum:
            - BILATERAL
            - ECOSYSTEM
          example: BILATERAL
        status:
          type: string
          description: |
            The contract's status as the Contract Service reports it, verbatim. Absent when the document states none.
          example: signed
        dataProvider:
          type: string
          description: |
            The data provider a bilateral contract names. Absent on an ecosystem contract, which names its parties as members instead.
          example: did:web:provider.example.org
        dataConsumer:
          type: string
          description: |
            The data consumer a bilateral contract names. Absent on an ecosystem contract.
          example: did:web:consumer.example.org
        ecosystem:
          type: string
          description: |
            The ecosystem an ecosystem contract belongs to. Absent on a bilateral contract.
        roles:
          type: array
          description: |
            The sides the caller takes in the contract: for a participant, the sides it is published on; for a data subject, the sides any participant they are linked to is published on. Never empty, and each side appears at most once.
          items:
            type: string
            enum:
              - PROVIDER
              - CONSUMER
          example:
            - PROVIDER
      required:
        - contractUri
        - shape
        - roles
    GrantConsent:
      type: object
      description: |
        A data subject's decision about one privacy notice, and how far they narrowed it.

        The decision is recorded for the subject the bearer token names. Any user identifier, email or key sent alongside these properties is ignored rather than honoured: the token is the only statement of who decided.

        `purposes` and `data` elect part of the notice's terms. Omitting a list consents to the whole of it as the notice declares it; sending one narrows the consent to the entries named, which must all be declared by the notice. An empty list is refused — it elects nothing, which is not a narrowing — and so is a value the notice does not declare, both with `400`. Whatever is elected is frozen onto the consent, so a later edit to the notice cannot widen a decision already taken.
      properties:
        privacyNoticeId:
          type: string
          format: uuid
          description: |
            The notice being decided about. It must exist and must still be the active notice for its contract: an archived notice states terms no longer in force and is refused with `400`.
          example: 018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b
        decision:
          type: string
          description: |
            What the subject decided. `GRANTED` records consent and `REFUSED` records its deliberate withholding; both are decisions and both are stored, which is what makes a refusal auditable instead of indistinguishable from silence. No other status is reachable here — the ones a lifecycle move produces are not a decision a subject takes on a notice.
          enum:
            - GRANTED
            - REFUSED
          example: GRANTED
        purposes:
          type: array
          description: |
            The notice's purposes consented to. Absent means all of them.
          items:
            type: string
          example:
            - Produce aggregated mobility insights for the city of Example.
        data:
          type: array
          description: |
            The notice's categories of personal data consented to. Absent means all of them.
          items:
            type: string
          example:
            - Trip records
      required:
        - privacyNoticeId
        - decision
    ConsentRequest:
      type: object
      description: |
        A participant's ask that one of its users decide on a privacy notice.

        The ask elects nothing and confers nothing: it opens a `PENDING` record over the notice's full terms, and only the subject's own decision can narrow or answer it. There is deliberately no `purposes` or `data` here — a scope proposed by the party that wants the data would be read back as something the subject agreed to.
      properties:
        privacyNoticeId:
          type: string
          format: uuid
          description: |
            The notice the subject is being asked to decide on. It must exist and must still be the active notice for its contract — an archived one states terms no longer in force — and it must name the caller as its provider or its consumer.
          example: 018f3a2b-9d5e-7a1b-8c2d-3e4f5a6b7c8d
        userIdentifier:
          type: string
          description: |
            The global identifier of the subject to ask, who must already be linked to the calling participant. An identifier naming no user and one naming a user affiliated with somebody else are answered alike, so this property cannot be used to find out which users the service holds.
          example: urn:example:user:7f3a1c2e
      required:
        - privacyNoticeId
        - userIdentifier
    ResumeConsent:
      type: object
      description: |
        What a caller relaying a decision states about whose decision it is.

        A `USER` caller states nothing: the token already names the subject, so the body may be omitted entirely and a `userIdentifier` sent anyway is ignored, exactly as `POST /consents` ignores a user named in the body. A `CATALOG` caller is relaying somebody else's decision and must name them.
      properties:
        userIdentifier:
          type: string
          description: |
            The global identifier of the data subject whose decision is being relayed. Required of a `CATALOG` caller — omitting it is `400` — and ignored for a `USER` caller, whose token is the only statement of who decided. It is checked against the consent the path addresses rather than used to find one, so an identifier naming anybody but that consent's subject is `404`.
          example: urn:example:user:7f3a1c2e
    BulkUserRegistration:
      type: object
      description: |
        A batch of users a participant asks to have registered and linked to itself, each entry applied independently of the others.
      properties:
        users:
          type: array
          description: |
            The entries, applied in the order given and answered in that same order. An empty array is accepted and does nothing; how many entries one batch may carry is configured per deployment.
          items:
            $ref: '#/components/schemas/BulkUserRegistrationEntry'
      required:
        - users
    BulkRegistrationResult:
      type: object
      description: |
        What a bulk registration did, entry by entry and in total.
      properties:
        results:
          type: array
          description: One result per entry sent, in the order the entries were sent.
          items:
            $ref: '#/components/schemas/BulkRegistrationEntryResult'
        summary:
          description: The entries counted by outcome.
          $ref: '#/components/schemas/BulkRegistrationSummary'
      required:
        - results
        - summary
    ParticipantPage:
      type: object
      description: |
        One page of the participant directory, with enough of the whole to page through it without a second request.
      properties:
        content:
          type: array
          description: |
            The records of this page, ordered by `identifier`. Empty when the requested page lies past the end of the directory, which is a `200` rather than a `404` - the page is a view of a collection, not a record that does or does not exist.
          items:
            $ref: '#/components/schemas/Participant'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page, as requested.
        size:
          type: integer
          format: int32
          description: |
            Records this page was allowed to carry, which is the value actually applied: the configured default when `size` was omitted, and the configured ceiling when the requested `size` exceeded it.
        totalElements:
          type: integer
          format: int64
          description: |
            Records the query matches across every page, counted under the same filter - so with deregistered participants excluded unless an `identifier` filter was given.
        totalPages:
          type: integer
          format: int32
          description: |
            Pages the matching records occupy at the applied `size`; zero when nothing matches.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    SignedConsentReceipt:
      type: object
      description: An ISO/IEC 29184 consent record and the detached JWS over it.
      properties:
        receipt:
          description: The ISO/IEC 29184 consent record `jws` signs.
          $ref: '#/components/schemas/ConsentReceipt'
        jws:
          type: string
          description: |
            Detached compact JWS (RFC 7515 Appendix F, `header..signature`) over the RFC 8785 (JCS) canonical form of `receipt`. Verify it against the key `GET /.well-known/jwks.json` publishes under the header's `kid`. An ECDSA signature is randomized, so two reads of one receipt may carry different signatures over the same content.
          example: eyJraWQiOiJyZWNlaXB0cyIsImFsZyI6IkVTMjU2In0..MEUCIQ
      required:
        - receipt
        - jws
    SignedConsentReceiptKantara:
      type: object
      description: A Kantara KI-CR-v1.1.0 consent receipt and the detached JWS over it.
      properties:
        receipt:
          description: The Kantara consent receipt `jws` signs.
          $ref: '#/components/schemas/ConsentReceiptKantara'
        jws:
          type: string
          description: |
            Detached compact JWS (RFC 7515 Appendix F, `header..signature`) over the RFC 8785 (JCS) canonical form of `receipt`. Verify it against the key `GET /.well-known/jwks.json` publishes under the header's `kid`. Signed once, when the consent was granted, and served as stored, so every read of one receipt carries the same signature.
          example: eyJraWQiOiJyZWNlaXB0cyIsImFsZyI6IkVTMjU2In0..MEUCIQ
      required:
        - receipt
        - jws
    ConsentRepresentation:
      description: |
        One consent in the representation the request's `format` selected: `ConsentResponse` for `full`, `SignedConsentReceipt` for `receipt`, `SignedConsentReceiptKantara` for `receipt-kantara`.
      oneOf:
        - $ref: '#/components/schemas/ConsentResponse'
        - $ref: '#/components/schemas/SignedConsentReceipt'
        - $ref: '#/components/schemas/SignedConsentReceiptKantara'
    JsonWebKey:
      type: object
      description: A public JSON Web Key that consent receipts are verified against.
      properties:
        kty:
          type: string
          description: Key type.
          enum:
            - EC
            - RSA
        use:
          type: string
          description: Intended use; always signing.
          enum:
            - sig
        kid:
          type: string
          description: Key identifier, repeated in the JWS header of every receipt it signs.
        alg:
          type: string
          description: The JWS algorithm receipts are signed with under this key.
          example: ES256
        crv:
          type: string
          description: Curve of an EC key.
          example: P-256
        x:
          type: string
          description: X coordinate of an EC key, base64url.
        y:
          type: string
          description: Y coordinate of an EC key, base64url.
        n:
          type: string
          description: Modulus of an RSA key, base64url.
        e:
          type: string
          description: Exponent of an RSA key, base64url.
      required:
        - kty
        - use
        - kid
        - alg
    JsonWebKeySet:
      type: object
      description: |
        A JSON Web Key Set (RFC 7517 section 5) of the public keys consent receipts are signed with.
      properties:
        keys:
          type: array
          description: The published keys, one per `kid`.
          items:
            $ref: '#/components/schemas/JsonWebKey'
      required:
        - keys
    ConsentPage:
      type: object
      description: |
        One page of a subject's consents, with enough of the whole to page through it without a second request.
      properties:
        content:
          type: array
          description: |
            The consents of this page. Empty when the requested page lies past the end of the result, which is a `200` rather than a `404` - the page is a view of a collection, not a record that does or does not exist.
          items:
            $ref: '#/components/schemas/ConsentResponse'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page, as requested.
        size:
          type: integer
          format: int32
          description: |
            Records this page was allowed to carry, which is the value actually applied: the configured default when `size` was omitted, and the configured ceiling when the requested `size` exceeded it.
        totalElements:
          type: integer
          format: int64
          description: |
            Consents the query matches across every page, counted under the same filter the content was - so narrowed by `status` and `privacyNoticeId` when either was given.
        totalPages:
          type: integer
          format: int32
          description: |
            Pages the matching consents occupy at the applied `size`; zero when nothing matches.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
  responses:
    Unauthorized:
      description: |
        Authentication failed. The `Authorization` header was missing or malformed, or the bearer token was expired, not yet valid, incorrectly signed, signed with a rejected algorithm, or issued by an issuer that is not on the service's trust list. The body deliberately does not distinguish between these cases.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://consent-manager.example/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: The request did not carry a valid bearer token.
            instance: /v1/consents
    Forbidden:
      description: |
        The bearer token authenticated successfully but does not name a caller permitted to perform this operation. That covers a token that grants no role permitted here, a token whose roles claim is absent or wholly unmappable (it authenticates with zero roles), and a participant token whose identifier is not registered with this service, on any operation acting on the participant's own record or on the users it has linked.
        The body names the unregistered-participant case, because its remedy — registering — is the caller's own to apply and the identifier it echoes is the caller's own token claim. The remaining causes are deliberately not told apart from one another.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://consent-manager.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: The authenticated caller is not permitted to perform this operation.
            instance: /v1/consents
    BadRequest:
      description: |
        The request was rejected before it reached the consent model. Either a body or parameter failed validation — a required field was absent or blank, a value exceeded its length or did not match its format — or the request was otherwise unusable. The `detail` member names the rejected fields and why, so the caller can correct the request without guessing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://consent-manager.example/problems/bad-request
            title: Bad Request
            status: 400
            detail: 'identifier: must not be blank'
            instance: /v1/users/register
    NotFound:
      description: |
        The addressed resource does not exist, or does not exist as far as this caller is concerned. A participant asking about a user it is not linked to receives this and not `403 Forbidden`, deliberately: a 403 would confirm that the identifier names a registered user, which is exactly the fact the caller is not entitled to.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://consent-manager.example/problems/not-found
            title: Not Found
            status: 404
            detail: No user is registered under the supplied identifier.
            instance: /v1/users/urn%3Aexample%3Auser-1
    Conflict:
      description: |
        The request is well-formed but conflicts with the state the resource is already in — for instance unlinking a user from a participant while a consent granted to that participant is still in force. Registration itself is idempotent and never produces this: registering an identifier that already exists adopts the existing user, and re-registering a user that is already linked is reported as a no-op outcome with 200.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://consent-manager.example/problems/conflict
            title: Conflict
            status: 409
            detail: The user has a granted consent with this participant; revoke it before unlinking.
            instance: /v1/participants/me/users/urn:example:user:42
    NoticeGenerationContended:
      description: |
        Concurrent generations are contending for this contract and provider's one active notice faster than this request could claim it. Nothing was written; the request is safe to retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: |
        A service this operation depends on failed or could not be reached, so no answer could be assembled. Nothing partial is returned alongside it: an incomplete list would read as a complete one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://consent-manager.example/problems/upstream-service
            title: Bad Gateway
            status: 502
            detail: Contract Service at https://contract.example.org failed for contract c-1
            instance: /v1/contracts/available
