# Schema: ProblemDetail — referenced from api/openapi.yaml as components.schemas.ProblemDetail.
type: object
description: >
  RFC 7807 Problem Details for HTTP APIs. Used as the standard error
  response format across all endpoints.
properties:
  type:
    type: string
    format: uri
    description: >
      A URI reference that identifies the problem type. When
      dereferenced, it should provide human-readable documentation.
    example: "https://consent-manager.example/problems/not-found"
  title:
    type: string
    description: >
      A short, human-readable summary of the problem type. It should
      not change from occurrence to occurrence.
    example: "Not Found"
  status:
    type: integer
    format: int32
    description: >
      The HTTP status code generated by the origin server for this
      occurrence of the problem.
    example: 404
  detail:
    type: string
    description: >
      A human-readable explanation specific to this occurrence of the
      problem.
    example: "Consent record with ID 'abc-123' was not found."
  instance:
    type: string
    format: uri-reference
    description: >
      A URI reference that identifies the specific occurrence of the
      problem. It may or may not yield further information if
      dereferenced.
    example: "/v1/consents/abc-123"
  correlationId:
    type: string
    description: >
      Identifier of the request this problem occurred on, equal to the
      `X-Request-ID` response header. Quote it when reporting a failure; it is
      the key the service's logs are searched by.
    example: "0192f3a4-5b6c-7d8e-9f01-23456789abcd"
  errors:
    type: array
    description: >
      Every rejected field of a request that failed validation, ordered by field
      and then message. Present only on a validation failure; `detail` then lists
      the same rejections as one sentence.
    items:
      $ref: "./ProblemFieldError.yaml"
required:
  - type
  - title
  - status
