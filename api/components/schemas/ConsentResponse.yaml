# Schema: ConsentResponse — referenced from api/openapi.yaml as
# components.schemas.ConsentResponse.
#
# The shape the query side returns for `format=full`: the same facts the grant
# response (`Consent`) carries, published as a read model of its own so the two
# can diverge without one dragging the other along — the query representation
# carries a lineage chain that the write response has no business carrying.
#
# `lineage.items` is written inline, with a `title` naming the generated model,
# because a `$ref` under `items` from this file — to a sibling file or back into
# openapi.yaml — degrades to `List<Object>`; the inline, titled form generates
# `List<ConsentLineageLink>`. A link is deliberately narrower than this record:
# every link of one chain shares its subject and notice.
#
# No property is `nullable`, for the reason `Consent` states: a nullable
# response property forces `JsonNullable` onto the generated model, and absence
# already says everything an explicit null would. A consent that supersedes
# nothing simply carries no `parentConsentId`.
type: object
description: >
  A consent as a query returns it: where one data subject stands on one privacy
  notice, and the terms it was decided against, frozen as the notice stated them
  when the decision was taken.


  `status` is the record's own state and `consented` is derived from it, never
  from a request, so the two can never disagree. `purposes` and `data` are the
  scope the record was decided against, copied off the notice when it was created
  and unchanged by any later regeneration of that notice; they describe the scope
  whatever the status, so on a `REFUSED` or `PENDING` record they are what was put
  to the subject rather than what was agreed to. `consented` alone says whether
  anything may be processed under this record right now.
properties:
  id:
    type: string
    format: uuid
    description: Identifier of this consent, stable for its lifetime.
    example: "018f3a2b-7c4d-7e8f-9a0b-1c2d3e4f5a6b"
  privacyNoticeId:
    type: string
    format: uuid
    description: The notice this consent was decided against.
    example: "018f3a2b-9d5e-7a1b-8c2d-3e4f5a6b7c8d"
  parentConsentId:
    type: string
    format: uuid
    description: >
      The consent this one supersedes, when the decision replaced an earlier
      record for the same subject and notice. Absent on a chain's first link.
    example: "018f3a2b-0e6f-7b2c-9d3e-4f5a6b7c8d9e"
  status:
    type: string
    description: >
      State of the record. `GRANTED` and `REFUSED` are decisions the subject
      took; `PENDING` is a request awaiting one; `DRAFT` is a record not yet put
      to the subject; `REVOKED`, `EXPIRED` and `TERMINATED` are the ways a record
      stops being in force.
    enum:
      - PENDING
      - DRAFT
      - GRANTED
      - REVOKED
      - EXPIRED
      - TERMINATED
      - REFUSED
    example: "GRANTED"
  consented:
    type: boolean
    description: >
      Whether data may be processed under this record right now. True for
      `GRANTED` alone, and derived from `status` rather than stated separately.
    example: true
  provider:
    type: string
    description: Global identifier of the participant providing the data.
    example: "urn:example:participant:clinic"
  consumer:
    type: string
    description: Global identifier of the participant consuming the data.
    example: "urn:example:participant:research-lab"
  purposes:
    type: array
    description: >
      The purposes this record was decided against, as the notice stated them
      when it was created. Read with `consented`: these are the purposes in play,
      not by themselves purposes agreed to. Absent when the notice declared none.
    items:
      type: string
    example: ["Produce aggregated mobility insights for the city of Example."]
  data:
    type: array
    description: >
      The categories of personal data this record was decided against, under the
      same rule as `purposes` and read the same way. Absent when the notice
      declared none.
    items:
      type: string
    example: ["Trip records"]
  contractUri:
    type: string
    description: >
      URI of the contract this record was decided under, recorded on the consent
      itself rather than read back off the notice.
    example: "https://contract.example.org/contracts/65d1f0a2b3c4d5e6f7a8b9c0"
  createdAt:
    type: string
    format: date-time
    description: >
      When this record was created. Where it began as a participant's request,
      this dates the request rather than the subject's answer to it.
  updatedAt:
    type: string
    format: date-time
    description: When this record last changed state.
  lineage:
    type: array
    description: >
      The records this one supersedes, newest first: its parent, then that
      record's parent, and so on. Present only when `includeLineage=true` was
      asked for, and then empty for a chain's first record. The walk stops at
      the deployment's configured depth, at a record the caller may not read,
      and at a record it has already visited, so a chain is never longer than
      the configured depth and never repeats a link.
    items:
      title: ConsentLineageLink
      type: object
      description: >
        One earlier record in the chain a consent supersedes: the decision it replaced,
        that decision's own predecessor, and so on.
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the superseded consent.
          example: "018f3a2b-0e6f-7b2c-9d3e-4f5a6b7c8d9e"
        parentConsentId:
          type: string
          format: uuid
          description: >
            The consent this link in turn supersedes. Absent on the chain's first
            record.
          example: "018f3a2b-0d5e-7a1b-8c2d-3e4f5a6b7c8d"
        status:
          type: string
          description: State the superseded record holds now.
          enum:
            - PENDING
            - DRAFT
            - GRANTED
            - REVOKED
            - EXPIRED
            - TERMINATED
            - REFUSED
          example: "REVOKED"
        consented:
          type: boolean
          description: >
            Whether data may be processed under this record, derived from `status` as
            on the consent itself.
          example: false
        createdAt:
          type: string
          format: date-time
          description: When the superseded record was created.
        updatedAt:
          type: string
          format: date-time
          description: When the superseded record last changed state.
      required:
        - id
        - status
        - consented
        - createdAt
        - updatedAt
required:
  - id
  - privacyNoticeId
  - status
  - consented
  - provider
  - consumer
  - createdAt
  - updatedAt
