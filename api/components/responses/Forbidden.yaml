# Response: 403 Forbidden — referenced from api/openapi.yaml as
# components.responses.Forbidden.
#
# No operation references it yet: /api-status is declared `security: []` and must
# therefore not advertise 401 or 403. Every secured operation added by a later
# endpoint ticket must reference this response. That obligation is convention
# until Step 6's AC 19 spec-vs-@Secured consistency test enforces it, which is
# the place to add the check rather than leaving it to review.
description: >
  The bearer token authenticated successfully but does not grant a role that is
  permitted to perform this operation. A token whose roles claim is absent, or
  whose roles are all unmappable, authenticates with zero roles and therefore
  also receives this response.
content:
  application/problem+json:
    schema:
      $ref: "../schemas/ProblemDetail.yaml"
    example:
      type: "https://consent-manager.example/problems/forbidden"
      title: "Forbidden"
      status: 403
      detail: "The authenticated principal lacks a role permitted to perform this operation."
      instance: "/v1/consents"
