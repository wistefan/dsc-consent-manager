openapi: "3.0.3"
info:
  title: Consent Manager API
  description: >
    Consent lifecycle management API. Provides endpoints for creating,
    revoking, and querying consent records.
  version: "0.1.0"
  contact:
    name: Seamware
servers:
  - url: /v1
    description: Default server (behind API context path)

paths:
  /api-status:
    get:
      operationId: getApiStatus
      summary: API status check
      description: >
        Returns a simple status indicator confirming the API is reachable.
        This is a stub endpoint used to validate the OpenAPI code generation
        pipeline. Full API paths are defined in future tickets.
      tags:
        - Status
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatus"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  schemas:
    ApiStatus:
      type: object
      description: Simple API status response.
      properties:
        status:
          type: string
          description: Current status of the API.
          example: "ok"
      required:
        - status

    ProblemDetail:
      type: object
      description: >
        RFC 7807 Problem Details for HTTP APIs. Used as the standard error
        response format across all endpoints.
      properties:
        type:
          type: string
          format: uri
          description: >
            A URI reference that identifies the problem type. When
            dereferenced, it should provide human-readable documentation.
          example: "https://api.seamware.com/problems/not-found"
        title:
          type: string
          description: >
            A short, human-readable summary of the problem type. It should
            not change from occurrence to occurrence.
          example: "Not Found"
        status:
          type: integer
          format: int32
          description: >
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          example: 404
        detail:
          type: string
          description: >
            A human-readable explanation specific to this occurrence of the
            problem.
          example: "Consent record with ID 'abc-123' was not found."
        instance:
          type: string
          format: uri
          description: >
            A URI reference that identifies the specific occurrence of the
            problem. It may or may not yield further information if
            dereferenced.
          example: "/v1/consents/abc-123"
      required:
        - type
        - title
        - status
