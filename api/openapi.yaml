openapi: "3.0.3"
info:
  title: Consent Manager API
  description: |
    Consent lifecycle management API. Provides endpoints for creating,
    revoking, and querying consent records.

    ## Authentication and authorization

    The Consent Manager is a stateless OAuth2 **resource server**. Every operation
    except the public `/api-status` reachability probe requires a bearer JWT issued
    by one of the identity providers on the service's trust list, which is read
    from configuration once at startup and is fixed for the life of the process.
    The complete token contract — every claim, its optionality, the configurable
    claim names and the accepted signature algorithms — is documented on the
    `bearerAuth` security scheme.

    Three roles are recognised:

    - `USER` — a natural person, who may manage and read their own consent records.
    - `PARTICIPANT` — a dataspace participant, which may manage and read consent
      records relating to itself.
    - `CATALOG` — the dataspace catalog service, which may read consent state
      across the dataspace. A "catalog token" is simply a participant access token
      carrying this role.

    Failures are reported as RFC 7807 problem details and distinguish the two
    cases: a request that fails **authentication** receives `401 Unauthorized`
    (missing, malformed, expired, incorrectly signed or untrusted token, with the
    body revealing nothing about which), while a request that authenticates but
    lacks the role required by the operation receives `403 Forbidden`.

    ## Participant onboarding

    **The identity provider is the gatekeeper.** A participant becomes able to
    call this API the moment one of the trusted providers will issue it a token
    carrying the `PARTICIPANT` role and a participant-identifier claim — which is
    a matter between the organisation and that provider's operator, and happens
    entirely outside this service. There is no login endpoint, no credential is
    accepted and none is stored; the worked `client_credentials` example is on the
    `bearerAuth` security scheme.

    **Onboarding is one call.** Holding such a token, the organisation
    `POST`s `/participants` with its self-description and is registered. There is
    no approval workflow, no pending state and no administrator in the loop: the
    response is the registration. Until that call succeeds the token still
    authenticates, but every operation acting on the participant's own record
    answers `403`; `POST /participants` is the only operation acting on the
    caller's own record that accepts an identifier this service does not yet
    know. The participant directory is readable either way.

    The identifier is always taken from the token claim, never from the body, the
    path or a query parameter, so a participant can only ever register, read,
    update or deregister itself. `DELETE /participants/me` reverses onboarding.
  version: "0.1.0"
  contact:
    name: Seamware
servers:
  - url: /v1
    description: Default server (behind API context path)

# Every operation requires a bearer token unless it overrides this with its own
# `security` entry.
security:
  - bearerAuth: []

paths:
  /api-status:
    get:
      operationId: getApiStatus
      summary: API status check
      description: >
        Returns a simple status indicator confirming the API is reachable.
        This is a public reachability probe: it requires no authentication and
        exposes no consent data.
      tags:
        - Status
      # Public endpoint: overrides the global bearerAuth requirement.
      security: []
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatus"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /users/register:
    post:
      operationId: registerUser
      summary: Register the calling user
      description: >
        Registers the natural person the bearer token names and returns their
        record. The identity is taken entirely from the token — there is no
        request body, and a caller cannot register anybody but themselves.


        The record is keyed on the global user identifier the token asserts, so
        the operation is idempotent: `201 Created` the first time this service
        sees the identifier, `200 OK` on every later call, with the same body.
        Registration is the same code path as the just-in-time provisioning
        every other authenticated route performs, so a user first seen through
        another endpoint is already registered and receives `200` here.
      tags:
        - Users
      security:
        - bearerAuth: [USER]
      # `security` is the published contract; `x-roles` and `x-principal` are what
      # the generator reads. `x-roles` becomes the routed method's @Secured rule -
      # without it the generator emits @Secured(IS_AUTHENTICATED), which would let
      # any authenticated token through - and `x-principal` adds the typed caller
      # parameter PrincipalResolutionFilter keys on. Both must agree with
      # `security`, and SpecSecurityConsistencyTest fails the build when they do
      # not. Every secured operation below repeats all three.
      x-roles: [USER]
      x-principal: UserPrincipal
      responses:
        "200":
          description: The user was already registered; the existing record is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: The user was registered by this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /users/me:
    get:
      operationId: getCurrentUser
      summary: Read the calling user's own record
      description: >
        Returns the record of the natural person the bearer token names,
        including the identifiers of the participants they are linked to. The
        record is created on first sight, so this operation does not report
        `404` for an otherwise valid user token.
      tags:
        - Users
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      responses:
        "200":
          description: The caller's own user record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    delete:
      operationId: eraseCurrentUser
      summary: Erase the calling user's record
      description: >
        Erases the natural person the bearer token names and reports what that
        cost. Every participant link is removed, every `GRANTED` consent is
        revoked and every unanswered one - `PENDING` or `DRAFT` - is
        `TERMINATED`, each with the matching event appended to its trail.


        The consent records and their events are retained as the evidence of
        what was authorised while it was authorised; what is destroyed is the
        tie between them and the person. The `users` row is deleted outright
        when no consent refers to it, and otherwise kept with its attributes
        cleared under the opaque `pseudonym` this response carries once and
        never again.


        The whole erasure is one transaction. The caller is registered by this
        route's own authentication, so this operation never reports `404`, and a
        later token for the same subject provisions a new record rather than
        resurrecting this one. For why the pseudonym is opaque rather than
        derived, what a consent naming nobody is still worth, and the keyed
        verifier a retained record keeps for the operator, see
        `docs/adr/0007-erasure-pseudonymises-the-user-and-retains-the-audit-trail.md`.
      tags:
        - Users
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      responses:
        "200":
          description: The record was erased. The body reports what that entailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /users/search:
    post:
      operationId: searchUsers
      summary: Search registered users
      description: >
        Returns the registered users matching every criterion in the body, as
        far as the caller is entitled to see them. A `PARTICIPANT` caller sees
        only users linked to itself — a `participantIdentifier` naming another
        participant narrows that result rather than widening it — while a
        `CATALOG` caller reads across the dataspace. A body naming no criterion
        at all is rejected with `400 Bad Request` rather than listing everybody.


        Matching on `email` is exact but case-insensitive, and email is neither
        unique nor authoritative in this service, so the result may name several
        users. Matching on `identifier` is exact and case-sensitive, and is the
        documented way to reach a user that `GET /users/{identifier}` cannot
        address: one whose identifier contains `/`, or whose identifier is the
        literal `me`.


        The `participants` array of each returned user is scoped the same way the
        result is: a `PARTICIPANT` caller sees only its own link, a `CATALOG`
        caller sees every one. A participant does not learn which other
        participants the user is affiliated with.


        The result is capped at `consent-manager.users.search-max-results` users
        (200 by default) and this operation is not paginated, so a result of
        exactly that size may have been truncated and the caller should narrow
        its criteria rather than treat it as the complete answer.
      tags:
        - Users
      security:
        - bearerAuth: [PARTICIPANT, CATALOG]
      x-roles: [PARTICIPANT, CATALOG]
      x-principal: ConsentManagerPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSearch"
      responses:
        "200":
          description: >
            The matching users, sorted by identifier so the order is stable
            between requests and truncation is deterministic. Empty when nothing
            matches — a search that finds nobody is not a `404`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /users/{identifier}:
    get:
      operationId: getUser
      summary: Look a user up by their global identifier
      description: >
        Returns the user the identifier names, provided the caller is entitled
        to see them: a `PARTICIPANT` caller may read only users linked to
        itself, a `CATALOG` caller reads across the dataspace.


        A caller not entitled to the user receives `404 Not Found` with the same
        body as for an identifier naming nobody at all, deliberately — a `403`
        would confirm that the identifier names a registered user, which is
        precisely what the caller is not entitled to learn.


        `{identifier}` is the URL-encoded global user identifier. A path
        variable never spans a `/`, so an identifier containing one reaches this
        route only percent-encoded, and whether an encoded slash survives is a
        property of the deployment rather than of this service: an intermediary
        that refuses or decodes `%2F` ahead of routing leaves such an identifier
        unaddressable here. `POST /users/search` with the `identifier` criterion
        matches the value whole and is dependable for that case. The literal
        identifier `me` is unreachable here in every deployment, because
        `GET /users/me` claims that path for the caller's own record.


        The `participants` array of the returned user is scoped to the caller: a
        `PARTICIPANT` sees only its own link, a `CATALOG` caller sees every one.
        A participant does not learn which other participants the user is
        affiliated with.
      tags:
        - Users
      security:
        - bearerAuth: [PARTICIPANT, CATALOG]
      x-roles: [PARTICIPANT, CATALOG]
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: The URL-encoded global user identifier.
          schema:
            type: string
          example: "0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a"
      responses:
        "200":
          description: The user the identifier names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /participants:
    get:
      operationId: listParticipants
      summary: List the participant directory
      description: >
        Returns a page of the dataspace's registered participants, so a caller
        can discover who it may transact with.


        Deregistered participants are left out, because the directory answers
        who can be transacted with now. Such a record stays readable through
        `GET /participants/{identifier}` and through the `identifier` filter
        here, both of which carry `deregisteredAt`, so the state is never merely
        implied by an absence.


        Records are ordered by `identifier`, which is unique, so a record never
        moves between pages while the directory itself does not change. The
        count and the page are two separate statements over a directory anyone
        may register in, so a registration or deregistration committed between
        them - or between two page requests - can still shift a record across a
        boundary or leave `totalElements` disagreeing with what `content`
        carries. Nothing here is served from a snapshot.


        Each entry is the participant record in full, the same representation
        `GET /participants/{identifier}` returns. Nothing a participant records
        about itself is a credential, so a listing has nothing to leave out that
        a lookup would hand to the same caller anyway.


        Neither the default page size nor the largest one accepted is written in
        this document, because a literal here could not track a value each
        deployment configures. Omitting `size` applies the configured default,
        and a `size` above the configured ceiling is clamped to it and answered
        `200` rather than rejected; the `size` of the response always reports the
        value actually applied. The bounds that are fixed - a `page` from zero
        and a `size` of at least one - are declared below and are enforced as
        `400`.
      tags:
        - Participants
      security:
        - bearerAuth: [USER, PARTICIPANT, CATALOG]
      x-roles: [USER, PARTICIPANT, CATALOG]
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based index of the page to return.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: >
            How many records the page may carry. Omitted, this deployment's
            configured default applies; above its configured ceiling, the
            ceiling applies.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: identifier
          in: query
          required: false
          description: >
            Return only the participant whose identifier is exactly this,
            deregistered or not. Matched whole and case-sensitively, and the
            dependable way to reach a participant whose identifier contains a
            `/`, which a path segment carries only percent-encoded.
          schema:
            type: string
          example: "urn:example:participant:clinic"
      responses:
        "200":
          description: The requested page of the directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    post:
      operationId: registerParticipant
      summary: Register the calling participant
      description: >
        Registers the organization the bearer token names and returns its record.


        The participant identifier is taken entirely from the token's
        `claims.participant-identifier` claim: it is not a property of the
        request body, and an `identifier` sent anyway is ignored rather than
        rejected. A caller therefore cannot register anybody but itself, and
        cannot rename an existing registration by re-registering under a
        different identifier.


        Unlike `POST /users/register` this is **not** idempotent: an identifier
        this service already knows is answered with `409 Conflict`, because a
        second registration carries a full self-description that would otherwise
        silently either overwrite the stored one or be discarded. Updating a
        registration is `PUT /participants/me`.


        No credential is accepted and none is stored. Registration records what
        the organization says about itself; authentication stays entirely with
        the identity provider that issued the token.
      tags:
        - Participants
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantRegistration"
      responses:
        "201":
          description: The participant was registered by this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /participants/me:
    get:
      operationId: getCurrentParticipant
      summary: Read the calling participant's own registration
      description: >
        Returns the registration of the participant the bearer token names.


        Which record is returned is decided entirely by the token's
        `claims.participant-identifier` claim, so there is no way to ask for
        anybody else's record here; reading another participant is
        `GET /participants/{identifier}`.


        A token whose participant has never registered is answered with
        `403 Forbidden` rather than `404 Not Found`: the caller is a valid
        participant that has not yet created its record, and
        `POST /participants` is what creates it.
      tags:
        - Participants
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      responses:
        "200":
          description: The calling participant's registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      operationId: updateCurrentParticipant
      summary: Replace the calling participant's own registration
      description: >
        Replaces the self-description of the participant the bearer token names
        and returns the stored result.


        The body is the self-description in full, not a patch: an optional
        property left out is cleared. The identifier is not part of the body and
        is never changed by an update - an `identifier` sent anyway is ignored
        rather than rejected - so every consent and privacy notice already keyed
        on it keeps naming the same organization.


        A token whose participant has never registered is answered with
        `403 Forbidden` rather than `404 Not Found`, exactly as the `get` is: an
        update does not double as a registration, which is
        `POST /participants`.


        Concurrent updates are last-writer-wins: each replaces the whole
        self-description, and the later one wins outright. An update that finds
        the registration deregistered, or no longer there at all, applies
        nothing and is answered `409 Conflict`.
      tags:
        - Participants
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantUpdate"
      responses:
        "200":
          description: The registration as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    delete:
      operationId: deregisterCurrentParticipant
      summary: Deregister the calling participant
      description: >
        Removes the organization the bearer token names from the dataspace and
        reports what that entailed.


        The cascade runs in this order, as one transaction. Any consent naming
        the participant as provider or consumer that is still `GRANTED` refuses
        the whole operation with `409 Conflict`, and the problem detail names
        the blocking consents: a granted consent is a permission the *user*
        gave, and only that user can withdraw it. Otherwise every `PENDING` and
        `DRAFT` consent naming the participant moves to `TERMINATED` with a
        `CONSENT_TERMINATED` event, because an unanswered offer must not stay
        advanceable once one side has left. Every link to a user is then
        removed, and every privacy notice naming the participant as provider or
        consumer that is not already archived is archived.


        The `participants` row is finally deleted outright when nothing refers
        to it, and otherwise retained, marked with `deregisteredAt`, with its
        contact `email` cleared and its `endpoints` emptied. A retained record
        keeps its `identifier`, `legalName`, `selfDescriptionUri` and
        `legalPerson` intact and deliberately unscrubbed, so that the consents
        and notices that still name it stay legible; it is excluded from
        `GET /participants` but still resolves through
        `GET /participants/{identifier}`. Registering the same identifier again
        reactivates that record rather than conflicting with it.


        A repeated call on an already-deregistered record is a `409 Conflict`
        rather than a second cascade, so the recorded departure time cannot be
        moved. After a deregistration the same token still reads its own record,
        but no longer writes: the `/participants/me/users` operations answer
        `403 Forbidden` until the participant registers again.


        For why a granted consent blocks the exit while a draft does not, why an
        organization is not pseudonymised the way an erased user is, and what
        `deregisteredAt` does and does not mean, see
        `docs/adr/0008-deregistration-retains-the-participant-and-closes-its-open-business.md`.
      tags:
        - Participants
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      responses:
        "200":
          description: >
            The participant was deregistered. The body reports what that
            entailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeregistrationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /participants/me/users/bulk:
    post:
      operationId: registerParticipantUsersBulk
      summary: Register a batch of users for the calling participant
      description: >
        Applies `POST /participants/me/users` to every entry of a batch and
        reports what each one did. The response is always `207 Multi-Status`
        when the batch itself was acceptable, never a single status standing for
        all of them: a batch routinely mixes users this participant has just
        acquired with users it has registered before, and that is a success, not
        a partial failure.


        **Entries are independent.** They share no transaction, so an entry that
        cannot be applied neither rolls back the entries before it nor stops the
        entries after it; it is reported as `REJECTED`, with a `reason`, and the
        batch continues. The rule each entry follows, and which of `CREATED`,
        `LINKED` and `ALREADY_LINKED` it reaches, is the one
        `POST /participants/me/users` documents in full — including that
        adopting an existing user never rewrites its attributes, and that the
        participant comes from the token and from nowhere else.


        `results` holds exactly one entry per entry sent, in the order sent, and
        `summary` counts them by outcome. **Unusable data in one entry costs only
        that entry:** an entry naming no identifier, or only whitespace, and an
        entry whose `email` is not a valid address are both answered `REJECTED`
        with a `reason` while the batch's remaining entries land. The same
        identifier sent twice in one batch is not an error either — the second
        occurrence simply sees the user the first one created, so it reports
        `ALREADY_LINKED`.


        **Two failures are request-level and answered `400`,** because they are
        facts about the request rather than about one entry. The first is a
        batch carrying more entries than the deployment permits; the limit is
        configured, and a batch above it is refused before anything is written.
        The second is a batch in which any string exceeds the `maxLength` its
        property publishes — those bounds guard the stored columns, so they are
        checked before the batch is applied and **a single over-long value
        discards the whole batch** without naming the entry at fault. Keep
        values within the documented lengths; everything else about an entry's
        content is reported per entry. A batch carrying no entries at all is not
        an error: it is answered `207` with an empty `results` and a summary of
        zeroes.
      tags:
        - Participant Users
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUserRegistration"
      responses:
        "207":
          description: >
            The batch was applied. Every entry carries its own outcome, and an
            entry may have been rejected while the rest succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRegistrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /participants/me/users:
    post:
      operationId: registerParticipantUser
      summary: Register a user for the calling participant
      description: >
        Registers the user the body names and links them to the participant the
        bearer token names, returning the stored record and which of the three
        outcomes the call reached.


        The rule is deterministic and keyed on the global user identifier alone.
        No user carries it yet: the user is created from the supplied attributes,
        linked, and the response is `201 Created` with outcome `CREATED`. A user
        already carries it: that record is adopted and linked as it stands — its
        `email`, `firstName` and `lastName` are **not** overwritten, because
        attributes belong to whoever created the record and to the user's own
        identity provider, never to a later registrant — and the response is
        `200 OK` with outcome `LINKED`. The link already exists: nothing changes
        beyond `localIdentifier`, and the response is `200 OK` with outcome
        `ALREADY_LINKED`. Two records are never merged, and `email` is never
        matched on: it is neither unique nor authoritative here.


        The participant is read from the token and from nowhere else, so a
        participant can only ever register a user for itself. A
        `participantIdentifier` property in the body — whether it names the
        caller, another participant or nobody at all — is ignored rather than
        rejected, and changes nothing about which participant the user is linked
        to.


        Addressing is by the data space's global identifier alone.
        `localIdentifier` is a convenience column on the calling participant's
        own link: invisible to every other participant, never a lookup key, and
        never part of matching. An identifier containing `/`, and the literal
        value `me`, cannot be addressed as a path segment on
        `GET /users/{identifier}` and are reached through `POST /users/search`
        instead. The rationale in full is `docs/user-identifiers.md` in this
        service's repository — deliberately named rather than linked, since the
        published specification serves no path under which that file resolves.
      tags:
        - Participant Users
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "200":
          description: >
            The user already existed. Outcome `LINKED` when this call linked them
            to the caller, `ALREADY_LINKED` when the link was already there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRegistrationResult"
        "201":
          description: The user was created by this request and linked to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRegistrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /participants/me/users/{identifier}:
    patch:
      operationId: updateParticipantUserLink
      summary: Update the calling participant's link to a user
      description: >
        Applies the body to the link the calling participant holds for the user
        the path names, and returns the link as it now stands.


        Merge-patch semantics on a single property: sending a `localIdentifier`
        sets it, sending it as `null` clears it, and omitting it altogether
        leaves the stored value alone. A blank string is stored as no local
        identifier, so `null` and `""` settle on one representation.


        Only the link is touched. The user record itself — `email`, `firstName`,
        `lastName` and every other participant's link — is out of reach here, by
        design: attributes belong to whoever created the record and to the user's
        own identity provider, never to a participant that merely holds a link.


        A caller holding no link to the identifier receives `404 Not Found`, with
        the same body as for an identifier naming nobody at all. A `403` would
        confirm that the identifier names a registered user, which is precisely
        what a participant without a link is not entitled to learn.


        `{identifier}` is the URL-encoded global user identifier, with the same
        limit as on `GET /users/{identifier}`: a path variable never spans a
        `/`, so an identifier containing one reaches this route only
        percent-encoded, and whether an encoded slash survives is a property of
        the deployment rather than of this service.
      tags:
        - Participant Users
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: The URL-encoded global user identifier.
          schema:
            type: string
          example: "0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantUserLinkUpdate"
      responses:
        "200":
          description: The link as stored after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantUserLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      operationId: unlinkParticipantUser
      summary: Unlink a user from the calling participant
      description: >
        Removes the calling participant's link to the user the path names. The
        user record itself survives, as do every consent it is party to and
        every other participant's link: this operation ends an affiliation, it
        does not erase a person. Erasure is the data subject's own
        `DELETE /users/me`.


        Refused with `409 Conflict` while any consent naming the caller as
        provider or consumer is still `GRANTED` for that user — unlinking would
        strand a consent whose participant no longer knows the user. Revoke those
        consents first. A consent in any other status, and a granted consent
        between two other participants, do not block the unlink.


        `PENDING` and `DRAFT` deliberately do not block it either: neither
        authorises a data flow, so neither is worth refusing an unlink over. A
        consent in one of those statuses that is granted after the unlink is
        left stranded in the same way a consent granted concurrently with the
        unlink is — the check is advisory on this side, and the complementary
        guard belongs on the consent-granting path, which must refuse to grant
        for a participant holding no link. See `docs/user-identifiers.md`.


        A caller holding no link to the identifier receives `404 Not Found`, on
        the same reasoning as the `PATCH` above. The operation is not idempotent
        in the sense of answering `204` twice: a second call finds no link and
        answers `404`.
      tags:
        - Participant Users
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: The URL-encoded global user identifier.
          schema:
            type: string
          example: "0c6e4d18-9b1c-4b6f-9f6d-2f4b1b0f1d3a"
      responses:
        "204":
          description: The link was removed. The user and its consents are untouched.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /participants/{identifier}:
    get:
      operationId: getParticipantByIdentifier
      summary: Look a participant up by its global identifier
      description: >
        Returns the participant the identifier names, so a counterparty named by
        a consent or a contract can be resolved to its self-description.


        A deregistered participant resolves here and carries `deregisteredAt`,
        because a consent retained after deregistration still names it and would
        otherwise name nobody a reader could identify. It is only the directory
        listing that leaves such a record out.


        `{identifier}` is the URL-encoded global participant identifier. A path
        variable never spans a `/`, so an identifier containing one - a
        URI-shaped identifier, as opposed to a DID - reaches this route only
        percent-encoded, and whether an encoded slash survives is a property of
        the deployment rather than of this service: an intermediary that refuses
        or decodes `%2F` ahead of routing leaves such an identifier
        unaddressable here. `GET /participants?identifier=...` matches the
        identifier whole and is dependable for that case. The literal identifier
        `me` is unreachable here in every deployment, because
        `GET /participants/me` claims that path for the calling participant's
        own record.
      tags:
        - Participants
      security:
        - bearerAuth: [USER, PARTICIPANT, CATALOG]
      x-roles: [USER, PARTICIPANT, CATALOG]
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: identifier
          in: path
          required: true
          description: URL-encoded global participant identifier.
          schema:
            type: string
          example: "urn:example:participant:clinic"
      responses:
        "200":
          description: The participant the identifier names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /privacy-notices:
    post:
      operationId: generatePrivacyNotice
      summary: Generate a privacy notice from a contract
      description: >
        Generates the privacy notice for a contract and the two participants it
        binds, and returns it.


        The flow is fixed, and a refusal names the step it failed at. The two
        identifiers are resolved against this service's participant directory, a
        `404` naming whichever is unknown — and a deregistered participant is
        unknown here, because a new notice must not republish the record its
        deregistration retained only to keep the existing notices legible. The
        caller must be one of the two parties, or the request is `403`; a
        deregistered caller is `403` too, because generating a notice acts in the
        dataspace in the participant's name. The contract is then fetched from
        the Contract Service — an
        unknown contract is `404`, an unreachable Contract Service is `502`, and
        this is the one place in the whole API where that outage is fatal rather
        than degraded. The two declared parties must both be named by the fetched
        contract, or the request is `400`: without that check a body could name
        any consumer at all and the published notice would misname a party.
        Finally the contract's content is extracted and compared against the
        active notice for this contract and provider, if there is one.


        That comparison is what the two success codes report. `200` means an
        active notice already existed whose content is exactly what this contract
        yields now — nothing was written, and the notice returned is the one that
        was already there, with its original `id`. `201` means a notice was
        created: either there was none, or the contract has changed in a way that
        changes the notice, in which case the previous notice is archived in the
        same transaction and the response carries the new one. An upstream edit
        that does not change the notice — a signature added, a timestamp bumped —
        is a `200` and archives nothing, so consents already pointing at a notice
        are not invalidated by a change that did not reach them.


        One active notice is held per contract and provider, and the database
        enforces it. Two callers generating at once therefore both succeed: the
        one that lost the race re-reads the winner and answers exactly as it
        would have done had the two run in sequence — `200` with the winner's
        notice when that notice says what this request yields, `201` superseding
        it when it does not. Only a slot contended faster than one retry can
        claim it is refused, with `409`.


        Nothing here resolves external documents, so the `resolution` block of
        the response reports `NOT_REQUESTED` throughout. The contract's
        freshness is bounded by this deployment's contract cache lifetime: a
        contract edited upstream within that window is not yet visible here, and
        a regeneration will report `200` until it is.
      tags:
        - Privacy Notices
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePrivacyNotice"
      responses:
        "200":
          description: >
            An active notice with exactly this content already existed and was
            returned unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "201":
          description: >
            The notice was generated by this request; any previous active notice
            for the same contract and provider was archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Concurrent generations are contending for this contract and
            provider's one active notice faster than this request could claim
            it. Nothing was written; the request is safe to retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: >
            The Contract Service could not be reached, so the contract behind the
            notice could not be read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /privacy-notices/by-contract:
    post:
      operationId: generatePrivacyNoticeByContract
      summary: Generate a privacy notice from a contract alone
      description: >
        Generates the privacy notice for a contract whose two parties the
        contract itself names, and returns it.


        Everything after the two parties are known is `POST /privacy-notices`,
        step for step and code for code: the same participant lookups, the same
        `403` for a caller that is not a party, the same comparison against the
        active notice, the same `200`/`201` split and the same one-active-notice
        rule per contract and provider. Only how the parties are arrived at
        differs, so a notice generated here and one generated there from the same
        contract are the same notice.


        A bilateral contract states the two parties outright, as its
        `dataProvider` and its `dataConsumer`. An ecosystem contract names N
        members and no two of them inherently, so the sides are read off the
        evidence it carries: the role it records for a still-bound member, and
        where it records none, who offers a service under it — a member offering
        a service is on the providing side. Members it has revoked are left out
        of both sides. The derivation must land on exactly one party per side.


        An ecosystem contract that admits more than one party on a side, or none,
        is `400` saying how many were found on each side. That is a refusal
        rather than a guess because the notice is a published legal document and
        naming a party the contract never put there is worse than declining:
        declare the two parties with `POST /privacy-notices` instead, which is
        the same operation with the ambiguity resolved by the caller. A contract
        this service cannot reach is still `502`, and a party the contract names
        but this service has no active registration for is still `404`.
      tags:
        - Privacy Notices
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateByContract"
      responses:
        "200":
          description: >
            An active notice with exactly this content already existed and was
            returned unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "201":
          description: >
            The notice was generated by this request; any previous active notice
            for the same contract and provider was archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Concurrent generations are contending for this contract and
            provider's one active notice faster than this request could claim
            it. Nothing was written; the request is safe to retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: >
            The Contract Service could not be reached, so the contract behind the
            notice could not be read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /privacy-notices/{id}:
    get:
      operationId: getPrivacyNotice
      summary: Retrieve a privacy notice
      description: >
        Returns a stored privacy notice, optionally with the documents it only
        names filled in.


        The notice is served as it was stored. `resolve=true`, the default,
        additionally dereferences what a contract names without describing — the
        contract itself for its current title and terms, the catalog
        self-descriptions behind `data`, the purposes the contract states, and
        this service's own registration for each recipient — and `resolution`
        reports per section how far that got.


        **Resolution never fails the request.** An unreachable Contract Service,
        an unreadable catalog document or a recipient this deployment has no
        registration for degrades the affected section to `UNAVAILABLE` and the
        notice is served anyway, with whatever did resolve in place and the
        stored values everywhere else. That is why no `502` is declared here,
        unlike on the two generating operations: a notice that cannot be
        displayed at all is worse than one displayed with a section marked
        unavailable.


        Two sections move together by construction. `purposes` is resolved from
        the contract, so a contract that could not be read degrades `purposes`
        with it; no other input degrades `purposes` alone. `dataResources` is two
        hops — each entry of `data` names a service offering, whose own document
        names the data resources behind it — and a failure at either hop marks
        the section `UNAVAILABLE` even though the entries that did resolve are
        still returned, because a partially filled list claiming `RESOLVED` would
        misreport itself.


        `resolve=false` makes no external request at all and reports
        `NOT_REQUESTED` for all four sections.


        An archived notice stays retrievable by id and carries `archivedAt`,
        because a consent given against it is still read against the notice that
        was published. Its catalog documents and recipients resolve as an active
        notice's do, but the contract is deliberately left unread and `contract`
        and `purposes` report `NOT_REQUESTED`: the notice was archived precisely
        because the contract changed, so reading the live one would print the
        superseding contract's title, purposes and terms under the superseded
        notice's id. Retrieval is deliberately not scoped to the notice's two
        parties: a user has to be able to read the notice they are being asked to
        consent to before any link to it exists.


        An `id` that is not a UUID is a `400`, not a `404`.
      tags:
        - Privacy Notices
      security:
        - bearerAuth: [USER, PARTICIPANT, CATALOG]
      x-roles: [USER, PARTICIPANT, CATALOG]
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the notice to return.
          schema:
            type: string
            format: uuid
        - name: resolve
          in: query
          required: false
          description: >
            Whether to dereference the documents the notice only names. False
            serves the stored notice and makes no external request.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: >
            The notice, with `resolution` reporting how far each section was
            filled in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents:
    post:
      operationId: grantConsent
      summary: Decide about a privacy notice
      description: >
        Records the calling data subject's decision about one privacy notice —
        consent granted, or consent refused — and returns the consent that
        decision created.


        **The subject is the token.** The body names a notice and a decision and
        nothing else; there is no property by which a caller could record a
        decision for another person, and a user identifier, email or key sent
        alongside is ignored rather than honoured. Only a `USER` token reaches
        this operation: a participant asks for consent with
        `POST /consents/requests`, which creates a `PENDING` record conferring
        nothing, and no operation anywhere lets a participant grant on a
        subject's behalf.


        The notice must exist — `404` otherwise — and must still be the active
        notice for its contract: an archived notice states terms no longer in
        force, and deciding against it is `400`. `purposes` and `data` elect
        part of the notice's terms, and an election naming anything the notice
        does not declare, or electing nothing at all, is `400`. Whatever is
        elected is frozen onto the consent together with the notice's title and
        the contract it was given under, so the record stays evidence of what
        was agreed even after the notice is regenerated.


        A decision supersedes whatever the subject had already recorded for the
        same notice: a record still in force is revoked in the same transaction,
        and the new record names the most recent previous record — whatever its
        status — as its `parentConsentId`, which is what makes the chain
        readable backwards. A predecessor that had already ended, as a refusal,
        an expiry or a termination, is linked but not written to: its status
        does not change. One record per subject and notice is in force at a time
        and the database enforces it, so two decisions submitted at once cannot
        both stand — the one that loses the race is answered `409` and is safe
        to resubmit against the record it can then read.


        **Answering an open request returns that record, not a new one.** Where
        a participant has already asked for this consent with
        `POST /consents/requests` and the request is still `PENDING`, the
        decision is written onto that record: the response carries the `id` the
        request was created with and the `parentConsentId` the request already
        had — re-pointed only where the same decision also closed a grant that
        was still in force — so a client that answers a request must not expect
        a fresh identifier or a new parent link. `createdAt` then dates the
        request — when consent was asked for — and `updatedAt` dates the last
        change to the record, which is the decision until a revocation, a
        termination or an expiry re-dates it. The status code says which of the
        two happened: `201` for a record this decision created, `200` for a
        request it answered in place. Only where no request is open does a
        decision create a record of its own.
      tags:
        - Consents
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantConsent"
      responses:
        "200":
          description: >
            The decision answered a request that was already open; the body is
            that record, carrying the identifier it was created with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "201":
          description: >
            The decision was recorded; the body is the consent it created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/requests:
    post:
      operationId: requestConsent
      summary: Ask a user to decide about a privacy notice
      description: >
        Opens a request that one of the calling participant's users decide on a
        privacy notice, and returns the `PENDING` consent the request created.


        **A request confers nothing.** The record it opens is `PENDING` and
        `consented` is `false`; it states that the question was put, not that it
        was answered, and no data may flow on the strength of it. Only the
        subject can answer, with `POST /consents`, which writes the decision
        onto this very record rather than creating a second one - so the
        identifier returned here is the identifier the answered consent will
        carry.


        The request elects no scope. It is opened over the notice's full terms,
        and narrowing them is the subject's to do when deciding: a scope
        proposed by the party that wants the data would read back afterwards as
        something the subject had agreed to.


        **The asking participant is the token.** The body names a notice and a
        subject, and there is no property by which one participant could put the
        question in another's name. The notice must exist and still be the
        active notice for its contract - `404` and `400` respectively - and must
        name the caller as its provider or its consumer, since either has
        business asking and nobody else does: `403` otherwise. The subject must
        already be linked to the caller; an identifier naming no user and one
        naming a user affiliated with somebody else are answered alike, with
        `404`, so this route cannot be used to find out which users the service
        holds. Where the pair already holds a record still in force - an open
        request or a consent granted - the answer is `409`, and the existing
        record is the one to read.
      tags:
        - Consent Requests
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: >
            The request was opened; the body is the `PENDING` consent it
            created, which confers nothing until the subject decides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/{id}/revoke:
    post:
      operationId: revokeConsent
      summary: Revoke a consent in force
      description: >
        Withdraws a consent the calling data subject has given, with effect from
        the moment this call returns.


        Only the subject named by the consent reaches it. A consent belonging to
        anyone else is a `404` rather than a `403`, so the route cannot be used
        to learn which consent identifiers exist.


        Revocation is permitted from `GRANTED` and from nothing else: a consent
        already revoked, refused, terminated or expired is `400` naming both the
        status it holds and the one attempted, and an unanswered request is
        declined with `POST /consents/{id}/refuse` rather than revoked. The move
        and the audit event recording it are written in one transaction, so a
        status without its event cannot occur, and two revocations sent at once
        cannot both append one — the second reads the record as the first left
        it and is answered `400`.


        **`DELETE` is deliberately not the verb.** Nothing is deleted: the
        record stays readable in status `REVOKED`, carrying the terms that were
        agreed and the trail of who ended it, because that is what the consent
        is evidence of.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to revoke.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            The consent was revoked; the body is the record in its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/{id}/refuse:
    post:
      operationId: refuseConsent
      summary: Decline an unanswered consent request
      description: >
        Records that the calling data subject declines a request a participant
        opened with `POST /consents/requests`.


        Only the subject named by the consent reaches it. A consent belonging to
        anyone else is a `404` rather than a `403`, for the same reason
        revocation is.


        Refusal is permitted from `PENDING` and `DRAFT` — the two statuses in
        which nothing has been answered yet — and from nothing else. A consent
        in any other status, `GRANTED` included, is `400` naming both the status
        it holds and the one attempted: consent already given is withdrawn with
        `POST /consents/{id}/revoke`, which is the mirror image of this
        operation and is permitted from `GRANTED` only. The move and its audit
        event are written in one transaction, and a second refusal sent
        concurrently reads the record as the first left it and is answered
        `400`.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to refuse.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            The request was declined; the body is the record in its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /consents/{id}/terminate:
    post:
      operationId: terminateConsent
      summary: Terminate a consent as a participant party to it
      description: >
        Ends an arrangement from the organisational side: the calling
        participant, named by the consent as provider or as consumer, records
        that it no longer rests on this consent.


        This is not the data subject withdrawing — that is `POST
        /consents/{id}/revoke`, and only the subject reaches it. Termination
        says the party has ended the arrangement, and the record stays readable
        in status `TERMINATED` carrying the terms that applied and the trail of
        who ended it.


        A participant the consent names on neither side is `403`, not the `404`
        a foreign *user* gets on the subject's routes: a participant that is
        party to nothing may still legitimately know the consent exists through
        its own records, so there is nothing to conceal from it, and the honest
        answer is that it has no standing here. A participant whose registration
        has been withdrawn is `403` for the same reason it reaches no other
        route that acts in the dataspace in its name.


        Termination is permitted from `GRANTED`, and equally from `PENDING` and
        `DRAFT` — a party may end an arrangement whether or not the subject has
        answered yet, and an unanswered request it ends is terminated rather
        than refused, so a client must not expect a `400` there. The statuses
        refused are exactly the terminal ones — `REVOKED`, `REFUSED`,
        `TERMINATED` and `EXPIRED` — each `400` naming both the status held and
        the one attempted. The move and its audit event are written in one
        transaction, and a second termination sent concurrently reads the record
        as the first left it and is answered `400`.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth: [PARTICIPANT]
      x-roles: [PARTICIPANT]
      x-principal: ParticipantPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to terminate.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            The consent was terminated; the body is the record in its new
            status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/{id}/re-confirm:
    post:
      operationId: reConfirmConsent
      summary: Re-confirm a consent in force
      description: >
        Records that the calling data subject still stands by a consent that is
        already in force.


        **Nothing about the consent changes.** The status stays `GRANTED`, the
        terms stay as they were agreed, and `updatedAt` is left alone because it
        dates state changes and this is not one. What the call produces is a
        single `CONSENT_RE_CONFIRMED` entry in the audit trail, dated in its own
        right, so a deployment that asks its subjects to reaffirm periodically
        can show when each of them last did. The body read back is the record,
        unchanged, so a client need not fetch it again.


        Only the subject named by the consent reaches it; a consent belonging to
        anyone else is a `404`, as on every other subject route here.
        Re-confirmation is permitted from `GRANTED` and from nothing else — a
        consent that was never given, or that has since been revoked, refused,
        terminated or expired, is `400` naming the status it holds. A consent
        revoked between the caller reading it and this call is refused for the
        same reason, so an affirmation is never appended to a consent no longer
        in force.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to re-confirm.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >
            The affirmation was recorded; the body is the consent, unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/{id}/resume:
    post:
      operationId: resumeConsent
      summary: Resume an unanswered consent as granted
      description: >
        Grants a consent that was requested but never answered, addressed by its
        own identifier.


        The move is `PENDING` or `DRAFT` to `GRANTED`; a consent already decided
        — granted, revoked, refused, terminated or expired — is `400` naming the
        status it holds. The record is answered in place, so the response
        carries the identifier the request was created with and `createdAt`
        still dates the ask.


        **Two kinds of caller reach it.** A `USER` token resumes its own
        consent and states nothing: the body may be omitted entirely, and a
        `userIdentifier` sent anyway is ignored. A `CATALOG` token relays a
        decision the subject took in the catalog's own flow — the flow this
        operation resumes — and must name that subject with `userIdentifier`,
        which is `400` when absent. The identifier is checked against the
        consent this path addresses rather than used to find one: naming anybody
        but that consent's subject is `404`, so a catalog cannot choose whose
        consent it grants. Nor can it choose the notice or create a record: it
        can only advance one that already exists and is still open. See
        ADR-0010.


        **The audit trail says which happened.** A relayed grant records the
        relaying catalog as `catalog:<issuer>:<sub>`, a subject's own records
        the subject's identifier, so a reader can always tell one from the
        other.


        The notice must still be the active notice for its contract. A request
        can sit unanswered long enough for its notice to be regenerated, and
        resuming against an archived one would record a grant under terms no
        longer in force, so that is `400` — the same refusal `POST /consents`
        gives — as is a notice naming no data consumer. The terms the record was
        opened with are kept exactly as stored: a resume records a decision
        taken elsewhere rather than electing scope here, and where the notice
        has moved on the subject answers the new one through `POST /consents`.


        Recording the grant supersedes whatever consent is in force for the same
        subject and notice: that record is revoked in the same transaction, and
        the resumed record's `parentConsentId` is re-pointed at it. Where
        nothing was in force the link is left exactly as the request had it. One
        record per subject and notice is in force at a time and the database
        enforces it, so a grant recorded concurrently is answered `409` and is
        safe to retry against the record it can then read.


        Any other request for the same subject and notice that is still
        unanswered is closed as redundant in that same transaction. A question
        left standing once this one is answered would refuse every later request
        for the pair as a duplicate, with no way back for a caller that cannot
        reach `POST /consents`.
      tags:
        - Consent Lifecycle
      security:
        - bearerAuth: [USER, CATALOG]
      x-roles: [USER, CATALOG]
      x-principal: ConsentManagerPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to resume.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        description: >
          Required of a `CATALOG` caller, which must name the subject whose
          decision it relays. A `USER` caller may omit it.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeConsent"
      responses:
        "200":
          description: >
            The consent was granted; the body is the record, carrying the
            identifier it was requested with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/me:
    get:
      operationId: listMyConsents
      summary: List the calling subject's consents
      description: >
        Returns a page of the consents that name the calling data subject, so a
        person can see every decision recorded about them and where each one
        stands.


        **The subject is the token.** The page carries only consents whose
        `user_id` is the one the token resolved; there is no parameter by which a
        caller could read another person's decisions, and one sent alongside is
        ignored rather than honoured.


        `status` narrows the page to the lifecycle states it names - repeat it to
        admit several - and `privacyNoticeId` to the decisions taken against one
        notice. Both are counted under the same filter as the content, so
        `totalElements` is the number of the caller's consents the filter
        matches and never the size of their whole history.


        Neither the default page size nor the largest one accepted is written in
        this document, because a literal here could not track a value each
        deployment configures. Omitting `size` applies the configured default,
        and a `size` above the configured ceiling is clamped to it and answered
        `200` rather than rejected; the `size` of the response always reports the
        value actually applied.


        `format` and `includeLineage` are accepted and shape a later elaboration
        of the response - a consent receipt, and the chain a decision
        supersedes. Until those land, every value renders the same full
        representation with no lineage.
      tags:
        - ConsentQuery
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based index of the page to return.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: >
            How many records the page may carry. Omitted, this deployment's
            configured default applies; above its configured ceiling, the
            ceiling applies.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: status
          in: query
          required: false
          description: >
            Return only consents in these lifecycle states. Repeat the parameter
            to admit several; omitted, every state is included.
          schema:
            type: array
            items:
              type: string
              enum:
                - PENDING
                - DRAFT
                - GRANTED
                - REVOKED
                - EXPIRED
                - TERMINATED
                - REFUSED
        - name: privacyNoticeId
          in: query
          required: false
          description: Return only consents decided against this privacy notice.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: >
            The representation each consent is returned in. `full` is the
            consent as a query renders it; `receipt` and `receipt-kantara` are
            the signed consent receipts a later step adds.
          schema:
            type: string
            enum:
              - full
              - receipt
              - receipt-kantara
            default: full
        - name: includeLineage
          in: query
          required: false
          description: >
            Whether to include the chain of consents each record supersedes. A
            later step wires it; until then the lineage is always absent.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The requested page of the caller's consents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /consents/me/{id}:
    get:
      operationId: getMyConsent
      summary: Read one of the calling subject's consents
      description: >
        Returns one consent the calling data subject owns, identified by its id.


        **The subject is the token.** A consent the caller does not own is
        answered `404` exactly as an unknown id is, so the response never lets a
        caller learn that a consent exists while refusing to show it.


        `format` and `includeLineage` are accepted and shape a later elaboration
        of the response, as on the listing; until those land, every value
        renders the same full representation with no lineage.
      tags:
        - ConsentQuery
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the consent to read.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: >
            The representation the consent is returned in, as on the listing.
          schema:
            type: string
            enum:
              - full
              - receipt
              - receipt-kantara
            default: full
        - name: includeLineage
          in: query
          required: false
          description: >
            Whether to include the chain of consents this record supersedes, as
            on the listing.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The requested consent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    bearerAuth:
      $ref: "./components/security.yaml#/securitySchemes/bearerAuth"

  schemas:
    ApiStatus:
      $ref: "./components/schemas/ApiStatus.yaml"

    ProblemDetail:
      $ref: "./components/schemas/ProblemDetail.yaml"

    User:
      $ref: "./components/schemas/User.yaml"

    UserSearch:
      $ref: "./components/schemas/UserSearch.yaml"

    ErasureSummary:
      $ref: "./components/schemas/ErasureSummary.yaml"

    UserRegistration:
      $ref: "./components/schemas/UserRegistration.yaml"

    UserRegistrationResult:
      $ref: "./components/schemas/UserRegistrationResult.yaml"

    Participant:
      $ref: "./components/schemas/Participant.yaml"

    ParticipantLegalPerson:
      $ref: "./components/schemas/ParticipantLegalPerson.yaml"

    ParticipantEndpoints:
      $ref: "./components/schemas/ParticipantEndpoints.yaml"

    ParticipantRegistration:
      $ref: "./components/schemas/ParticipantRegistration.yaml"

    ParticipantUpdate:
      $ref: "./components/schemas/ParticipantUpdate.yaml"

    DeregistrationSummary:
      $ref: "./components/schemas/DeregistrationSummary.yaml"

    ParticipantUserLink:
      $ref: "./components/schemas/ParticipantUserLink.yaml"

    ParticipantUserLinkUpdate:
      $ref: "./components/schemas/ParticipantUserLinkUpdate.yaml"

    BulkUserRegistrationEntry:
      $ref: "./components/schemas/BulkUserRegistrationEntry.yaml"

    BulkRegistrationEntryResult:
      $ref: "./components/schemas/BulkRegistrationEntryResult.yaml"

    BulkRegistrationSummary:
      $ref: "./components/schemas/BulkRegistrationSummary.yaml"

    PrivacyNotice:
      $ref: "./components/schemas/PrivacyNotice.yaml"

    GeneratePrivacyNotice:
      $ref: "./components/schemas/GeneratePrivacyNotice.yaml"

    GenerateByContract:
      $ref: "./components/schemas/GenerateByContract.yaml"

    PrivacyNoticeResolution:
      $ref: "./components/schemas/PrivacyNoticeResolution.yaml"

    ResolutionState:
      $ref: "./components/schemas/ResolutionState.yaml"

    Consent:
      $ref: "./components/schemas/Consent.yaml"

    ConsentResponse:
      $ref: "./components/schemas/ConsentResponse.yaml"

    GrantConsent:
      $ref: "./components/schemas/GrantConsent.yaml"

    ConsentRequest:
      $ref: "./components/schemas/ConsentRequest.yaml"

    ResumeConsent:
      $ref: "./components/schemas/ResumeConsent.yaml"

    # The three wrappers below are the only schemas written out here rather than
    # under components/schemas/, and the reason is a generator limitation rather
    # than a change of convention: a `$ref` under `items` resolves to the named
    # model only when it is same-document. Written inside an externalised file,
    # `items: {$ref: "./BulkUserRegistrationEntry.yaml"}` silently degrades to
    # `List<Object>` and the batch arrives untyped. Each is a thin shell around
    # one array; the element schemas above carry the documentation.
    BulkUserRegistration:
      type: object
      description: >
        A batch of users a participant asks to have registered and linked to
        itself, each entry applied independently of the others.
      properties:
        users:
          type: array
          description: >
            The entries, applied in the order given and answered in that same
            order. An empty array is accepted and does nothing; how many entries
            one batch may carry is configured per deployment.
          items:
            $ref: "#/components/schemas/BulkUserRegistrationEntry"
      required:
        - users

    BulkRegistrationResult:
      type: object
      description: >
        What a bulk registration did, entry by entry and in total.
      properties:
        results:
          type: array
          description: One result per entry sent, in the order the entries were sent.
          items:
            $ref: "#/components/schemas/BulkRegistrationEntryResult"
        summary:
          $ref: "#/components/schemas/BulkRegistrationSummary"
      required:
        - results
        - summary

    ParticipantPage:
      type: object
      description: >
        One page of the participant directory, with enough of the whole to page
        through it without a second request.
      properties:
        content:
          type: array
          description: >
            The records of this page, ordered by `identifier`. Empty when the
            requested page lies past the end of the directory, which is a `200`
            rather than a `404` - the page is a view of a collection, not a
            record that does or does not exist.
          items:
            $ref: "#/components/schemas/Participant"
        page:
          type: integer
          format: int32
          description: Zero-based index of this page, as requested.
        size:
          type: integer
          format: int32
          description: >
            Records this page was allowed to carry, which is the value actually
            applied: the configured default when `size` was omitted, and the
            configured ceiling when the requested `size` exceeded it.
        totalElements:
          type: integer
          format: int64
          description: >
            Records the query matches across every page, counted under the same
            filter - so with deregistered participants excluded unless an
            `identifier` filter was given.
        totalPages:
          type: integer
          format: int32
          description: >
            Pages the matching records occupy at the applied `size`; zero when
            nothing matches.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages

    # Declared inline, with `items` an internal ref, because that is the only
    # form proven to generate a typed `List<ConsentResponse>` rather than a
    # `List<Object>`; see the note ParticipantPage carries.
    ConsentPage:
      type: object
      description: >
        One page of a subject's consents, with enough of the whole to page
        through it without a second request.
      properties:
        content:
          type: array
          description: >
            The consents of this page. Empty when the requested page lies past
            the end of the result, which is a `200` rather than a `404` - the
            page is a view of a collection, not a record that does or does not
            exist.
          items:
            $ref: "#/components/schemas/ConsentResponse"
        page:
          type: integer
          format: int32
          description: Zero-based index of this page, as requested.
        size:
          type: integer
          format: int32
          description: >
            Records this page was allowed to carry, which is the value actually
            applied: the configured default when `size` was omitted, and the
            configured ceiling when the requested `size` exceeded it.
        totalElements:
          type: integer
          format: int64
          description: >
            Consents the query matches across every page, counted under the same
            filter the content was - so narrowed by `status` and
            `privacyNoticeId` when either was given.
        totalPages:
          type: integer
          format: int32
          description: >
            Pages the matching consents occupy at the applied `size`; zero when
            nothing matches.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages

  responses:
    # Shared error responses referenced by every secured operation. `/api-status`
    # is declared `security: []` and therefore references neither.
    Unauthorized:
      $ref: "./components/responses/Unauthorized.yaml"

    Forbidden:
      $ref: "./components/responses/Forbidden.yaml"

    # Client-error responses an operation references when it can actually produce
    # them. Unlike the two above these are not enforced for every secured
    # operation: whether a request body can fail validation, address a missing
    # resource or conflict with existing state is a fact about the operation.
    BadRequest:
      $ref: "./components/responses/BadRequest.yaml"

    NotFound:
      $ref: "./components/responses/NotFound.yaml"

    Conflict:
      $ref: "./components/responses/Conflict.yaml"
