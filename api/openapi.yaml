openapi: "3.0.3"
info:
  title: Consent Manager API
  description: |
    Consent lifecycle management API. Provides endpoints for creating,
    revoking, and querying consent records.

    ## Authentication and authorization

    The Consent Manager is a stateless OAuth2 **resource server**. Every operation
    except the public `/api-status` reachability probe requires a bearer JWT issued
    by one of the identity providers on the service's trust list, which is read
    from configuration once at startup and is fixed for the life of the process.
    The complete token contract — every claim, its optionality, the configurable
    claim names and the accepted signature algorithms — is documented on the
    `bearerAuth` security scheme.

    Three roles are recognised:

    - `USER` — a natural person, who may manage and read their own consent records.
    - `PARTICIPANT` — a dataspace participant, which may manage and read consent
      records relating to itself.
    - `CATALOG` — the dataspace catalog service, which may read consent state
      across the dataspace. A "catalog token" is simply a participant access token
      carrying this role.

    Failures are reported as RFC 7807 problem details and distinguish the two
    cases: a request that fails **authentication** receives `401 Unauthorized`
    (missing, malformed, expired, incorrectly signed or untrusted token, with the
    body revealing nothing about which), while a request that authenticates but
    lacks the role required by the operation receives `403 Forbidden`.
  version: "0.1.0"
  contact:
    name: Seamware
servers:
  - url: /v1
    description: Default server (behind API context path)

# Every operation requires a bearer token unless it overrides this with its own
# `security` entry.
security:
  - bearerAuth: []

paths:
  /api-status:
    get:
      operationId: getApiStatus
      summary: API status check
      description: >
        Returns a simple status indicator confirming the API is reachable.
        This is a public reachability probe: it requires no authentication and
        exposes no consent data.
      tags:
        - Status
      # Public endpoint: overrides the global bearerAuth requirement.
      security: []
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatus"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /users/register:
    post:
      operationId: registerUser
      summary: Register the calling user
      description: >
        Registers the natural person the bearer token names and returns their
        record. The identity is taken entirely from the token — there is no
        request body, and a caller cannot register anybody but themselves.


        The record is keyed on the global user identifier the token asserts, so
        the operation is idempotent: `201 Created` the first time this service
        sees the identifier, `200 OK` on every later call, with the same body.
        Registration is the same code path as the just-in-time provisioning
        every other authenticated route performs, so a user first seen through
        another endpoint is already registered and receives `200` here.
      tags:
        - Users
      security:
        - bearerAuth: [USER]
      # `security` is the published contract; `x-roles` and `x-principal` are what
      # the generator reads. `x-roles` becomes the routed method's @Secured rule -
      # without it the generator emits @Secured(IS_AUTHENTICATED), which would let
      # any authenticated token through - and `x-principal` adds the typed caller
      # parameter PrincipalResolutionFilter keys on. Both must agree with
      # `security`, and SpecSecurityConsistencyTest fails the build when they do
      # not. Every secured operation below repeats all three.
      x-roles: [USER]
      x-principal: UserPrincipal
      responses:
        "200":
          description: The user was already registered; the existing record is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: The user was registered by this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /users/me:
    get:
      operationId: getCurrentUser
      summary: Read the calling user's own record
      description: >
        Returns the record of the natural person the bearer token names,
        including the identifiers of the participants they are linked to. The
        record is created on first sight, so this operation does not report
        `404` for an otherwise valid user token.
      tags:
        - Users
      security:
        - bearerAuth: [USER]
      x-roles: [USER]
      x-principal: UserPrincipal
      responses:
        "200":
          description: The caller's own user record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    bearerAuth:
      $ref: "./components/security.yaml#/securitySchemes/bearerAuth"

  schemas:
    ApiStatus:
      $ref: "./components/schemas/ApiStatus.yaml"

    ProblemDetail:
      $ref: "./components/schemas/ProblemDetail.yaml"

    User:
      $ref: "./components/schemas/User.yaml"

  responses:
    # Shared error responses referenced by every secured operation. `/api-status`
    # is declared `security: []` and therefore references neither.
    Unauthorized:
      $ref: "./components/responses/Unauthorized.yaml"

    Forbidden:
      $ref: "./components/responses/Forbidden.yaml"

    # Client-error responses an operation references when it can actually produce
    # them. Unlike the two above these are not enforced for every secured
    # operation: whether a request body can fail validation, address a missing
    # resource or conflict with existing state is a fact about the operation.
    BadRequest:
      $ref: "./components/responses/BadRequest.yaml"

    NotFound:
      $ref: "./components/responses/NotFound.yaml"

    Conflict:
      $ref: "./components/responses/Conflict.yaml"
